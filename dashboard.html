  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Dashboard Κερδοφορίας</title>
    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
         #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; 
            visibility: hidden !important; 
            height: 0 !important; 
        }
        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark: #0f172a;
            --triton-bg: #f8fafc; 
            --triton-border: #e2e8f0; 
        }
        
        body { 
            background: #e2e8f0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        /* Container προσαρμοσμένο για Iframe */
        .dashboard-container { 
            max-width: 1100px; 
            margin: 100px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }

        .dash-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--triton-blue); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        } 

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--triton-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--triton-border); border-bottom: 4px solid var(--triton-blue); }
        .stat-card label { display: block; font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 26px; font-weight: 900; color: #0f172a; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 12px; text-align: left; font-size: 12px; color: #475569; border-bottom: 2px solid #cbd5e1; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn-clear { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-clear:hover { background: #e2e8f0; }

        /* Hide elements when in iframe */
        .nav-header { display: none; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="dash-header">
        <h1 style="font-size: 1.5rem; margin: 0;">📊 Οικονομική Εικόνα</h1>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearHistory()">🧹 Καθαρισμός</button>
            <button class="btn-clear" style="background: #059669; color: white; border: none;" onclick="exportToExcel()">📥 Excel</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <label>Τζίρος (Προ ΦΠΑ)</label>
            <div id="totalSales" class="value">0,00 €</div>
        </div>
        <div class="stat-card">
            <label style="color: #059669;">Πραγματικό Κέρδος</label>
            <div id="totalProfit" class="value" style="color: #059669;">0,00 €</div>
        </div>
        <div class="stat-card">
            <label>Margin (%)</label>
            <div id="avgMargin" class="value">0,0%</div>
        </div>
    </div>

    <h3 style="color: var(--triton-dark); margin-bottom: 15px;">📜 Ιστορικό Πωλήσεων</h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Ημερομηνία</th>
                    <th>Πελάτης</th>
                    <th>Καθαρή Αξία</th>
                    <th>Κέρδος</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ΣΥΝΑΡΤΗΣΗ ΕΝΤΟΠΙΣΜΟΥ IFRAME
    if (window.self !== window.top) {
        document.body.style.background = "white"; // Πιο καθαρό look μέσα στην Index
        document.querySelector('.dashboard-container').style.boxShadow = "none";
        document.querySelector('.dashboard-container').style.margin = "0";
    }

    function loadDashboard() {
        const history = JSON.parse(localStorage.getItem('triton_sales_history') || '[]');
        const tableBody = document.getElementById('historyTableBody');
        let sumSales = 0, sumProfit = 0;
        tableBody.innerHTML = '';

        [...history].reverse().forEach(sale => {
            sumSales += (sale.totalNet || 0);
            sumProfit += (sale.profit || 0);
            const margin = sale.totalNet > 0 ? (sale.profit / sale.totalNet * 100).toFixed(1) : 0;
            
            tableBody.innerHTML += `<tr>
                <td>${new Date(sale.date).toLocaleDateString('el-GR')}</td>
                <td>${sale.customer || 'Λιανική'}</td>
                <td>${(sale.totalNet || 0).toLocaleString('el-GR', {minimumFractionDigits: 2})} €</td>
                <td style="color: #059669; font-weight:bold;">${(sale.profit || 0).toLocaleString('el-GR', {minimumFractionDigits: 2})} €</td>
                <td>${margin}%</td>
            </tr>`;
        });

        document.getElementById('totalSales').innerText = sumSales.toLocaleString('el-GR', {minimumFractionDigits: 2}) + " €";
        document.getElementById('totalProfit').innerText = sumProfit.toLocaleString('el-GR', {minimumFractionDigits: 2}) + " €";
        document.getElementById('avgMargin').innerText = (sumSales > 0 ? (sumProfit / sumSales * 100).toFixed(1) : 0).replace('.', ',') + "%";
    }

    function clearHistory() {
        if (confirm("Προσοχή! Θέλετε να διαγράψετε οριστικά το ιστορικό πωλήσεων;")) {
            localStorage.setItem('triton_sales_history', '[]');
            loadDashboard();
        }
    }

    function exportToExcel() {
        const history = JSON.parse(localStorage.getItem('triton_sales_history') || '[]');
        if(history.length === 0) { alert("Δεν υπάρχουν δεδομένα για εξαγωγή."); return; }
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFΗμερομηνία,Πελάτης,Καθαρή Αξία,Κέρδος\n";
        history.forEach(sale => {
            csvContent += `${new Date(sale.date).toLocaleDateString('el-GR')},${(sale.customer || "Λιανική")},${sale.totalNet.toFixed(2)},${sale.profit.toFixed(2)}\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `Triton_Report_${new Date().toISOString().slice(0,10)}.csv`);
        link.click();
    }

    window.onload = loadDashboard;
</script>
</body>
</html>
