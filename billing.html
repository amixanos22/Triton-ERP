  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Έκδοση Παραστατικού</title>
    <style>
        /* ΚΡΥΒΕΙ ΤΗΝ ΜΠΑΡΑ ΤΟΥ BLOGGER & sidebar αν είναι σε iframe */
        #navbar-iframe, .navbar, .navbar-spaced, .sidebar, .top-bar { display: none !important; }
        body { top: 0 !important; background: #f1f5f9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }

        /* CSS για να καταλαμβάνει όλο το χώρο στο παράθυρο */
        body.is-window { padding: 10px; }
        #invoice-container { 
            width: 95%; max-width: 1000px; margin: auto; background: white; padding: 40px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1); min-height: 1000px;
        }

        :root { --triton-blue: #0ea5e9; --triton-dark: #1e293b; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 20px; }
        .logo img { max-height: 100px; max-width: 250px; object-fit: contain; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #f8fafc; padding: 15px; border-left: 5px solid var(--triton-blue); border-radius: 4px; }
        input, select { width: 100%; border: none; border-bottom: 1px solid #cbd5e1; background: transparent; padding: 5px; margin-bottom: 8px; outline: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; padding: 10px; text-align: left; border-bottom: 2px solid #000; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .total-section { margin-top: 30px; text-align: right; }
        .grand-total { font-size: 24px; font-weight: bold; color: var(--triton-blue); }
        
        @media print { .no-print { display: none !important; } #invoice-container { box-shadow: none; width: 100%; padding: 0; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="is-window">

<div id="invoice-container">
   <div class="header">
    <div id="logoArea" class="logo">
        <h1 style="color:var(--triton-blue); margin:0;">🔱 TRITON</h1>
    </div>
    <div id="compInfo" style="text-align: right;">
        <h2 id="dispCompName" style="margin:0; color:var(--triton-dark);">ΦΟΡΤΩΣΗ...</h2>
        <p id="dispAddress" style="margin:0; font-size:13px; color:#64748b;"></p>
        <h3 id="docTitle" style="color:var(--triton-blue); margin:10px 0 0 0; text-transform: uppercase;">ΠΑΡΑΣΤΑΤΙΚΟ</h3>
        <p id="currentDate" style="margin:0; font-weight:bold;">--/--/----</p>
    </div>
</div>
    <div class="card-grid">
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <label style="font-size:10px; font-weight:bold;">ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ</label>
                <button onclick="lookupMyData()" class="no-print" style="cursor:pointer; background:var(--triton-blue); color:white; border:none; border-radius:3px; padding:2px 5px; font-size:10px;">🔍 myDATA</button>
            </div> 
            <input id="cName" list="custList" placeholder="Επωνυμία"> 
            <input id="cAfm" placeholder="ΑΦΜ"> 
            <input id="cAddr" placeholder="Διεύθυνση"> 
            <input id="cCity" placeholder="Πόλη"> 
        </div> 
        
        <div class="card" style="border-left-color: #64748b;"> 
            <label style="font-size:10px; font-weight:bold;">ΔΙΑΚΙΝΗΣΗ / ΠΑΡΑΔΟΣΗ</label> 
            <input id="purpose" value="ΠΩΛΗΣΗ"> 
            <input id="car" placeholder="Αρ. Αυτοκινήτου"> 
            <input id="delivery" list="branchList" placeholder="Τόπος Παράδοσης"> 
            <datalist id="branchList"></datalist> 
        </div> 
    </div>

    <table id="itemsTable">
        <thead>
            <tr>
                <th style="width:50%">ΠΕΡΙΓΡΑΦΗ</th>
                <th style="width:10%">ΠΟΣ.</th>
                <th style="width:15%">ΤΙΜΗ</th>
                <th style="width:10%">ΦΠΑ %</th>
                <th style="width:15%; text-align:right;">ΣΥΝΟΛΟ</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <div class="total-section">
        <div class="no-print" style="background: #f0fdf4; border: 1px solid #22c55e; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <div style="color: #166534; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Εκτιμώμενο Κέρδος</div>
            <div id="profitVal" style="font-size: 24px; font-weight: bold; color: #15803d;">0.00 €</div>
        </div>

        <p style="margin: 5px 0;">ΚΑΘΑΡΗ ΑΞΙΑ: <span id="pNetVal" style="font-weight: bold;">0.00 €</span></p>
        <p style="margin: 5px 0;">ΦΠΑ: <span id="pTaxVal" style="font-weight: bold;">0.00 €</span></p>
        <p class="grand-total" style="margin-top: 10px; border-top: 2px solid #000; padding-top: 10px;">ΣΥΝΟΛΟ: <span id="pGrandVal">0.00 €</span></p>
        
        <div class="no-print" style="margin-top: 25px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; text-align: left;">
            <label style="font-size: 11px; font-weight: bold; color: var(--triton-dark); display: block; margin-bottom: 5px;">ΑΠΟΣΤΟΛΗ ΣΕ EMAIL:</label>
            <select id="emailSelect" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 4px; background: white;">
                <option value="">Επιλέξτε email πελάτη...</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.print()" style="flex: 1; padding: 12px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">ΕΚΤΥΠΩΣΗ</button>
                <button onclick="handleExport('email')" id="sendEmailBtn" style="flex: 2; padding: 12px; background: var(--triton-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">PDF & ΑΠΟΣΤΟΛΗ</button>
            </div>
        </div>
    </div>
</div>

<datalist id="custList"></datalist>
<datalist id="prodList"></datalist>

<script>
const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_8lbtn4itPf_AD8UYz_rPMg_VvBBqY4G';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

// ΑΥΤΟΜΑΤΟΣ ΤΙΤΛΟΣ ΠΑΡΑΣΤΑΤΙΚΟΥ
function setupDocType() {
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const titleElem = document.getElementById('docTitle');
    
    const types = {
        'TIM': 'Τιμολόγιο & Δελτίο Αποστολής',
        'DA': 'Δελτίο Αποστολής',
        'PIS': 'Πιστωτικό Τιμολόγιο',
        'PIS_SYS': 'Πιστωτικό Συσχετιζόμενο',
        'A-EISP': 'Απόδειξη Είσπραξης',
        'A-PLHR': 'Απόδειξη Πληρωμής'
    };
    
    if(type && types[type]) {
        titleElem.innerText = types[type];
        // Αλλαγή χρώματος αν είναι Πιστωτικό (κόκκινο)
        if(type.includes('PIS')) titleElem.style.color = '#ef4444';
        // Αλλαγή χρώματος αν είναι Απόδειξη (πράσινο)
        if(type.includes('A-')) titleElem.style.color = '#22c55e';
    }
}


  async function loadProfile(userId) {
    try {
        const { data: profile, error } = await _supabase
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .maybeSingle();

        if (error) throw error;

        if (profile) {
            // Ενημέρωση Επωνυμίας
            const nameEl = document.getElementById('dispCompName');
            if (nameEl) nameEl.innerText = profile.company_name || "🔱 TRITON ERP";

            // Ενημέρωση Διεύθυνσης & Στοιχείων
            const addrEl = document.getElementById('dispAddress');
            if (addrEl) {
                const address = profile.address || '';
                const city = profile.city || '';
                const afm = profile.afm || profile.tax_id || '';
                const phone = profile.phone || '';
                addrEl.innerHTML = `${address}, ${city}<br>ΑΦΜ: ${afm} | Τηλ: ${phone}`;
            }

            // Ενημέρωση Logo (αν υπάρχει)
            const logoArea = document.getElementById('logoArea');
            if (logoArea && profile.logo_url) {
                logoArea.innerHTML = `<img src="${profile.logo_url}" style="max-height:80px;">`;
            }
            console.log("✅ Triton: Το προφίλ εκδότη φορτώθηκε!");
        }
    } catch (err) {
        console.error("❌ Σφάλμα φόρτωσης προφίλ:", err.message);
    }
}
  
function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" list="prodList" class="desc" placeholder="Προϊόν..." onchange="autoFillProductPrice(this)"></td>
        <td><input type="number" class="qty" value="1" oninput="recalc()"></td>
        <td><input type="number" class="price" value="0" oninput="recalc()"></td>
        <td><input type="number" class="tax" value="24" oninput="recalc()"></td>
        <td class="row-total" style="text-align:right; font-weight:bold;">0.00 €</td>
    `;
    document.getElementById('rows').appendChild(tr);
}

 
async function updateLists(userId) {
    // Φέρνουμε τα δεδομένα ταξινομημένα αλφαβητικά (.order)
    const { data: custs } = await _supabase
        .from('customers')
        .select('name')
        .eq('user_id', userId)
        .order('name', { ascending: true });

    const { data: prods } = await _supabase
        .from('products')
        .select('name')
        .eq('user_id', userId)
        .order('name', { ascending: true });
    
    const cL = document.getElementById('custList');
    const pL = document.getElementById('prodList');
    
    if(cL) cL.innerHTML = ''; 
    if(pL) pL.innerHTML = '';
    
    // Χρησιμοποιούμε .trim() για να μην έχουμε άκυρα κενά στις επιλογές
    if (custs) {
        custs.forEach(c => { 
            let o = document.createElement('option'); 
            o.value = c.name.trim(); 
            cL.appendChild(o); 
        });
    }
    
    if (prods) {
        prods.forEach(p => { 
            let o = document.createElement('option'); 
            o.value = p.name.trim(); 
            pL.appendChild(o); 
        });
    }
    console.log("Λίστες ενημερώθηκαν: ", { πελάτες: custs?.length, προϊόντα: prods?.length });
}

function recalc() {
    let netTotal = 0;
    let taxTotal = 0;
    
    document.querySelectorAll('#rows tr').forEach(row => {
        const q = parseFloat(row.querySelector('.qty').value) || 0;
        const p = parseFloat(row.querySelector('.price').value) || 0;
        const t = parseFloat(row.querySelector('.tax').value) || 0;
        
        const lineNet = q * p;
        const lineTax = lineNet * (t/100);
        const lineTotal = lineNet + lineTax;
        
        row.querySelector('.row-total').innerText = lineTotal.toFixed(2) + " €";
        netTotal += lineNet;
        taxTotal += lineTax;
    });

    document.getElementById('pNetVal').innerText = netTotal.toFixed(2) + " €";
    document.getElementById('pTaxVal').innerText = taxTotal.toFixed(2) + " €";
    document.getElementById('pGrandVal').innerText = (netTotal + taxTotal).toFixed(2) + " €";
}

async function autoFillProductPrice(inputElement) {
    const productName = inputElement.value.trim().toUpperCase();
    if (!productName || !currentUser) return;

    const { data: product } = await _supabase
        .from('products')
        .select('unit_price')
        .eq('user_id', currentUser.id)
        .eq('name', productName)
        .single();

    if (product) {
        const row = inputElement.closest('tr');
        const priceField = row.querySelector('.price');
        if (priceField) {
            priceField.value = product.unit_price;
            recalc();
        }
    }
}
  window.onload = async () => {
    setupDocType();
    const { data: { user } } = await _supabase.auth.getUser();

    if (user) {
        currentUser = user;
        await loadProfile(user.id);
        await updateLists(user.id);
        addRow(); // Προσθέτει την πρώτη γραμμή προϊόντος
    } else {
        // Αν δεν είναι συνδεδεμένος, στείλε τον στην αρχική
        window.location.href = "index.html";
    }
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('el-GR');
};
</script>

</body>
</html>
