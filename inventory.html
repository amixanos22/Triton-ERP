  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Inventory Popup</title>
    <style>
        /* KILL BLOGGER BAR */
        #navbar-iframe, .navbar, .navbar-themed { display: none !important; height: 0 !important; visibility: hidden !important; }
        body { top: 0 !important; margin: 0; padding: 15px; background: #e2e8f0; font-family: 'Segoe UI', sans-serif; }

        .popup-container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* HEADER */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid #0ea5e9; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        .header h1 { margin: 0; font-size: 28px; color: #0f172a; }

        /* ACTIONS */
        .action-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-input { 
            flex: 1; 
            padding: 15px; 
            font-size: 18px; 
            font-weight: 700; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            outline: none;
        }
        .search-input:focus { border-color: #0ea5e9; }

        .btn-new { 
            background: #0ea5e9; 
            color: white; 
            border: none; 
            padding: 0 25px; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 16px;
        }

        /* TABLE */
        .scroll-area { max-height: 500px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: white; padding: 12px; text-align: left; font-size: 13px; position: sticky; top: 0; }
        td { padding: 15px 12px; font-size: 17px; font-weight: 700; border-bottom: 1px solid #f1f5f9; }

        .price { color: #0ea5e9; font-weight: 900; }
        .stock { background: #f1f5f9; padding: 5px 10px; border-radius: 5px; }
        .low { color: #ef4444; border: 1px solid #ef4444; }

        /* MODAL (Add/Edit) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; }
        .modal-content { background: white; width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; font-weight: 700; box-sizing: border-box; }
        .modal-content label { font-size: 11px; font-weight: 900; color: #64748b; text-transform: uppercase; }
        
        .btn-save { width: 100%; padding: 15px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="popup-container">
    <div class="header">
        <h1>✦ Αποθήκη</h1>
        <div id="stat" style="font-weight:900; color:#0ea5e9;">0 ΕΙΔΗ</div>
    </div>

    <div class="action-bar">
        <input type="text" id="pSearch" class="search-input" placeholder="Αναζήτηση..." onkeyup="render()">
        <button class="btn-new" onclick="openModal()">+ ΝΕΟ</button>
    </div>

    <div class="scroll-area">
        <table>
            <thead>
                <tr>
                    <th>Περιγραφή</th>
                    <th>Τιμή</th>
                    <th>Stock</th>
                    <th style="width:30px;"></th>
                </tr>
            </thead>
            <tbody id="pBody"></tbody>
        </table>
    </div>
</div>

<div id="prodModal" class="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px 0;">Στοιχεία Είδους</h2>
        <label>Περιγραφή</label>
        <input type="text" id="pDesc">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>Τιμή Πώλησης</label><input type="number" id="pPrice" step="0.01"></div>
            <div style="flex:1;"><label>Έκπτωση %</label><input type="number" id="pDisc" value="0"></div>
        </div>

        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>Stock</label><input type="number" id="pStock" value="0"></div>
            <div style="flex:1;"><label>ΦΠΑ %</label>
                <select id="pVat" style="width:100%; padding:12px; margin:10px 0; border:2px solid #ddd; border-radius:8px; font-size:18px; font-weight:700;">
                    <option value="24">24%</option>
                    <option value="13">13%</option>
                </select>
            </div>
        </div>

        <button class="btn-save" onclick="save()">ΑΠΟΘΗΚΕΥΣΗ</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer; color:gray; font-weight:bold;">ΑΚΥΡΩΣΗ</button>
    </div>
</div>

<script>
    const DB = 'productsDB';

    function render() {
        const db = JSON.parse(localStorage.getItem(DB) || '{}');
        const search = document.getElementById('pSearch').value.toLowerCase();
        const tbody = document.getElementById('pBody');
        tbody.innerHTML = '';
        
        let count = 0;
        Object.keys(db).forEach(name => {
            if(name.toLowerCase().includes(search)) {
                count++;
                const p = db[name];
                tbody.innerHTML += `
                    <tr onclick="edit('${name}')" style="cursor:pointer">
                        <td>${name}</td>
                        <td class="price">${parseFloat(p.price).toFixed(2)}€</td>
                        <td><span class="stock ${p.stock <= 5 ? 'low' : ''}">${p.stock}</span></td>
                        <td><button onclick="event.stopPropagation(); del('${name}')" style="border:none; background:none; cursor:pointer;">🗑️</button></td>
                    </tr>`;
            }
        });
        document.getElementById('stat').innerText = count + " ΕΙΔΗ";
    }

    function save() {
        const desc = document.getElementById('pDesc').value.trim();
        if(!desc) return;
        const db = JSON.parse(localStorage.getItem(DB) || '{}');
        db[desc] = {
            price: document.getElementById('pPrice').value,
            discount: document.getElementById('pDisc').value,
            stock: document.getElementById('pStock').value,
            vat: document.getElementById('pVat').value
        };
        localStorage.setItem(DB, JSON.stringify(db));
        closeModal(); render();
    }

    function edit(name) {
        const p = JSON.parse(localStorage.getItem(DB))[name];
        document.getElementById('pDesc').value = name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pDisc').value = p.discount;
        document.getElementById('pStock').value = p.stock;
        document.getElementById('pVat').value = p.vat;
        openModal();
    }

    function del(name) { if(confirm("Διαγραφή;")) { const db = JSON.parse(localStorage.getItem(DB)); delete db[name]; localStorage.setItem(DB, JSON.stringify(db)); render(); } }
    function openModal() { document.getElementById('prodModal').style.display = 'block'; }
    function closeModal() { document.getElementById('prodModal').style.display = 'none'; }
    window.onload = render;
</script>
</body>
</html>
