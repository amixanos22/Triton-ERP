  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Dashboard Κερδοφορίας</title>
    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; 
            visibility: hidden !important; 
            height: 0 !important; 
        }
        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark: #0f172a;
            --triton-bg: #f8fafc; 
            --triton-border: #e2e8f0; 
        }
        
        body { 
            background: #e2e8f0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        .dashboard-container { 
            max-width: 1100px; 
            margin: 20px auto; /* Διορθωμένο margin για να μην πέφτει πολύ χαμηλά */
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }

        .dash-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--triton-blue); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            gap: 15px;
            flex-wrap: wrap;
        } 

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--triton-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--triton-border); border-bottom: 4px solid var(--triton-blue); }
        .stat-card label { display: block; font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 26px; font-weight: 900; color: #0f172a; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 12px; text-align: left; font-size: 12px; color: #475569; border-bottom: 2px solid #cbd5e1; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        .btn-group, .filter-group { display: flex; gap: 10px; align-items: center; }
        .btn-clear { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-clear:hover { background: #e2e8f0; }

        /* Hide elements when in iframe */
        .nav-header { display: none; }
    </style>
</head>
<body>

<style>
    :root {
        --triton-blue: #0ea5e9;
        --triton-dark: #0f172a;
        --triton-light: #f8fafc;
    }
    
    .dashboard-container { padding: 20px; font-family: 'Segoe UI', sans-serif; background: var(--triton-light); }
    
    .dash-header { 
        display: flex; justify-content: space-between; align-items: center; 
        background: white; padding: 20px; border-radius: 12px; 
        border-bottom: 4px solid var(--triton-blue); margin-bottom: 20px;
    }

    .stats-grid { 
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
        gap: 20px; margin-bottom: 30px; 
    }

    .stat-card { 
        background: white; padding: 20px; border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        border-left: 5px solid var(--triton-blue);
    }

    .stat-card label { display: block; color: #64748b; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: var(--triton-dark); }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    th { background: var(--triton-dark); color: white; padding: 15px; text-align: left; }
    td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: var(--triton-dark); }
    tr:hover { background: #f1f5f9; }
</style>

<div class="dashboard-container">
    <div class="dash-header">
        <h1 style="color: var(--triton-dark);"><span style="color: var(--triton-blue);">🔱</span> Οικονομική Εικόνα</h1>
        
        <div class="filter-group">
            <input type="date" id="dateFilter" style="padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1;" onchange="loadDashboard()">
            <button onclick="document.getElementById('dateFilter').value=''; loadDashboard();" style="cursor:pointer; padding: 8px 15px;">Όλα</button>
        </div>

        <div class="btn-group">
            <button onclick="clearHistory()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">🧹 Καθαρισμός</button>
            <button onclick="exportToExcel()" style="background: #059669; color: white; border: none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-left:10px;">📥 Excel</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <label>Τζίρος (Προ ΦΠΑ)</label>
            <div id="totalSales" class="value">0,00 €</div>
        </div>
        <div class="stat-card" style="border-left-color: #059669;">
            <label style="color: #059669;">Πραγματικό Κέρδος</label>
            <div id="totalProfit" class="value" style="color: #059669;">0,00 €</div>
        </div>
        <div class="stat-card" style="border-left-color: #6366f1;">
            <label>Margin (%)</label>
            <div id="avgMargin" class="value">0,0%</div>
        </div>
    </div>

    <h3 style="color: var(--triton-dark); margin-bottom: 15px;">📜 Ιστορικό Πωλήσεων</h3>
    <div style="overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 12px;">
        <table>
            <thead>
                <tr>
                    <th>Ημερομηνία</th>
                    <th>Πελάτης</th>
                    <th>Καθαρή Αξία</th>
                    <th>Κέρδος</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                </tbody>
        </table>
    </div>
</div>
<script>
    // ΕΝΤΟΠΙΣΜΟΣ IFRAME
    if (window.self !== window.top) {
        document.body.style.background = "white";
        document.querySelector('.dashboard-container').style.boxShadow = "none";
        document.querySelector('.dashboard-container').style.margin = "0";
    }

    function loadDashboard() {
        const history = JSON.parse(localStorage.getItem('triton_sales_history') || '[]');
        const tableBody = document.getElementById('historyTableBody');
        const selectedDate = document.getElementById('dateFilter').value;
        
        let sumSales = 0, sumProfit = 0;
        tableBody.innerHTML = '';

        // Φιλτράρισμα βάσει ημερομηνίας
        const filtered = history.filter(sale => {
            if (!selectedDate) return true;
            return new Date(sale.date).toISOString().split('T')[0] === selectedDate;
        });

        [...filtered].reverse().forEach(sale => {
            const net = sale.totalNet || 0;
            const profit = sale.profit || 0;
            sumSales += net;
            sumProfit += profit;
            const margin = net > 0 ? (profit / net * 100).toFixed(1) : 0;
            
            tableBody.innerHTML += `<tr>
                <td>${new Date(sale.date).toLocaleDateString('el-GR')}</td>
                <td>${sale.customer || 'Λιανική'}</td>
                <td>${net.toLocaleString('el-GR', {minimumFractionDigits: 2})} €</td>
                <td style="color: #059669; font-weight:bold;">${profit.toLocaleString('el-GR', {minimumFractionDigits: 2})} €</td>
                <td>${margin}%</td>
            </tr>`;
        });

        document.getElementById('totalSales').innerText = sumSales.toLocaleString('el-GR', {minimumFractionDigits: 2}) + " €";
        document.getElementById('totalProfit').innerText = sumProfit.toLocaleString('el-GR', {minimumFractionDigits: 2}) + " €";
        document.getElementById('avgMargin').innerText = (sumSales > 0 ? (sumProfit / sumSales * 100).toFixed(1) : 0).replace('.', ',') + "%";
        
        if(filtered.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:gray;">Δεν βρέθηκαν δεδομένα.</td></tr>';
        }
    }

    function clearHistory() {
        if (confirm("Προσοχή! Θέλετε να διαγράψετε οριστικά το ιστορικό πωλήσεων;")) {
            localStorage.setItem('triton_sales_history', '[]');
            loadDashboard();
        }
    }

    function exportToExcel() {
        const history = JSON.parse(localStorage.getItem('triton_sales_history') || '[]');
        if(history.length === 0) { alert("Δεν υπάρχουν δεδομένα."); return; }
        
        let csvContent = "\uFEFFΗμερομηνία;Πελάτης;Καθαρή Αξία;Κέρδος;Margin%\n";
        history.forEach(sale => {
            const margin = sale.totalNet > 0 ? (sale.profit / sale.totalNet * 100).toFixed(1) : 0;
            csvContent += `${new Date(sale.date).toLocaleDateString('el-GR')};${(sale.customer || "Λιανική")};${sale.totalNet.toFixed(2)};${sale.profit.toFixed(2)};${margin}%\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Triton_Profit_${new Date().toISOString().slice(0,10)}.csv`);
        link.click();
    }

    window.onload = loadDashboard;
</script>
</body>
</html>
