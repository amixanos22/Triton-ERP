  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Έκδοση Τιμολογίου</title>
    <style>
        /* ΚΡΥΒΕΙ ΤΗΝ ΜΠΑΡΑ ΤΟΥ BLOGGER */
        #navbar-iframe, .navbar, .navbar-spaced { display: none !important; }
        body { top: 0 !important; }

        :root { --triton-blue: #0ea5e9; --triton-dark: #1e293b; }
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        #invoice-container { 
            width: 1000px; margin: auto; background: white; padding: 40px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1); min-height: 1100px;
        }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 20px; }
        .logo img { max-height: 100px; max-width: 250px; object-fit: contain; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #f8fafc; padding: 15px; border-left: 5px solid var(--triton-blue); border-radius: 4px; }
        input, select { width: 100%; border: none; border-bottom: 1px solid #cbd5e1; background: transparent; padding: 5px; margin-bottom: 8px; outline: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; padding: 10px; text-align: left; border-bottom: 2px solid #000; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .total-section { margin-top: 30px; text-align: right; }
        .grand-total { font-size: 24px; font-weight: bold; color: var(--triton-blue); }
        
        @media print { .no-print { display: none !important; } #invoice-container { box-shadow: none; width: 100%; padding: 0; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="invoice-container">
    <div class="header">
        <div id="logoArea" class="logo"></div>
        <div id="compInfo">
            <h2 id="dispCompName" style="margin:0;">ΦΟΡΤΩΣΗ...</h2>
            <p id="dispAddress" style="margin:0; font-size:13px;"></p>
        </div>
        <div style="text-align:right;">
            <h3 style="color:var(--triton-blue); margin:0;">ΤΙΜΟΛΟΓΙΟ</h3>
            <p id="currentDate">--/--/----</p>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <label style="font-size:10px; font-weight:bold;">ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ</label>
                <button onclick="lookupMyData()" class="no-print" style="cursor:pointer; background:var(--triton-blue); color:white; border:none; border-radius:3px; padding:2px 5px; font-size:10px;">🔍 myDATA</button>
              
       </div> 
        <input id="cName" list="custList" placeholder="Επωνυμία" onchange="autoFillCust()"> 
        <input id="cAfm" placeholder="ΑΦΜ"> 
        <input id="cAddr" placeholder="Διεύθυνση"> 
        <input id="cCity" placeholder="Πόλη"> 
    </div> 
    
    <div class="card" style="border-left-color: #64748b;"> 
        <label style="font-size:10px; font-weight:bold;">ΔΙΑΚΙΝΗΣΗ / ΠΑΡΑΔΟΣΗ</label> 
        <input id="purpose" value="ΠΩΛΗΣΗ"> 
        <input id="car" placeholder="Αρ. Αυτοκινήτου"> 
        <input id="delivery" list="branchList" placeholder="Τόπος Παράδοσης"> 
        <datalist id="branchList"></datalist> 
    </div> 
</div>
    <table id="itemsTable">
        <thead>
            <tr>
                <th style="width:50%">ΠΕΡΙΓΡΑΦΗ</th>
                <th style="width:10%">ΠΟΣ.</th>
                <th style="width:15%">ΤΙΜΗ</th>
                <th style="width:10%">ΦΠΑ %</th>
                <th style="width:15%; text-align:right;">ΣΥΝΟΛΟ</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

  <div class="total-section">
    <div class="no-print" style="background: #f0fdf4; border: 1px solid #22c55e; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        <div style="color: #166534; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Εκτιμώμενο Κέρδος</div>
        <div id="profitVal" style="font-size: 24px; font-weight: bold; color: #15803d;">0.00 €</div>
    </div>

    <p style="margin: 5px 0;">ΚΑΘΑΡΗ ΑΞΙΑ: <span id="netVal" style="font-weight: bold;">0.00 €</span></p>
    <p style="margin: 5px 0;">ΦΠΑ: <span id="taxVal" style="font-weight: bold;">0.00 €</span></p>
    <p class="grand-total" style="margin-top: 10px; border-top: 2px solid #000; padding-top: 10px;">ΣΥΝΟΛΟ: <span id="grandVal">0.00 €</span></p>
    
    <div class="no-print" style="margin-top: 25px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; text-align: left;">
        <label style="font-size: 11px; font-weight: bold; color: var(--triton-dark); display: block; margin-bottom: 5px;">ΑΠΟΣΤΟΛΗ ΣΕ EMAIL:</label>
        <select id="emailSelect" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 4px; background: white;">
            <option value="">Επιλέξτε email πελάτη...</option>
        </select>
        <div style="display: flex; gap: 10px;">
            <button onclick="window.print()" style="flex: 1; padding: 12px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">ΕΚΤΥΠΩΣΗ</button>
            <button onclick="handleExport('email')" id="sendEmailBtn" style="flex: 2; padding: 12px; background: var(--triton-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">PDF & ΑΠΟΣΤΟΛΗ</button>
        </div>
    </div>
</div>

<datalist id="custList"></datalist>
<datalist id="prodList"></datalist>

<script>
const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_8lbtn4itPf_AD8UYz_rPMg_VvBBqY4G';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

 
let currentUser = null;

// 1. ΕΚΚΙΝΗΣΗ ΣΕΛΙΔΑΣ
window.onload = async () => {
    const { data: { user }, error } = await _supabase.auth.getUser();

    if (!user || error) {
        window.location.href = "index.html"; 
        return;
    }

    currentUser = user; 
    await loadProfile(user.id);
    await updateLists(user.id); 
    
    addRow(); 
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('el-GR');
};

// 2. ΠΡΟΣΘΗΚΗ ΓΡΑΜΜΗΣ
function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" list="prodList" class="desc" placeholder="Προϊόν..." onchange="autoFillProductPrice(this)"></td>
        <td><input type="number" class="qty" value="1" oninput="recalc()"></td>
        <td><input type="number" class="price" value="0" oninput="recalc()"></td>
        <td><input type="number" class="tax" value="24" oninput="recalc()"></td>
        <td class="row-total" style="text-align:right; font-weight:bold;">0.00 €</td>
    `;
    document.getElementById('rows').appendChild(tr);
}

// 3. ΦΟΡΤΩΣΗ ΠΡΟΦΙΛ
async function loadProfile(userId) {
    const { data: profile } = await _supabase.from('profiles').select('*').eq('id', userId).single();
    if (profile) {
        document.getElementById('dispCompName').innerText = profile.company_name || "TRITON ERP";
        document.getElementById('dispAddress').innerText = `${profile.address || ''}, ${profile.city || ''} | ΑΦΜ: ${profile.tax_id || ''}`;
        if (profile.logo_url) {
            document.getElementById('logoArea').innerHTML = `<img src="${profile.logo_url}" style="max-height:100px;">`;
        }
    }
}

// 4. ΕΝΗΜΕΡΩΣΗ ΛΙΣΤΩΝ
async function updateLists(userId) {
    const { data: custs } = await _supabase.from('customers').select('name').eq('user_id', userId);
    const { data: prods } = await _supabase.from('products').select('name').eq('user_id', userId);
    
    const cL = document.getElementById('custList');
    const pL = document.getElementById('prodList');
    if(cL) cL.innerHTML = ''; 
    if(pL) pL.innerHTML = '';
    
    if (custs) custs.forEach(c => { let o = document.createElement('option'); o.value = c.name; cL.appendChild(o); });
    if (prods) prods.forEach(p => { let o = document.createElement('option'); o.value = p.name; pL.appendChild(o); });
}

// 5. ΥΠΟΛΟΓΙΣΜΟΣ ΣΥΝΟΛΩΝ (Recalc)
function recalc() {
    let grandTotal = 0;
    document.querySelectorAll('#rows tr').forEach(row => {
        const q = parseFloat(row.querySelector('.qty').value) || 0;
        const p = parseFloat(row.querySelector('.price').value) || 0;
        const t = parseFloat(row.querySelector('.tax').value) || 0;
        
        const lineTotal = (q * p) * (1 + t/100);
        row.querySelector('.row-total').innerText = lineTotal.toFixed(2) + " €";
        grandTotal += lineTotal;
    });
    if(document.getElementById('grandTotal')) {
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2) + " €";
    }
}

// 6. ΣΥΓΧΡΟΝΙΣΜΟΣ ΠΕΛΑΤΗ
async function syncWithSupabase() {
    if (!currentUser) return alert("🔱 Triton: Παρακαλώ συνδεθείτε.");
    
    const customerName = document.getElementById('cName').value.trim();
    const customerAfm = document.getElementById('cAfm').value.trim();

    if (customerName && customerAfm) {
        const { error } = await _supabase.from('customers').upsert({ 
            name: customerName.toUpperCase(),
            afm: customerAfm,
            address: document.getElementById('cAddr').value,
            city: document.getElementById('cCity').value,
            user_id: currentUser.id 
        }, { onConflict: 'afm' });

        if (error) alert("❌ Σφάλμα συγχρονισμού!");
        else {
            updateLists(currentUser.id);
            alert("✅ Η βάση δεδομένων Triton ενημερώθηκε!");
        }
    } else {
        alert("⚠️ Συμπληρώστε Επωνυμία και ΑΦΜ.");
    }
}

// 7. ΑΥΤΟΜΑΤΗ ΣΥΜΠΛΗΡΩΣΗ ΤΙΜΗΣ ΑΠΟ ΑΠΟΘΗΚΗ
async function autoFillProductPrice(inputElement) {
    const productName = inputElement.value.trim().toUpperCase();
    if (!productName || !currentUser) return;

    const { data: product } = await _supabase
        .from('products')
        .select('unit_price')
        .eq('user_id', currentUser.id)
        .eq('name', productName)
        .single();

    if (product) {
        const row = inputElement.closest('tr');
        const priceField = row.querySelector('.price');
        if (priceField) {
            priceField.value = product.unit_price;
            recalc();
        }
    }
}

// 8. ΜΕΙΩΣΗ ΑΠΟΘΕΜΑΤΟΣ ΜΕΤΑ ΤΗΝ ΠΩΛΗΣΗ
async function updateStockAfterSale() {
    if (!currentUser) return;
    const rows = document.querySelectorAll('#rows tr');
    
    for (let row of rows) {
        const nameInput = row.querySelector('.desc');
        const qtyInput = row.querySelector('.qty');
        
        if (!nameInput || !qtyInput) continue;
        const name = nameInput.value.trim().toUpperCase();
        const qty = parseFloat(qtyInput.value) || 0;

        if (name && qty > 0) {
            const { data: product } = await _supabase
                .from('products')
                .select('id, stock')
                .eq('user_id', currentUser.id)
                .eq('name', name)
                .single();

            if (product) {
                const newStock = (parseFloat(product.stock) || 0) - qty;
                await _supabase.from('products').update({ stock: newStock }).eq('id', product.id);
                console.log(`🔱 Stock Update: ${name} -> ${newStock}`);
            }
        }
    }
}

// Λοιπές συναρτήσεις
function sendEmailWithPDF() {
    const email = document.getElementById('emailSelect')?.value;
    if(!email) return alert("Επιλέξτε Email!");
    alert("📧 Αποστολή PDF στο: " + email);
}
</script>
 
</body>
</html>
