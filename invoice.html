// 3. LOAD PRODUCTS (With Auto-Retry)
async function loadProductsFromSupabase() {
    if (!_supabase) {
        setTimeout(loadProductsFromSupabase, 200);
        return; 
    }
    try {
        const { data, error } = await _supabase.from('products').select('*');
        if (error) throw error;
        window.allProducts = data || [];
        console.log("📦 Triton: " + window.allProducts.length + " προϊόντα φορτώθηκαν.");
    } catch (e) {
        console.error("❌ Load Error:", e.message);
    }
}

// 4. SMART CALCULATE ENGINE (No Hydration Errors)
window.calculateTotal = function() {
    let subtotal = 0; 
    let totalVat = 0; 

    const rows = document.querySelectorAll('.item-row');
    rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.row-qty')?.value) || 0;
        const price = parseFloat(row.querySelector('.row-price')?.value) || 0;
        const disc = parseFloat(row.querySelector('.row-disc')?.value) || 0;
        const vatRate = parseFloat(row.getAttribute('data-vat')) || 24;

        // Υπολογισμός με ακρίβεια cents
        const lineNet = Math.round(((qty * price) * (1 - disc / 100)) * 100) / 100;
        const lineVat = Math.round((lineNet * (vatRate / 100)) * 100) / 100;
        
        const lineTotalField = row.querySelector('.row-total');
        if (lineTotalField) {
            const displayTotal = (lineNet + lineVat).toFixed(2);
            if (lineTotalField.tagName === 'INPUT') lineTotalField.value = displayTotal;
            else lineTotalField.innerText = displayTotal + " €";
        }

        subtotal += lineNet;
        totalVat += lineVat;
    });

    // Ενημέρωση Footer με Formatting
    const format = (val) => val.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + " €";
    
    const update = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.innerText = format(val);
    };

    update('footerSubtotal', subtotal);
    update('netAmount', subtotal);
    update('footerVat', totalVat);
    update('vatAmount', totalVat);
    update('footerGrandTotal', subtotal + totalVat);
    update('totalAmount', subtotal + totalVat);
};

// 5. FETCH PRODUCT BY CODE
async function fetchProductData(inputElement) {
    const code = inputElement.value.trim();
    if (!code || !_supabase) return;
    const row = inputElement.closest('.item-row');
    
    try {
        const { data, error } = await _supabase.from('products').select('*').eq('code', code).maybeSingle();
        if (data) {
            row.querySelector('.row-desc').value = data.name;
            row.querySelector('.row-price').value = data.price;
            row.setAttribute('data-vat', data.vat_rate || 24); 
            window.calculateTotal();
            row.querySelector('.row-qty').focus();
        } else {
            if (confirm(`📦 Ο κωδικός "${code}" δεν υπάρχει. Δημιουργία νέου;`)) {
                if (typeof openProductModal === 'function') openProductModal(code);
            }
        }
    } catch (err) {
        console.error("🔱 Fetch Error:", err.message);
    }
}

// 6. STARTUP LOGIC
if (document.readyState === 'complete') {
    initTritonSupabase();
} else {
    window.addEventListener('load', initTritonSupabase);
}

  /* ΑΝΑΖΗΤΗΣΗ ΠΕΛΑΤΗ ΜΕ ΕΞΥΠΝΗ ΤΟΠΟΘΕΤΗΣΗ ΛΙΣΤΑΣ */
async function searchCustomer(input) {
    const term = input.value.trim();
    
    let existingList = document.getElementById('customer-dropdown');
    if (existingList) existingList.remove();

    if (term.length < 2) return;

    try {
        const { data, error } = await supabase
            .from('customers')
            .select('*')
            .ilike('name', `%${term}%`)
            .limit(10);

        if (error || !data || data.length === 0) return;

        const list = document.createElement('div');
        list.id = 'customer-dropdown';
        const rect = input.getBoundingClientRect();
        
        // Triton UI Styling
        list.style = `position: absolute; top: ${rect.bottom + window.scrollY}px; left: ${rect.left + window.scrollX}px; width: ${rect.width}px; background: white; border: 1px solid #0ea5e9; border-radius: 8px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); z-index: 20001; max-height: 200px; overflow-y: auto;`;

        data.forEach(cust => {
            const item = document.createElement('div');
            item.style = "padding: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #1e293b;";
            item.innerHTML = `<b>${cust.name}</b> <br> <span style="color:#64748b; font-size:12px;">ΑΦΜ: ${cust.afm || '---'} | ${cust.city || ''}</span>`;
            
            // Hover effect
            item.onmouseover = () => item.style.background = '#e0f2fe';
            item.onmouseout = () => item.style.background = 'white';

            item.onclick = () => {
                // 1. Ενημέρωση των labels
                const updateLabel = (id, text) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = text || "-";
                };
                updateLabel('customerName', cust.name);
                updateLabel('customerEmail', cust.email);
                updateLabel('customerAFM', cust.afm);

                // 2. Συμπλήρωση Input Πεδίων
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.value = val || '';
                        el.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                };

                setVal('newCustName', cust.name);
                setVal('newCustJob', cust.job || cust.occupation || '');
                setVal('newCustDoy', cust.doy);
                setVal('newCustAddress', cust.address);
                setVal('newCustCity', cust.city);
                setVal('newCustZip', cust.zip);
                setVal('newCustEmail', cust.email);
                setVal('newCustPhone', cust.phone);

                // 3. ΑΦΜ (Έξυπνη αναζήτηση σε όλα τα πεδία ΑΦΜ)
                document.querySelectorAll('input').forEach(inp => {
                    if (inp.id.toLowerCase().includes('afm') || inp.name.toLowerCase().includes('afm')) {
                        inp.value = cust.afm || '';
                        inp.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                });

                // 4. ΗΜΕΡΟΜΗΝΙΑ & ΩΡΑ (Smart-Scan)
                const τώρα = new Date();
                const dateString = τώρα.toISOString().split('T')[0];
                const timeString = τώρα.getHours().toString().padStart(2, '0') + ":" + 
                                   τώρα.getMinutes().toString().padStart(2, '0');

                const dateInput = document.querySelector('input[type="date"]');
                if (dateInput) {
                    dateInput.value = dateString;
                    dateInput.dispatchEvent(new Event('input', { bubbles: true }));
                }

                const timeInput = document.querySelector('input[type="time"]');
                if (timeInput) {
                    timeInput.value = timeString;
                    timeInput.dispatchEvent(new Event('input', { bubbles: true }));
                }

                // 5. Καθαρισμός και Focus
                input.value = cust.name;
                list.remove();

                setTimeout(() => {
                    const nextStep = document.querySelector('input[oninput*="searchProductByDesc"]');
                    if (nextStep) nextStep.focus();
                }, 200);

                console.log("%c 🔱 Triton: Auto-Fill Completed ", "color: #0077be; font-weight: bold;");
            };
            list.appendChild(item);
        });

        document.body.appendChild(list);

    } catch (err) { 
        console.error("❌ Search error:", err); 
    }
}

// 1. ΕΝΙΑΙΑ ΔΙΑΧΕΙΡΙΣΗ ΗΜΕΡΟΜΗΝΙΑΣ & UI
function updateDateTime() {
    const now = new Date();
    const formattedDate = now.toLocaleDateString('en-CA'); 
    const formattedTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    
    // Ενημερώνει ΟΛΑ τα πιθανά IDs ημερομηνίας/ώρας που μπορεί να υπάρχουν στη σελίδα
    const targets = ['docDate', 'invoiceDate', 'newCustDate', 'docTime', 'invoiceTime', 'newCustTime'];
    targets.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.value = id.toLowerCase().includes('time') ? formattedTime : formattedDate;
            el.dispatchEvent(new Event('input', { bubbles: true }));
        }
    });

    // Ενημέρωση UI
    window.updateUI('transDate', "📅 " + now.toLocaleDateString('el-GR'));
    window.updateUI('transTime', "🕒 " + formattedTime);
}

// 2. Η ΕΞΥΠΝΗ ΔΙΑΧΕΙΡΙΣΗ ENTER (Πλοήγηση χωρίς ποντίκι)
function manageEnter(event, element) {
    if (event.key === 'Enter') {
        event.preventDefault();
        const row = element.closest('.item-row') || element.closest('tr');
        if (!row) return;

        // Σειρά: Κωδικός -> Περιγραφή -> Ποσότητα -> Τιμή -> Έκπτωση -> Νέα Γραμμή
        const focusOrder = ['.row-code', '.row-desc', '.row-qty', '.row-price', '.row-disc'];
        let currentClass = "";
        focusOrder.forEach(cls => {
            if (element.classList.contains(cls.replace('.', ''))) currentClass = cls;
        });

        const currentIndex = focusOrder.indexOf(currentClass);
        const nextInput = row.querySelector(focusOrder[currentIndex + 1]);

        if (nextInput) {
            nextInput.focus();
        } else {
            // Αν είμαστε στο τελευταίο πεδίο, προσθήκη νέας γραμμής
            if (typeof addNewLine === 'function') addNewLine();
            else if (typeof addNewInvoiceRow === 'function') addNewInvoiceRow();
        }
    }
}

                    };
                    setVal('newCustName', cust.name);
                    setVal('newCustPhone', cust.phone);
                    setVal('newCustEmail', cust.email);
                    setVal('newCustAddress', cust.address);

                    // Γ: ΗΜΕΡΟΜΗΝΙΑ & ΩΡΑ (Smart Fill)
                    const τώρα = new Date();
                    const dInput = document.querySelector('input[type="date"]');
                    const tInput = document.querySelector('input[type="time"]');
                    if (dInput) dInput.value = τώρα.toLocaleDateString('en-CA');
                    if (tInput) tInput.value = τώρα.getHours().toString().padStart(2, '0') + ":" + τώρα.getMinutes().toString().padStart(2, '0');

                    // Δ: Καθαρισμός & Focus στο πρώτο προϊόν

                        const firstProd = document.querySelector('.row-desc');
                        if (firstProd) firstProd.focus();
                    }, 200);
                };
                list.appendChild(item);
            });
        } 

        // 5. ΕΞΥΠΝΗ ΠΡΟΤΑΣΗ ΑΑΔΕ (Κράτησες αυτή τη λειτουργία)
        if (term.length === 9 && !isNaN(term)) {
            const myDataItem = document.createElement('div');
            myDataItem.style = "padding: 12px; cursor: pointer; background: #f0f9ff; color: #0369a1; font-weight: bold; border-top: 2px solid #0ea5e9; font-size: 13px; text-align: center;";
            myDataItem.innerHTML = `🔍 Νέο ΑΦΜ; Αναζήτηση "${term}" στην ΑΑΔΕ;`;

                setTimeout(() => { if (typeof searchMyData === 'function') searchMyData(term); }, 300);
            };
            list.appendChild(myDataItem);
        }

        if (list.children.length > 0) document.body.appendChild(list);

    } catch (err) {
        console.error("🔱 Search Error:", err.message);
    }
}

window.fillCustomerUI = function(cust) {
    console.log("🔱 Triton: Συμπλήρωση στοιχείων για:", cust);

    // Λίστα με όλα τα πιθανά IDs που μπορεί να έχεις στην HTML σου
    const fieldMapping = {
        'name': cust.name || cust.onomasia,
        'afm': cust.afm || cust.vat_number,
        'doy': cust.doy || cust.doy_descr,
        'address': cust.address || cust.dieythinsi,
        'city': cust.city || cust.poli,
        'zip': cust.zip || cust.tk,
        'email': cust.email,
        'phone': cust.phone,
        'job': cust.job || cust.drastiriotita_descr || cust.occupation
    };

    // Ενημέρωση INPUT fields (Κουτάκια)
    for (let key in fieldMapping) {
        // Δοκιμάζουμε όλους τους συνδυασμούς ID που είδαμε στον κώδικά σου
        const possibleIds = [
            'newCust' + key.charAt(0).toUpperCase() + key.slice(1), // π.χ. newCustAfm
            'cust' + key.charAt(0).toUpperCase() + key.slice(1),    // π.χ. custAfm
            key                                                     // π.χ. afm
        ];

        possibleIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.value = fieldMapping[key] || '';
                // Πυροδότηση event για να σταματήσει το σφάλμα "Βρέθηκαν: 0"
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
                
                // Triton Feedback Highlight
                el.style.backgroundColor = "#f0f9ff";
                setTimeout(() => el.style.backgroundColor = "", 1500);
            }
        });
    }

    // Ενημέρωση LABELS/TEXT (Επικεφαλίδα Invoice)
    const labels = {
        'customerName': cust.name,
        'customerAFM': cust.afm,
        'customerEmail': cust.email
    };
    for (let id in labels) {
        const el = document.getElementById(id);
        if (el) el.innerText = labels[id] || "-";
    }

    // Μετάβαση στο πρώτο προϊόν
    setTimeout(() => {
        const firstRow = document.querySelector('.row-code, .row-desc, input[oninput*="searchProduct"]');
        if (firstRow) firstRow.focus();
    }, 200);
};

var searchMyData = async function(manualAfm = null) {
    // Ψάχνουμε το input του ΑΦΜ σε οποιοδήποτε από τα IDs σου
    const afmInput = document.getElementById('newCustAfm') || document.getElementById('custAfm') || document.getElementById('newCustAfmSearch');
    let afm = (manualAfm && typeof manualAfm === 'string') ? manualAfm : (afmInput ? afmInput.value.trim() : "");

 window.calculateTotal = function() {
    let subtotal = 0; 
    let totalVat = 0; 

    // 1. Επιλογή όλων των γραμμών με ασφάλεια
    const rows = document.querySelectorAll('.item-row');

    rows.forEach(row => {
        // Χρήση ?. για να μην "σκάσει" αν λείπει κάποιο input
        const qty = parseFloat(row.querySelector('.row-qty')?.value) || 0;
        const price = parseFloat(row.querySelector('.row-price')?.value) || 0;
        const disc = parseFloat(row.querySelector('.row-disc')?.value) || 0;
        
        // Λήψη ΦΠΑ από το attribute (default 24)
        const vatRate = parseFloat(row.getAttribute('data-vat')) || 24;

        // 2. Υπολογισμός Καθαρής Αξίας με στρογγυλοποίηση 2 δεκαδικών
        const lineNet = Math.round(((qty * price) * (1 - disc / 100)) * 100) / 100;
        
        // Υπολογισμός ΦΠΑ γραμμής
        const lineVat = Math.round((lineNet * (vatRate / 100)) * 100) / 100;
        
        // 3. Ενημέρωση του "Σύνολο Γραμμής" (Value αν είναι input, InnerText αν είναι span/div)
        const lineTotalField = row.querySelector('.row-total');
        if (lineTotalField) {
            const displayTotal = (lineNet + lineVat).toFixed(2);
            if (lineTotalField.tagName === 'INPUT') {
                lineTotalField.value = displayTotal;
            } else {
                lineTotalField.innerText = displayTotal + " €";
            }
        }

        subtotal += lineNet;
        totalVat += lineVat;
    });

    // 4. Ενημέρωση Footer με formatting για Ελλάδα (κόμμα αντί για τελεία)
    const formatCurrency = (val) => val.toLocaleString('el-GR', { 
        minimumFractionDigits: 2, 
        maximumFractionDigits: 2 
    }) + " €";

    const fields = {
        'footerSubtotal': subtotal,
        'footerVat': totalVat,
        'footerGrandTotal': subtotal + totalVat,
        'netAmount': subtotal,    // εναλλακτικό ID
        'vatAmount': totalVat,    // εναλλακτικό ID
        'totalAmount': subtotal + totalVat // εναλλακτικό ID
    };

    // Ενημερώνει όποιο ID βρει από τα παραπάνω στο DOM
    Object.entries(fields).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) {
            el.innerText = formatCurrency(value);
        }
    });
};

     function generateMyDataXML(invoiceData, items) {
    let xml = `<?xml version="1.0" encoding="UTF-8"?>
    <InvoicesDoc xmlns="http://www.aade.gr/myDATA/invoice/v1.0">
        <invoice>
            <issuer>
                <vatNumber>012345678</vatNumber> <country>GR</country>
                <branch>0</branch>
            </issuer>
            <counterpart>
                <vatNumber>${invoiceData.customer_afm}</vatNumber>
                <country>GR</country>
                <branch>0</branch>
            </counterpart>
            <invoiceHeader>
                <invoiceType>1.1</invoiceType> <invoiceSeries>Α</invoiceSeries>
                <invoiceNumber>${invoiceData.id}</invoiceNumber>
                <issueDate>${new Date().toISOString().split('T')[0]}</issueDate>
                <currency>EUR</currency>
            </invoiceHeader>
            <invoiceDetails>`;

    // Προσθήκη γραμμών προϊόντων
    items.forEach((item, index) => {
        xml += `
                <lineItem>
                    <lineNumber>${index + 1}</lineNumber>
                    <netValue>${item.price * item.quantity}</netValue>
                    <vatCategory>${getVatCategory(item.vat_rate)}</vatCategory>
                    <vatAmount>${(item.price * item.quantity) * (item.vat_rate / 100)}</vatAmount>
                </lineItem>`;
    });

    xml += `
            </invoiceDetails>
            <invoiceSummary>
                <totalNetValue>${invoiceData.subtotal}</totalNetValue>
                <totalVatAmount>${invoiceData.vat_amount}</totalVatAmount>
                <totalWithheldAmount>0.00</totalWithheldAmount>
                <totalFeesAmount>0.00</totalFeesAmount>
                <totalStampDutyAmount>0.00</totalStampDutyAmount>
                <totalOtherTaxesAmount>0.00</totalOtherTaxesAmount>
                <totalDeductionsAmount>0.00</totalDeductionsAmount>
                <totalGrossValue>${invoiceData.grand_total}</totalGrossValue>
            </invoiceSummary>
        </invoice>
    </InvoicesDoc>`;
    
    return xml;
}

// Βοηθητική συνάρτηση για κατηγορίες ΦΠΑ ΑΑΔΕ
function getVatCategory(rate) {
    if (rate === 24) return 1;
    if (rate === 13) return 2;
    if (rate === 6) return 3;
    return 7; // 0% ή άνευ
}
     async function sendToMyData(invoiceId) {
    const btn = document.getElementById('myDataBtn');

                'ocp-apim-subscription-key': localStorage.getItem('myDataKey'),
                'Content-Type': 'application/xml'

 // Άνοιγμα/Κλείσιμο του Modal και φόρτωση δεδομένων
window.toggleTritonSettings = async function() {
    const modal = document.getElementById('tritonSettingsModal');
    
    if (modal.style.display === 'none' || modal.style.display === '') {
        modal.style.display = 'flex';
        
        // Φόρτωση των ρυθμίσεων από το Supabase για να δούμε τι έχουμε ήδη
        const { data, error } = await _supabase.from('settings').select('*');
        if (data) {
            data.forEach(item => {
                if (item.key_name === 'mydata_user_id') document.getElementById('setting_user').value = item.key_value;
                if (item.key_name === 'mydata_app_key') document.getElementById('setting_key').value = item.key_value;
                if (item.key_name === 'mydata_mode') document.getElementById('setting_mode').value = item.key_value;
            });
        }
    } else {
        modal.style.display = 'none';
    }
};

// Αποθήκευση στο Supabase
window.saveMyDataSettings = async function() {
    const btn = document.getElementById('saveSettingsBtn');
    btn.innerText = "⏳..."; btn.disabled = true;

    const user = document.getElementById('setting_user').value;
    const key = document.getElementById('setting_key').value;
    const mode = document.getElementById('setting_mode').value;

    try {
        // Ενημερώνουμε και τα 3 πεδία στον πίνακα settings
        await _supabase.from('settings').update({ key_value: user }).eq('key_name', 'mydata_user_id');
        await _supabase.from('settings').update({ key_value: key }).eq('key_name', 'mydata_app_key');
        await _supabase.from('settings').update({ key_value: mode }).eq('key_name', 'mydata_mode');

        alert("✅ Οι ρυθμίσεις ενημερώθηκαν επιτυχώς!");
        toggleTritonSettings(); // Κλείσιμο modal
    } catch (err) {
        alert("❌ Σφάλμα: " + err.message);
    } finally {
        btn.innerText = "Αποθήκευση"; btn.disabled = false;
    }
};

    window.fillCustomerUI = function(cust) {
    console.log("🔱 Triton: Έναρξη συμπλήρωσης στοιχείων...", cust);

    // 1. Ενημέρωση Labels (Κείμενο στην κεφαλίδα)
    const labels = {
        'customerName': cust.name || cust.onomasia,
        'customerAFM': cust.afm || cust.vat_number,
        'customerEmail': cust.email
    };

    for (let id in labels) {
        const el = document.getElementById(id);
        if (el) el.innerText = labels[id] || "-";
    }

    // 2. Ενημέρωση Inputs (Κουτάκια φόρμας)
    const mapping = {
        'newCustName': cust.name || cust.onomasia,
        'newCustAfm': cust.afm || cust.vat_number,
        'newCustDoy': cust.doy || cust.doy_descr,
        'newCustAddress': cust.address || cust.dieythinsi,
        'newCustCity': cust.city || cust.poli,
        'newCustZip': cust.zip || cust.tk,
        'newCustEmail': cust.email,
        'newCustPhone': cust.phone,
        'newCustJob': cust.job || cust.drastiriotita_descr || cust.occupation
    };

    for (let id in mapping) {
        const el = document.getElementById(id);
        if (el) {
            el.value = mapping[id] || '';
            
            // Πυροδότηση events για να καταλάβει το σύστημα την αλλαγή
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));

            // Triton Visual Feedback: Γαλάζιο highlight που σβήνει
            el.style.backgroundColor = "#e0f2fe";
            el.style.transition = "background-color 1s";
            setTimeout(() => el.style.backgroundColor = "", 1000);
        }
    }

    // 3. ΑΥΤΟΜΑΤΟΣ ΚΑΘΑΡΙΣΜΟΣ DROPDOWN
    const dropdown = document.getElementById('customer-dropdown');
    if (dropdown) {
        dropdown.remove();
        console.log("🗑️ Triton: Το dropdown πελατών αφαιρέθηκε.");
    }

    // 4. SMART FOCUS: Πήγαινε αυτόματα στην περιγραφή του πρώτου προϊόντος
    setTimeout(() => {
        const firstProd = document.querySelector('.row-desc') || document.querySelector('input[oninput*="searchProduct"]');
        if (firstProd) {
            firstProd.focus();
            console.log("🎯 Triton: Focus στο πρώτο προϊόν.");
        }
    }, 300);

    console.log("✅ Triton: Τα στοιχεία του πελάτη φορτώθηκαν επιτυχώς.");
};
