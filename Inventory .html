 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Inventory Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* KILL BLOGGER BAR */
        #navbar-iframe, .navbar, .navbar-themed { display: none !important; height: 0 !important; visibility: hidden !important; }
        body { top: 0 !important; margin: 0; padding: 15px; background: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        :root {
            --triton-blue: #0284c7;
            --triton-dark: #0f172a;
            --triton-light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        /* RESET & BASE */
        body { 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--triton-dark);
            min-height: 100vh;
        }

        /* CONTAINER */
        .app-card {
    max-width: 1100px;
    margin: 50px auto; /* Το 50px δίνει απόσταση από πάνω και κάτω, το auto την κεντράρει δεξιά-αριστερά */
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); /* Έκανα τη σκιά λίγο πιο έντονη για να "αιωρείται" */
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

        /* HEADER SECTION */
        .glass-header {
            background: var(--triton-dark);
            padding: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .stats-row { display: flex; gap: 20px; margin-top: 10px; }
        .stat-badge { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1); }

        /* SEARCH & ACTION BAR */
        .toolbar {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .search-wrapper { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .search-input:focus { border-color: var(--triton-blue); outline: none; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

        /* MODERN BUTTONS */
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--triton-blue); color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .btn-primary:hover { background: #0369a1; }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--triton-dark); }
        .btn-outline:hover { border-color: var(--triton-blue); color: var(--triton-blue); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* TABLE STYLING */
        .table-container { max-height: 550px; overflow-y: auto; padding: 0 10px 10px 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { padding: 15px; text-align: left; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 16px; background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
        
        tr.item-row:hover td { background: #f0f9ff; border-color: #bae6fd; cursor: pointer; }

        .price-tag { font-weight: 800; color: var(--triton-blue); font-size: 16px; }
        .stock-pill { padding: 4px 10px; border-radius: 8px; background: #f1f5f9; font-weight: 700; font-size: 14px; }
        .stock-low { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }

        /* MODAL ANIMATION */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(5px);
            z-index: 1000; 
            animation: fadeIn 0.3s ease;
        }
        .modal-content { 
            background: white; 
            width: 450px; 
            margin: 50px auto; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; box-sizing: border-box; font-size: 16px; 
        }
        .form-group input:focus { border-color: var(--triton-blue); outline: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-card" style="margin-top: 50px; margin-bottom: 50px;">
    <div class="glass-header">
        <div class="header-info">
            <h1>🔱 Triton Inventory Cloud</h1>
            <div class="stats-row">
                <div class="stat-badge" id="stat">0 ΕΙΔΗ</div>
                <div class="stat-badge" style="color: #4ade80;">ΑΞΙΑ: <span id="totalValue">0,00 €</span></div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-success" onclick="exportToExcel()">📊 EXCEL</button>
            <button class="btn btn-danger" onclick="exportToPDF()">📄 PDF</button>
        </div>
    </div>

    <div class="toolbar" style="display: grid; grid-template-columns: 1fr auto auto; gap: 15px;">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="pSearch" class="search-input" placeholder="Αναζήτηση..." onkeyup="render()">
        </div>
        
        <select id="filterType" class="btn btn-outline" onchange="render()" style="padding: 10px;">
            <option value="ALL">🔍 Όλα τα Είδη</option>
            <option value="SALE">🛍️ Προς Πώληση</option>
            <option value="BUY">📦 Μόνο Αγορές</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="showGlobalHistory()">🕒 ΙΣΤΟΡΙΚΟ</button>
            <button class="btn btn-primary" onclick="openModal()">+ ΝΕΟ ΕΙΔΟΣ</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 150px;">ΚΩΔΙΚΟΣ</th>
                    <th>ΠΕΡΙΓΡΑΦΗ</th>
                    <th style="width: 100px;">ΤΥΠΟΣ</th> <th style="width: 120px;">ΤΙΜΗ</th>
                    <th style="width: 100px;">STOCK</th>
                    <th style="width: 50px;"></th>
                </tr>
            </thead>
            <tbody id="pBody"></tbody>
        </table>
    </div>
</div>

<div id="prodModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; margin-bottom: 25px;">Στοιχεία Είδους</h2>
        
        <div class="form-group">
            <label>Τύπος Είδους (Για να μην μπερδεύονται)</label>
            <select id="pType" style="border: 2px solid #0284c7;">
                <option value="SALE">🛍️ Προς Πώληση (Εμπόρευμα)</option>
                <option value="BUY">📦 Μόνο Αγορά (Α' Ύλη / Αναλώσιμο)</option>
                <option value="SERVICE">🛠️ Υπηρεσία</option>
            </select>
        </div>

        <div class="form-group">
            <label>Κωδικός / Barcode</label>
            <input type="text" id="pCode" placeholder="Σκανάρετε...">
        </div>

        <div class="form-group">
            <label>Περιγραφή</label>
            <input type="text" id="pDesc" placeholder="π.χ. Λάδια Μηχανής">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Τιμή (€)</label>
                <input type="number" id="pPrice" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Απόθεμα</label>
                <input type="number" id="pStock" value="0">
            </div>
        </div>

        <div class="form-group">
            <label>ΦΠΑ %</label>
            <select id="pVat">
                <option value="24">24%</option>
                <option value="13">13%</option>
                <option value="0">0%</option>
            </select>
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 15px;" onclick="save()">
            ΑΠΟΘΗΚΕΥΣΗ ΣΤΟ CLOUD
        </button>
        <button class="btn" style="width: 100%; justify-content: center; margin-top: 10px; color: #64748b;" onclick="closeModal()">
            ΑΚΥΡΩΣΗ
        </button>
    </div>
</div>
<script>
// 1. ΡΥΘΜΙΣΕΙΣ (Σύνδεση με Supabase)
const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpenptY3pueXRzZnFseG50dGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0ODE0NzksImV4cCI6MjA4ODA1NzQ3OX0.Dl9PiyYJJ0mYarO11PyXBlH0GN014FfPVh8g_luhKwI';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'products';

// 2. ΕΜΦΑΝΙΣΗ ΠΡΟΪΟΝΤΩΝ ΣΤΗ ΛΙΣΤΑ
async function render() {
    const search = document.getElementById('pSearch').value.toLowerCase();
    const tbody = document.getElementById('pBody');
    
    // Φέρνουμε τα δεδομένα από τη βάση
    let { data: products, error } = await _supabase
        .from(TABLE)
        .select('*')
        .order('name', { ascending: true });

    if (error) return;

    tbody.innerHTML = '';
    let count = 0;

    products.forEach(p => {
        // Αναζήτηση βάσει ονόματος ή κωδικού
        if(p.name.toLowerCase().includes(search) || (p.code && p.code.includes(search))) {
            count++;
            const isLow = (p.stock || 0) <= 5;
            tbody.innerHTML += `
                <tr onclick="edit('${p.id}', '${p.name}', '${p.code || ''}', ${p.price || 0}, ${p.stock || 0}, ${p.vat || 24})" style="cursor:pointer">
                    <td style="color:#64748b; font-size:14px;">${p.code || '---'}</td>
                    <td>${p.name}</td>
                    <td class="price">${parseFloat(p.price || 0).toFixed(2)}€</td>
                    <td><span class="stock ${isLow ? 'low' : ''}">${p.stock || 0}</span></td>
                    <td><button onclick="event.stopPropagation(); del('${p.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button></td>
                </tr>`;
        }
    });
    document.getElementById('stat').innerText = count + " ΕΙΔΗ";
}

// 3. ΑΠΟΘΗΚΕΥΣΗ (Νέο ή Update)
async function save() {
    const desc = document.getElementById('pDesc').value.trim().toUpperCase();
    const code = document.getElementById('pCode').value.trim();
    const currentId = document.getElementById('prodModal').dataset.editId;

    if(!desc) { alert("⚠️ Η περιγραφή είναι υποχρεωτική!"); return; }

    // ΕΛΕΓΧΟΣ ΔΙΠΛΟΤΥΠΟΥ ΚΩΔΙΚΟΥ
    if (code !== "") {
        const { data: existing } = await _supabase
            .from(TABLE)
            .select('name, id')
            .eq('code', code)
            .maybeSingle();

        // Αν βρεθεί άλλος κωδικός (και δεν είναι το ίδιο το προϊόν που επεξεργαζόμαστε)
        if (existing && existing.id !== currentId) {
            alert(`🚫 Ο κωδικός "${code}" χρησιμοποιείται ήδη στο προϊόν: ${existing.name}`);
            return; // Σταματάει την αποθήκευση
        }
    }

    const payload = {
        name: desc,
        code: code,
        price: parseFloat(document.getElementById('pPrice').value) || 0,
        discount: parseFloat(document.getElementById('pDisc').value) || 0,
        stock: parseInt(document.getElementById('pStock').value) || 0,
        vat: parseInt(document.getElementById('pVat').value) || 24
    };

    if (currentId) payload.id = currentId;

    try {
        const { error } = await _supabase.from(TABLE).upsert(payload);
        if (error) throw error;

        console.log("✅ Αποθηκεύτηκε!");
        closeModal();
        render();
    } catch (err) {
        alert("❌ Σφάλμα: " + err.message);
    }
}
// 4. ΕΠΕΞΕΡΓΑΣΙΑ (Όταν κάνεις κλικ σε μια γραμμή)
function edit(id, name, code, price, stock, vat, type) {
    document.getElementById('pDesc').value = name;
    if(document.getElementById('pCode')) document.getElementById('pCode').value = code;
    document.getElementById('pPrice').value = price;
    document.getElementById('pStock').value = stock;
    document.getElementById('pVat').value = vat;
    document.getElementById('pType').value = type || 'SALE'; // Επιλογή Τύπου (Πώληση/Αγορά)
    
    document.getElementById('prodModal').dataset.editId = id;
    openModal();
}

// 5. ΔΙΑΓΡΑΦΗ
async function del(id) {
    if(confirm("Διαγραφή είδους από την αποθήκη;")) {
        await _supabase.from(TABLE).delete().eq('id', id);
        render();
    }
}

// HELPER FUNCTIONS
function openModal() { 
    document.getElementById('prodModal').style.display = 'block'; 
}

function closeModal() { 
    document.getElementById('prodModal').style.display = 'none'; 
    // Καθαρισμός των ID και των πεδίων
    delete document.getElementById('prodModal').dataset.editId;
    document.getElementById('pDesc').value = '';
    if(document.getElementById('pCode')) document.getElementById('pCode').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pStock').value = '0';
    document.getElementById('pType').value = 'SALE'; // Επαναφορά στην προεπιλογή "Πώληση"
}
// Αρχική φόρτωση
window.onload = render;

// REAL-TIME UPDATE (Αν πουλήσεις κάτι από το τιμολόγιο, θα αλλάξει εδώ το stock μόνο του!)
_supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => {
    render();
}).subscribe();
  // ΣΥΝΑΡΤΗΣΗ ΓΙΑ EXCEL (CSV Format - Ανοίγει απευθείας στο Excel)
function exportToExcel() {
    let csv = "Κωδικός;Περιγραφή;Τιμή;Απόθεμα;Συνολική Αξία\n";
    
    // Παίρνουμε τα δεδομένα από τη βάση (window.allProducts)
    const data = window.allProducts || [];
    
    data.forEach(p => {
        const totalValue = (parseFloat(p.price) || 0) * (parseInt(p.stock) || 0);
        csv += `${p.code || '---'};${p.name};${p.price} €;${p.stock};${totalValue.toFixed(2)} €\n`;
    });

    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-16;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", `Triton_Inventory_${new Date().toLocaleDateString()}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// ΣΥΝΑΡΤΗΣΗ ΓΙΑ PDF (Εκτύπωση Αναφοράς)
function exportToPDF() {
    const originalContent = document.body.innerHTML;
    const printArea = document.querySelector('.scroll-area').innerHTML;
    const stats = document.querySelector('.header').innerHTML;

    // Δημιουργούμε ένα προσωρινό "καθαρό" περιβάλλον εκτύπωσης
    document.body.innerHTML = `
        <div style="padding:40px; font-family: sans-serif;">
            <h1 style="color:#0f172a">🔱 TRITON ERP - ΑΠΟΓΡΑΦΗ ΑΠΟΘΗΚΗΣ</h1>
            <hr>
            ${stats}
            <br>
            <table border="1" style="width:100%; border-collapse:collapse; margin-top:20px;">
                ${document.querySelector('table').innerHTML}
            </table>
            <p style="margin-top:30px; font-size:12px;">Ημερομηνία εξαγωγής: ${new Date().toLocaleString('el-GR')}</p>
        </div>
    `;
    
    window.print();
    location.reload(); // Επαναφορά της σελίδας μετά την εκτύπωση
}
  async function render() {
    const search = document.getElementById('pSearch').value.toLowerCase();
    const filterType = document.getElementById('filterType').value; // Το νέο φίλτρο
    const tbody = document.getElementById('pBody');
    
    let { data: products, error } = await _supabase
        .from(TABLE)
        .select('*')
        .order('name', { ascending: true });

    if (error) return;

    tbody.innerHTML = '';
    let count = 0;
    let totalValue = 0;

    products.forEach(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || (p.code && p.code.includes(search));
        const matchesFilter = filterType === 'ALL' || p.type === filterType;

        if (matchesSearch && matchesFilter) {
            count++;
            const stock = parseFloat(p.stock || 0);
            const price = parseFloat(p.price || 0);
            totalValue += stock * price;
            
            const isLow = stock <= 5;
            const typeLabel = p.type === 'SALE' ? '🛍️ Πώληση' : (p.type === 'BUY' ? '📦 Αγορά' : '🛠️ Υπηρεσία');

            tbody.innerHTML += `
                <tr class="item-row" onclick="edit('${p.id}', '${p.name}', '${p.code || ''}', ${price}, ${stock}, ${p.vat || 24}, '${p.type}')">
                    <td style="color:#64748b; font-size:13px; font-weight:600;">${p.code || '---'}</td>
                    <td style="font-weight:700;">${p.name}</td>
                    <td style="font-size:12px; color:#64748b;">${typeLabel}</td>
                    <td class="price-tag">${price.toFixed(2)}€</td>
                    <td><span class="stock-pill ${isLow ? 'stock-low' : ''}">${stock}</span></td>
                    <td><button onclick="event.stopPropagation(); del('${p.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button></td>
                </tr>`;
        }
    });

    document.getElementById('stat').innerText = count + " ΕΙΔΗ";
    document.getElementById('totalValue').innerText = totalValue.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + " €";
}
  async function save() {
    const desc = document.getElementById('pDesc').value.trim().toUpperCase();
    const code = document.getElementById('pCode').value.trim();
    const type = document.getElementById('pType').value; // Παίρνουμε τον τύπο
    const currentId = document.getElementById('prodModal').dataset.editId;

    if(!desc) { alert("⚠️ Η περιγραφή είναι υποχρεωτική!"); return; }

    const payload = {
        name: desc,
        code: code,
        type: type, // Αποθήκευση τύπου
        price: parseFloat(document.getElementById('pPrice').value) || 0,
        stock: parseFloat(document.getElementById('pStock').value) || 0,
        vat: parseInt(document.getElementById('pVat').value) || 24
    };

    if (currentId) payload.id = currentId;

    try {
        const { error } = await _supabase.from(TABLE).upsert(payload);
        if (error) throw error;
        closeModal();
        render();
    } catch (err) {
        alert("❌ Σφάλμα: " + err.message);
    }
}
</script>
</body>
</html>
