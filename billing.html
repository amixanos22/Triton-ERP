  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Professional Billing</title>
    <style>
        /* CSS ΣΤΑΘΕΡΕΣ & TRITON COLORS */
        :root { 
            --triton-blue: #0ea5e9; 
            --triton-bg: #f1f5f9; 
            --triton-border: #cbd5e1; 
            --triton-dark: #1e293b;
            --triton-red: #ef4444;
        }

        body { background: #e2e8f0; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        #triton-app { 
            width: 1150px; 
            margin: 40px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            min-height: 1000px;
        }

        /* HEADER */
        .header-top-grid { display: grid; grid-template-columns: 220px 1fr 180px; gap: 20px; border-bottom: 2px solid black; padding-bottom: 20px; margin-bottom: 25px; }
        .logo-area img { max-width: 100%; max-height: 90px; }
        .company-info h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: var(--triton-dark); }
        .company-info p { margin: 2px 0; font-size: 13px; font-weight: 600; color: #475569; }

        /* INFO BAR */
        .triton-info-bar { display: flex; background: var(--triton-bg); border-radius: 4px; border: 1px solid var(--triton-border); margin-bottom: 25px; }
        .bar-cell { flex: 1; padding: 10px 15px; border-right: 1px solid var(--triton-border); }
        .bar-cell:last-child { border-right: none; }
        .bar-cell label { display: block; font-size: 9px; color: var(--triton-blue); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .bar-cell input, .bar-cell select { border: none; outline: none; background: transparent; width: 100%; font-size: 14px; font-weight: bold; }

        /* CARDS */
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .info-card { background: var(--triton-bg); padding: 15px; border-radius: 6px; border-left: 5px solid var(--triton-blue); }
        .info-card label { display: block; font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .info-card input { border: none; border-bottom: 1px solid var(--triton-border); background: transparent; padding: 5px 0; font-size: 13px; width: 100%; margin-bottom: 10px; outline: none; }

        /* ΠΙΝΑΚΑΣ ΠΡΟΪΟΝΤΩΝ */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #f8fafc; padding: 10px; font-size: 10px; border-bottom: 2px solid black; text-transform: uppercase; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .col-input { width: 100%; border: none; outline: none; background: transparent; font-size: 13px; }

        /* FOOTER & TOTALS */
        .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .totals-container { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .total-row { display: flex; justify-content: space-between; width: 320px; font-size: 14px; font-weight: bold; color: #475569; }
        .final-row { border-top: 2px solid black; padding-top: 10px; margin-top: 5px; font-size: 22px; color: var(--triton-blue); font-weight: 900; }
        
        .profit-row { margin-top: 15px; padding: 10px; background: #f8fafc; border: 1px dashed var(--triton-blue); border-radius: 4px; width: 320px; text-align: center; }
        .profit-label { font-size: 10px; color: var(--triton-blue); display: block; text-transform: uppercase; font-weight: bold; }
        #totalProfitDisplay { font-size: 16px; font-weight: 900; color: #1e293b; }

        .btn-print { width: 320px; padding: 15px; background: black; color: white; border-radius: 8px; font-weight: 900; cursor: pointer; border: none; font-size: 16px; margin-top: 15px; }

        /* BRANCH BANNER */
        #branchBanner {
            position: fixed; right: -320px; top: 0; width: 300px; height: 100%;
            background: white; box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            z-index: 9999; transition: 0.4s; padding: 30px 20px; display: flex; flex-direction: column;
        }
        #branchBanner.active { right: 0; }
        .branch-item { padding: 15px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 10px; cursor: pointer; font-size: 13px; }
        .branch-item:hover { background: var(--triton-blue); color: white; }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:9998; }

        @media print {
            .no-print { display: none !important; }
            #triton-app { width: 100%; margin: 0; box-shadow: none; padding: 0; }
        }
        #navbar-iframe { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<div id="branchOverlay" class="overlay" onclick="closeBranches()"></div>

<div id="triton-app">
    <div class="header-top-grid">
        <div id="idxLogo" class="logo-area"></div>
        <div class="company-info">
            <h1 id="idxCompName">ΦΟΡΤΩΣΗ...</h1>
            <p id="idxActivity">-</p>
            <p id="idxAddress">-</p>
            <p>ΑΦΜ: <span id="idxTaxId">-</span> | ΔΟΥ: <span id="idxTaxOffice">-</span></p>
        </div>
        <div style="text-align: right;">
            <div style="font-weight: 900; color: var(--triton-blue);">ΤΙΜΟΛΟΓΗΣΗ</div>
            <div id="dtDisplay" style="font-size: 12px;">--/--/----</div>
        </div>
    </div>

    <div class="triton-info-bar">
        <div class="bar-cell"><label>Τύπος Εγγράφου</label>
            <select id="docType">
                <option>ΤΙΜΟΛΟΓΙΟ - ΔΕΛΤΙΟ ΑΠΟΣΤΟΛΗΣ</option>
                <option>ΔΕΛΤΙΟ ΑΠΟΣΤΟΛΗΣ</option>
                <option>ΠΙΣΤΩΤΙΚΟ ΤΙΜΟΛΟΓΙΟ</option>
            </select>
        </div>
        <div class="bar-cell"><label>Αρ. Παραστατικού</label>
            <input type="text" id="docNumber" style="color: var(--triton-blue);">
        </div>
        <div class="bar-cell"><label>Τρόπος Πληρωμής</label>
            <select id="paymentMethod">
                <option>ΜΕΤΡΗΤΑ</option>
                <option>ΚΑΡΤΑ POS</option>
                <option>ΕΠΙ ΠΙΣΤΩΣΕΙ</option>
            </select>
        </div>
    </div>

    <div class="grid-info">
        <div class="info-card">
            <div style="display:flex; justify-content:space-between;">
                <label>Στοιχεία Πελάτη</label>
                <span onclick="lookupVat()" style="cursor:pointer; color:var(--triton-blue);">🔍 Αναζήτηση ΑΦΜ</span>
            </div>
            <input id="cName" list="custData" placeholder="Όνομα Πελάτη..." onchange="autoFillCustomer()">
            <div style="display:flex; gap:10px;">
                <input id="cAfm" placeholder="ΑΦΜ" style="flex:2;">
                <input id="cDoy" placeholder="ΔΟΥ" style="flex:1;">
            </div>
            <input id="cAddr" placeholder="Διεύθυνση Έδρας">
        </div>

        <div class="info-card" style="border-left-color: #64748b;">
            <label>Τόπος Παράδοσης</label>
            <input id="deliveryAddr" placeholder="Κλικ για επιλογή υποκαταστήματος..." readonly onclick="openBranchMenu()" style="cursor:pointer; font-weight:bold; color:var(--triton-blue);">
            
            <label>Λοιπά Στοιχεία</label>
            <input id="carNumber" placeholder="Αριθμός Αυτοκινήτου (π.χ. ΙΚΥ-1234)">
            <input id="purpose" value="ΠΩΛΗΣΗ" placeholder="Σκοπός Διακίνησης">
        </div>
    </div>

    <table id="invoiceTable">
        <thead>
            <tr>
                <th style="width:45%">Περιγραφή (Autocomplete)</th>
                <th style="width:10%">Ποσ.</th>
                <th style="width:12%">Τιμή</th>
                <th style="width:8%">Εκπτ.%</th>
                <th style="width:10%">ΦΠΑ%</th>
                <th style="width:15%; text-align:right;">Σύνολο</th>
            </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
    </table>

    <div class="footer-grid">
        <div>
            <label style="font-size:9px; font-weight:bold;">ΠΑΡΑΤΗΡΗΣΕΙΣ</label>
            <textarea id="remarks" style="width:100%; height:120px; border:1px solid var(--triton-border); margin-top:5px; padding:10px; outline:none;"></textarea>
        </div>
        
        <div class="totals-container">
            <div class="total-row">
                <span>ΚΑΘΑΡΗ ΑΞΙΑ:</span>
                <span id="sumNet">0.00 €</span>
            </div>
            <div class="total-row">
                <span>ΕΚΠΤΩΣΗ:</span>
                <span id="sumDisc">0.00 €</span>
            </div>
            <div class="total-row">
                <span>ΦΠΑ:</span>
                <span id="sumTax">0.00 €</span>
            </div>
            <div class="total-row final-row">
                <span>ΤΕΛΙΚΟ ΠΟΣΟ:</span>
                <span id="sumGrand">0.00 €</span>
            </div>

            <div class="profit-row no-print">
                <span class="profit-label">ΠΡΑΓΜΑΤΙΚΟ ΚΕΡΔΟΣ</span>
                <span id="totalProfitDisplay">0.0% (0.00 €)</span>
            </div>

            <button class="btn-print no-print" onclick="finalizeAndPrint()">ΕΚΤΥΠΩΣΗ (F10)</button>
        </div>
    </div>
</div>

<div id="branchBanner">
    <h2 style="font-size:18px; color:var(--triton-blue); border-bottom:2px solid black; padding-bottom:10px;">🏠 Υποκαταστήματα</h2>
    <div id="branchList" style="margin-top:20px;"></div>
    <button onclick="closeBranches()" style="margin-top:auto; padding:10px; border:none; background:#eee; cursor:pointer;">Κλείσιμο</button>
</div>

<datalist id="custData"></datalist>
<datalist id="prodData"></datalist>

<script>
 window.onload = () => {
    loadSettings(); // Φορτώνει τα στοιχεία που σώσαμε στην Index

    const urlParams = new URLSearchParams(window.location.search);
    const docTypeParam = urlParams.get('type');

    if (docTypeParam) {
        const select = document.getElementById('docType');
        
        // 1. Αυτόματη επιλογή dropdown
        if(docTypeParam === 'TIM')     select.value = "ΤΙΜΟΛΟΓΙΟ - ΔΕΛΤΙΟ ΑΠΟΣΤΟΛΗΣ";
        if(docTypeParam === 'DA')      select.value = "ΔΕΛΤΙΟ ΑΠΟΣΤΟΛΗΣ";
        if(docTypeParam === 'PIS')     select.value = "ΠΙΣΤΩΤΙΚΟ ΤΙΜΟΛΟΓΙΟ";
        if(docTypeParam === 'PIS_SYS') select.value = "ΠΙΣΤΩΤΙΚΟ ΣΥΣΧΕΤΙΖΟΜΕΝΟ"; // Προσθήκη
        
        // 2. Αλλαγή Τίτλου για Αποδείξεις
        const headerLabel = document.querySelector('div[style*="color: var(--triton-blue)"]');
        
        if(docTypeParam === 'A-EISP') {
            if(headerLabel) headerLabel.innerText = "ΑΠΟΔΕΙΞΗ ΕΙΣΠΡΑΞΗΣ";
            select.value = "ΑΠΟΔΕΙΞΗ ΕΙΣΠΡΑΞΗΣ"; // Αν το έχεις στο dropdown
        }
        if(docTypeParam === 'A-PLHR') {
            if(headerLabel) headerLabel.innerText = "ΑΠΟΔΕΙΞΗ ΠΛΗΡΩΜΗΣ";
            select.value = "ΑΠΟΔΕΙΞΗ ΠΛΗΡΩΜΗΣ"; // Αν το έχεις στο dropdown
        }
    }

    // Μην ξεχάσεις να καλέσεις και αυτά:
    if(typeof setupAutoNumbering === "function") setupAutoNumbering();
    if(typeof addRow === "function") addRow();
    if(typeof updateDatalists === "function") updateDatalists();
    
    document.getElementById('dtDisplay').innerText = new Date().toLocaleDateString('el-GR');
};
    // ------------------------------------------------

    setupAutoNumbering();
    addRow();
    document.getElementById('dtDisplay').innerText = new Date().toLocaleDateString('el-GR');
};
    function updateDatalists() {
        const customers = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const cDl = document.getElementById('custData');
        cDl.innerHTML = '';
        Object.keys(customers).forEach(name => { let o = document.createElement('option'); o.value = name; cDl.appendChild(o); });

        const products = JSON.parse(localStorage.getItem('productsDB') || '{}');
        const pDl = document.getElementById('prodData');
        pDl.innerHTML = '';
        Object.keys(products).forEach(p => { let o = document.createElement('option'); o.value = p; pDl.appendChild(o); });
    }

    // --- 2. ΠΕΛΑΤΕΣ & ΥΠΟΚΑΤΑΣΤΗΜΑΤΑ ---
    function autoFillCustomer() {
        const name = document.getElementById('cName').value;
        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const c = db[name];
        if (c) {
            document.getElementById('cAfm').value = c.afm || "";
            document.getElementById('cDoy').value = c.doy || "";
            document.getElementById('cAddr').value = c.address || "";
            document.getElementById('deliveryAddr').value = ""; 
        }
    }

    function openBranchMenu() {
        const name = document.getElementById('cName').value;
        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const c = db[name];
        if (!c) return alert("Επιλέξτε πελάτη πρώτα.");

        const list = document.getElementById('branchList');
        list.innerHTML = `<div class="branch-item" onclick="setDelivery('${c.address}')"><strong>ΕΔΡΑ:</strong> ${c.address}</div>`;
        
        if (c.branches) {
            const bArray = Array.isArray(c.branches) ? c.branches : c.branches.split(',');
            bArray.forEach(b => {
                let div = document.createElement('div');
                div.className = "branch-item";
                div.innerText = b.trim();
                div.onclick = () => setDelivery(b.trim());
                list.appendChild(div);
            });
        }
        document.getElementById('branchBanner').classList.add('active');
        document.getElementById('branchOverlay').style.display = "block";
    }

    function setDelivery(val) {
        document.getElementById('deliveryAddr').value = val;
        closeBranches();
    }

    function closeBranches() {
        document.getElementById('branchBanner').classList.remove('active');
        document.getElementById('branchOverlay').style.display = "none";
    }

    // --- 3. ΠΙΝΑΚΑΣ ΠΡΟΪΟΝΤΩΝ & ENTER FLOW ---
    function handleNavigation(event, currentInput) {
        if (event.key === "Enter") {
            event.preventDefault();
            const row = currentInput.closest('tr');
            
            if (currentInput.classList.contains('p-name')) {
                const qtyInput = row.querySelector('.qty');
                qtyInput.focus();
                qtyInput.select();
            } 
            else if (currentInput.classList.contains('qty')) {
                const nextRow = addRow();
                nextRow.querySelector('.p-name').focus();
            }
        }
    }

    function addRow() {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" list="prodData" class="col-input p-name" placeholder="Προϊόν..." onchange="fillProd(this)" onkeydown="handleNavigation(event, this)"></td>
            <td><input type="number" class="col-input qty" value="1" oninput="recalc()" onkeydown="handleNavigation(event, this)"></td>
            <td><input type="number" class="col-input prc" readonly tabindex="-1" style="background:#f1f5f9; color:#475569; cursor:not-allowed;"></td>
            <td><input type="number" class="col-input dsc" readonly tabindex="-1" style="background:#f1f5f9; color:#475569; cursor:not-allowed;"></td>
            <td><input type="number" class="col-input tax" readonly tabindex="-1" style="background:#f1f5f9; color:#475569; cursor:not-allowed;"></td>
            <td class="row-total" style="text-align:right; font-weight:bold;">0.00 €</td>
        `;
        document.getElementById('rowsBody').appendChild(tr);
        return tr;
    }

    function fillProd(el) {
        const productsDB = JSON.parse(localStorage.getItem('productsDB') || '{}');
        const p = productsDB[el.value];
        const r = el.closest('tr');
        
        if (p) {
            r.querySelector('.prc').value = p.price || 0;
            r.querySelector('.dsc').value = p.discount || 0;
            r.querySelector('.tax').value = p.vat || 24;
            recalc();
            
            const qtyInput = r.querySelector('.qty');
            qtyInput.focus();
            qtyInput.select();
        }
    }

    function recalc() {
        let net = 0, tax = 0, discTotal = 0, costTotal = 0;
        const productsDB = JSON.parse(localStorage.getItem('productsDB') || '{}');

        document.querySelectorAll('#rowsBody tr').forEach(row => {
            const q = parseFloat(row.querySelector('.qty').value) || 0;
            const p = parseFloat(row.querySelector('.prc').value) || 0;
            const d = parseFloat(row.querySelector('.dsc').value) || 0;
            const tx = parseFloat(row.querySelector('.tax').value) || 0;
            const name = row.querySelector('.p-name').value;

            const lineRaw = q * p;
            const lineDisc = lineRaw * (d / 100);
            const lineNet = lineRaw - lineDisc;
            const lineTax = lineNet * (tx / 100);

            row.querySelector('.row-total').innerText = (lineNet + lineTax).toFixed(2) + " €";
            
            net += lineNet; tax += lineTax; discTotal += lineDisc;

            if (productsDB[name]) {
                costTotal += (parseFloat(productsDB[name].priceA) || 0) * q;
            }
        });

        document.getElementById('sumNet').innerText = net.toFixed(2) + " €";
        document.getElementById('sumDisc').innerText = discTotal.toFixed(2) + " €";
        document.getElementById('sumTax').innerText = tax.toFixed(2) + " €";
        const grand = net + tax;
        document.getElementById('sumGrand').innerText = grand.toFixed(2) + " €";

        const profitVal = net - costTotal;
        const profitPerc = net > 0 ? (profitVal / net) * 100 : 0;
        document.getElementById('totalProfitDisplay').innerText = `${profitPerc.toFixed(1)}% (${profitVal.toFixed(2)} €)`;
    }

    function finalizeAndPrint() {
        let current = parseInt(localStorage.getItem('triton_last_id'));
        localStorage.setItem('triton_last_id', current + 1);

        const db = JSON.parse(localStorage.getItem('productsDB') || '{}');
        document.querySelectorAll('#rowsBody tr').forEach(row => {
            const name = row.querySelector('.p-name').value;
            const q = parseFloat(row.querySelector('.qty').value) || 0;
            if (name && db[name]) db[name].stock = (parseFloat(db[name].stock) || 0) - q;
        });
        localStorage.setItem('productsDB', JSON.stringify(db));

        window.print();
        location.reload();
    }

    function lookupVat() {
        const afm = document.getElementById('cAfm').value;
        if (!afm) return alert("Εισάγετε ΑΦΜ.");
        window.open(`https://www.vrisko.gr/search-aade-afm/?afm=${afm}`, 'TritonHelper', 'width=800,height=600');
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'F10') { e.preventDefault(); finalizeAndPrint(); } });
  function loadSettings() {
    // 1. Διαβάζουμε το 'triton_settings' που φτιάξαμε στην Index
    const rawData = localStorage.getItem('triton_settings');
    if (!rawData) return; 

    const s = JSON.parse(rawData);

    // 2. Τοποθέτηση των στοιχείων στα ID της φόρμας (Header)
    // ΠΡΟΣΟΧΗ: Τα ID πρέπει να υπάρχουν στο HTML σου (π.χ. <div id="idxCompName">)
    if(document.getElementById('idxCompName')) document.getElementById('idxCompName').innerText = s.companyName || "✦ TRITON ERP";
    if(document.getElementById('idxActivity')) document.getElementById('idxActivity').innerText = s.activity || "-";
    if(document.getElementById('idxAddress'))  document.getElementById('idxAddress').innerText  = s.address || "-";
    if(document.getElementById('idxTaxId'))    document.getElementById('idxTaxId').innerText    = s.taxId || "-";
    if(document.getElementById('idxTaxOffice')) document.getElementById('idxTaxOffice').innerText = s.taxOffice || "-";
    if(document.getElementById('idxPhone'))     document.getElementById('idxPhone').innerText     = s.phone || "-";
    
    // 3. Εμφάνιση του Logo
    const logoContainer = document.getElementById('idxLogo');
    if (s.logoBase64 && logoContainer) {
        logoContainer.innerHTML = `<img src="${s.logoBase64}" style="max-height: 80px; max-width: 250px; object-fit: contain;">`;
    }
}
  let rowCount = 0;

function addRow() {
    rowCount++;
    const tbody = document.getElementById('tableBody');
    const tr = document.createElement('tr');
    tr.id = `row-${rowCount}`;

    tr.innerHTML = `
        <td style="font-size:11px; color:#94a3b8;">${rowCount}</td>
        <td>
            <input class="col-input" list="prodData" placeholder="Περιγραφή..." onchange="autoFillProduct(this)">
        </td>
        <td><input class="col-input" placeholder="Μ.Μ." value="ΤΕΜ"></td>
        <td><input type="number" class="col-input qty" value="1" oninput="calculateRow(this)"></td>
        <td><input type="number" class="col-input price" value="0.00" step="0.01" oninput="calculateRow(this)"></td>
        <td><input type="number" class="col-input disc" value="0" oninput="calculateRow(this)"></td>
        <td>
            <select class="col-input vat" onchange="calculateRow(this)">
                <option value="24">24%</option>
                <option value="13">13%</option>
                <option value="6">6%</option>
                <option value="0">0%</option>
            </select>
        </td>
        <td style="text-align:right; font-weight:bold;">
            <span class="row-total">0.00</span>€
        </td>
        <td class="no-print">
            <button onclick="this.closest('tr').remove(); calculateTotals();" style="color:var(--triton-red); border:none; background:none; cursor:pointer; font-weight:bold;">×</button>
        </td>
    `;
    tbody.appendChild(tr);
}
  function calculateRow(element) {
    const row = element.closest('tr');
    const qty = parseFloat(row.querySelector('.qty').value) || 0;
    const price = parseFloat(row.querySelector('.price').value) || 0;
    const disc = parseFloat(row.querySelector('.disc').value) || 0;
    const vatPercent = parseFloat(row.querySelector('.vat').value) || 0;

    // Υπολογισμός αξίας μετά την έκπτωση
    const netValue = (qty * price) * (1 - disc / 100);
    const vatAmount = netValue * (vatPercent / 100);
    const total = netValue + vatAmount;

    row.querySelector('.row-total').innerText = netValue.toFixed(2); // Δείχνουμε την καθαρή αξία στη γραμμή
    
    calculateTotals();
}

function calculateTotals() {
    let subtotal = 0;
    let totalVat = 0;

    document.querySelectorAll('#tableBody tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const price = parseFloat(row.querySelector('.price').value) || 0;
        const disc = parseFloat(row.querySelector('.disc').value) || 0;
        const vatPercent = parseFloat(row.querySelector('.vat').value) || 0;

        const net = (qty * price) * (1 - disc / 100);
        const v = net * (vatPercent / 100);

        subtotal += net;
        totalVat += v;
    });

    // Ενημέρωση των πεδίων στο Footer (αν τα έχεις ονομάσει έτσι)
    if(document.getElementById('subtotal')) document.getElementById('subtotal').innerText = subtotal.toFixed(2) + " €";
    if(document.getElementById('vatTotal')) document.getElementById('vatTotal').innerText = totalVat.toFixed(2) + " €";
    if(document.getElementById('grandTotal')) document.getElementById('grandTotal').innerText = (subtotal + totalVat).toFixed(2) + " €";
}
</script>
</body>
</html>
