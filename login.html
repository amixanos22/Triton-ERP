  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Είσοδος | TRITONAS</title>
    <link href='https://fonts.googleapis.com/css?family=Montserrat:400,600,700' rel='stylesheet'>
    <link href='https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css' rel='stylesheet'/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe { display: none !important; }
        body { top: 0 !important; margin: 0; font-family: 'Montserrat', sans-serif; height: 100vh; display: flex; flex-direction: column; }

        /* 2. ΤΟ ΠΑΝΩ ΜΕΡΟΣ (ΛΕΥΚΟ) */
        header {
            width: 100%;
            padding: 25px 10%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #0ea5e9; /* Το μπλε του Τρίτωνα */
            letter-spacing: 1px;
        }

        /* 3. ΤΟ ΚΑΤΩ ΜΕΡΟΣ (ΜΠΛΕ ΦΟΝΤΟ) */
        main {
            flex: 1;
            background: #0c4a6e; /* Εδώ ξεκινάει το μπλε */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-top-left-radius: 60px; /* Μια ωραία καμπύλη για στυλ */
            border-top-right-radius: 60px;
        }

        .login-card { 
            background: white; 
            width: 100%; 
            max-width: 400px; 
            padding: 45px; 
            border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3); 
            text-align: center; 
        }

        /* ΣΤΥΛ ΦΟΡΜΑΣ */
        .login-card h2 { color: #1e293b; font-size: 26px; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 18px; color: #94a3b8; }
        .input-group input { 
            width: 100%; padding: 15px 15px 15px 45px; 
            border: 1px solid #e2e8f0; border-radius: 15px; 
            box-sizing: border-box; font-size: 16px; outline: none;
        }

        .btn-submit { 
            width: 100%; padding: 16px; background: #0ea5e9; 
            color: white; border: none; border-radius: 15px; 
            font-weight: 700; cursor: pointer; font-size: 16px;
        }

        .divider { margin: 25px 0; color: #cbd5e1; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #f1f5f9; margin: 0 10px; }

        .btn-secure { 
            width: 100%; padding: 15px; background: #f8fafc; 
            border: 1px solid #e2e8f0; border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; 
            gap: 12px; cursor: pointer; font-weight: 600; color: #334155; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TRITONAS</div>
    </header>

    <main>
        <div class="login-card">
            <h2>Σύνδεση</h2>
            
            <form onsubmit="return false;">
                <div class="input-group">
                    <i class="fa fa-envelope-o"></i>
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="Κωδικός" required>
                </div>
                <button type="submit" class="btn-submit">Είσοδος</button>
            </form>

            <div class="divider">ή</div>

            <button class="btn-secure" onclick="signInWithGitHub()">
                <i class="fa fa-shield" style="color: #0ea5e9; font-size: 18px;"></i>
                Triton Secure ID
            </button>
        </div>
    </main>

    <script>
        // Πρόσθεσε εδώ το δικό σου Supabase URL και Key
        const supabaseUrl = 'https://pizzmcznytsfqlxnttbv.supabase.co';
        const supabaseKey = '36533ee8f46ab5ea11ad58f60e45510c9f7fbc7f'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function signInWithGitHub() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'github',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) alert('Σφάλμα: ' + error.message);
        }
    </script>
</body>
</html>
