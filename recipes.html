 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Recipes - Κοστολόγηση</title>
    <style>
        /* ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; visibility: hidden !important; height: 0 !important; 
        }

        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark: #0f172a;
            --triton-bg: #f8fafc; 
            --triton-border: #e2e8f0; 
        }
        
        body { 
            background: #e2e8f0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: #1e293b; 
        }

        /* Η ΦΟΡΜΑ ΚΑΤΕΒΑΙΝΕΙ 100px ΑΠΟ ΤΗΝ ΚΟΡΥΦΗ */
        .container { 
            max-width: 1000px; 
            margin: 100px auto 50px auto; /* 100px ΠΑΝΩ, AUTO ΔΕΞΙΑ-ΑΡΙΣΤΕΡΑ */
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-top: 5px solid var(--triton-blue); 
            position: relative;
        }

        h1 { color: var(--triton-blue); display: flex; align-items: center; gap: 10px; margin-top: 0; font-size: 1.8rem; }
        .recipe-card { border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; margin-bottom: 25px; background: #f8fafc; }
        
        .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr 45px; gap: 12px; margin-top: 10px; align-items: center; }
        .header-row { font-weight: 800; font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; }
        
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; background: white; font-size: 14px; transition: 0.2s; }
        
        .btn-add { background: var(--triton-dark); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-del { background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; height: 40px; width: 40px; font-weight: bold; font-size: 18px; }
        
        .total-cost { font-size: 26px; font-weight: 900; color: var(--triton-blue); text-align: right; margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
        
        .extra-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; background: #f1f5f9; padding: 20px; border-radius: 10px; }
        .extra-inputs label { font-size: 12px; font-weight: bold; color: #64748b; display: block; margin-bottom: 8px; }

        .nav-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1><span>🧪</span> Triton Recipes</h1>
    <p style="margin-bottom: 25px; color: #64748b;">Κοστολόγηση παραγωγής και σύνδεση υλικών.</p> 
    
    <div class="recipe-card">
        <div style="display: flex; gap: 25px; align-items: flex-start; flex-wrap: wrap;">
            <div style="flex: 2; min-width: 250px;">
                <label><strong>Τελικό Προϊόν:</strong></label>
                <select id="finalProductSelect" onchange="loadRecipeData(this.value)" style="margin-top:8px;">
                    <option value="">-- Επιλέξτε από την Αποθήκη --</option>
                </select>
            </div>
            <div id="quickHistory" style="flex: 1; background: #f0f9ff; padding: 15px; border-radius: 12px; border: 1px dashed #0ea5e9; min-width: 200px;">
                <div style="font-size: 11px; font-weight: 800; color: #0ea5e9; text-transform: uppercase; margin-bottom: 6px;">🕒 Στατιστικά</div>
                <div id="historyContent" style="font-size: 14px; color: #1e293b; font-weight: 600;">-</div>
            </div>
        </div>
        
        <hr style="margin:25px 0; border:0; border-top:1px solid #e2e8f0;">
        
        <div class="header-row grid">
            <div>Υλικό / Συστατικό</div>
            <div>Ποσότητα</div>
            <div>Κόστος Μον.</div>
            <div>Σύνολο</div>
            <div></div>
        </div>
        
        <div id="ingredientsList"></div>
        
        <button class="btn-add" onclick="addIngredientRow()" style="margin-top:20px; background: #64748b;">+ Προσθήκη Συστατικού</button>

        <div class="extra-inputs">
            <div>
                <label>Φύρα (%)</label>
                <input type="number" id="wastePercent" value="0" oninput="calculateRecipeTotal()">
            </div>
            <div>
                <label>Λοιπά Έξοδα (€)</label>
                <input type="number" id="overheadCost" value="0" oninput="calculateRecipeTotal()">
            </div>
        </div>
        
        <div class="total-cost">Κόστος Παραγωγής: <span id="recipeTotal">0.00</span> €</div>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn-add" style="background:var(--triton-blue); font-size:18px; padding:18px;" onclick="saveRecipe()">💾 ΑΠΟΘΗΚΕΥΣΗ ΣΥΝΤΑΓΗΣ</button>
    </div>
   
    <div class="recipe-card" style="margin-top: 40px; border-top: 5px solid #64748b;">
        <h3 style="color: #64748b; margin-top: 0; font-size: 1.2rem;">📋 Αρχείο Συνταγών</h3>
        <div id="savedRecipesList"></div>
    </div>
</div>

<script>
    // Ανίχνευση Iframe - Αν είμαστε μέσα στην Index, το background γίνεται διαφανές
    if (window.self !== window.top) {
        document.body.style.background = "transparent";
    }

    const productsDB = JSON.parse(localStorage.getItem('triton_products') || '[]');

    function init() {
        const select = document.getElementById('finalProductSelect');
        productsDB.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name || p.desc;
            opt.textContent = p.name || p.desc;
            select.appendChild(opt);
        });
    }

    function addIngredientRow() {
        const div = document.createElement('div');
        div.className = 'grid';
        let options = '<option value="">-- Υλικό --</option>';
        productsDB.forEach(p => {
            const pName = p.name || p.desc;
            const pCost = p.price || 0; 
            options += `<option value="${pName}" data-cost="${pCost}">${pName}</option>`;
        });

        div.innerHTML = `
            <select class="ing-name" onchange="updateRowCost(this)">${options}</select>
            <input type="number" class="ing-qty" value="1" step="0.01" oninput="updateRowCost(this)">
            <input type="text" class="ing-unit-cost" readonly value="0.00">
            <input type="text" class="ing-total-cost" readonly value="0.00">
            <button class="btn-del" onclick="this.parentElement.remove(); calculateRecipeTotal();">×</button>
        `;
        document.getElementById('ingredientsList').appendChild(div);
    }

    function updateRowCost(input) {
        const row = input.closest('.grid');
        const select = row.querySelector('.ing-name');
        const qty = parseFloat(row.querySelector('.ing-qty').value) || 0;
        const unitCost = parseFloat(select.options[select.selectedIndex].getAttribute('data-cost')) || 0;
        row.querySelector('.ing-unit-cost').value = unitCost.toFixed(2);
        row.querySelector('.ing-total-cost').value = (unitCost * qty).toFixed(2);
        calculateRecipeTotal();
    }

    function calculateRecipeTotal() {
        let subtotal = 0;
        document.querySelectorAll('.ing-total-cost').forEach(el => {
            subtotal += parseFloat(el.value) || 0;
        });
        const waste = parseFloat(document.getElementById('wastePercent').value) || 0;
        const overhead = parseFloat(document.getElementById('overheadCost').value) || 0;
        let total = subtotal + (subtotal * waste / 100) + overhead;
        document.getElementById('recipeTotal').innerText = total.toFixed(2);
    }

    function saveRecipe() {
        const finalProductName = document.getElementById('finalProductSelect').value;
        if (!finalProductName) return alert("⚠️ Επιλέξτε προϊόν!");
        const ingredients = [];
        document.querySelectorAll('#ingredientsList .grid').forEach(row => {
            const name = row.querySelector('.ing-name').value;
            const qty = row.querySelector('.ing-qty').value;
            if (name && qty) ingredients.push({ name, qty });
        });
        const recipes = JSON.parse(localStorage.getItem('triton_recipes') || '{}');
        recipes[finalProductName] = {
            totalCost: document.getElementById('recipeTotal').innerText,
            ingredients: ingredients,
            waste: document.getElementById('wastePercent').value,
            overhead: document.getElementById('overheadCost').value
        };
        localStorage.setItem('triton_recipes', JSON.stringify(recipes));
        alert("✅ Αποθηκεύτηκε!");
        displaySavedRecipes(); 
    }

    function loadRecipeData(productName) {
        if (!productName) return;
        const recipes = JSON.parse(localStorage.getItem('triton_recipes') || '{}');
        const recipe = recipes[productName];
        if (recipe) {
            document.getElementById('wastePercent').value = recipe.waste || 0;
            document.getElementById('overheadCost').value = recipe.overhead || 0;
            document.getElementById('ingredientsList').innerHTML = '';
            recipe.ingredients.forEach(ing => {
                addIngredientRow();
                const rows = document.querySelectorAll('#ingredientsList .grid');
                const lastRow = rows[rows.length - 1];
                const selectEl = lastRow.querySelector('.ing-name');
                selectEl.value = ing.name;
                lastRow.querySelector('.ing-qty').value = ing.qty;
                updateRowCost(selectEl);
            });
        }
        calculateRecipeTotal();
    }

    function displaySavedRecipes() {
        const recipes = JSON.parse(localStorage.getItem('triton_recipes') || '{}');
        const container = document.getElementById('savedRecipesList');
        if (Object.keys(recipes).length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; font-size:0.9rem; padding:10px;">Κενό αρχείο.</p>';
            return;
        }
        let html = '<table style="width:100%; border-collapse: collapse;">';
        Object.keys(recipes).forEach(name => {
            html += `<tr style="border-bottom: 1px solid #e2e8f0;">
                <td style="padding:15px; font-weight:bold; color:#334155;">${name}</td>
                <td style="padding:15px; color:var(--triton-blue); font-weight:800; text-align:right;">${recipes[name].totalCost} €</td>
                <td style="padding:15px; text-align:right;">
                    <button onclick="deleteFullRecipe('${name}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Διαγραφή</button>
                </td>
            </tr>`;
        });
        html += '</table>';
        container.innerHTML = html;
    }

    function deleteFullRecipe(name) {
        if (confirm(`Διαγραφή;`)) {
            const recipes = JSON.parse(localStorage.getItem('triton_recipes') || '{}');
            delete recipes[name];
            localStorage.setItem('triton_recipes', JSON.stringify(recipes));
            displaySavedRecipes();
        }
    }

    window.onload = function() { init(); displaySavedRecipes(); };
</script>
</body>
</html>
