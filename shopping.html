 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoppingTriton - Έξυπνες Αγορές</title>
    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; visibility: hidden !important; height: 0 !important; 
        }

        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark: #0f172a;
            --triton-bg: #f8fafc; 
            --triton-border: #e2e8f0; 
        }

        body { 
            background: #e2e8f0; 
            margin: 0; 
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: #1e293b; 
        }

        /* 📐 ΑΕΡΑΣ 100 ΑΠΟ ΤΗΝ ΚΟΡΥΦΗ */
        .container { 
            max-width: 1100px; 
            margin: 100px auto 50px auto; 
            background: white; 
            padding: 35px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border-top: 5px solid var(--triton-blue); 
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f1f5f9; }
        .logo-area h1 { color: var(--triton-blue); margin: 0; font-size: 28px; letter-spacing: -1px; display: flex; align-items: center; gap: 10px; }
        
        .form-top { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; background: #f8fafc; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid var(--triton-border); }
        label { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; font-size: 14px; box-sizing: border-box; }
        
        .items-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .items-table th { background: #f1f5f9; color: #475569; padding: 15px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; }
        .items-table td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
        
        .row-input-name { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; font-weight: 600; color: #1e293b; }
        .row-input-num { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; text-align: center; font-weight: 600; }
        
        .btn-add-row { background: var(--triton-dark); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.2s; }
        .btn-add-row:hover { opacity: 0.9; }
        
        .summary-area { margin-top: 35px; padding: 30px; background: var(--triton-blue); color: white; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4); }
        .total-amount { font-size: 40px; font-weight: 900; }
        
        .btn-complete { background: white; color: var(--triton-blue); border: none; padding: 18px 45px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-complete:hover { background: #f8fafc; transform: translateY(-2px); }

        .nav-header { display: none; }
    </style>
</head>
<body>

<datalist id="productsData"></datalist>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <h1><span>🛸</span> Shopping<span>Triton</span></h1>
            <p style="margin:5px 0 0; color:#64748b; font-size:13px; font-weight: 500;">Έξυπνη Καταχώρηση Αγορών & Ενημέρωση Αποθήκης</p>
        </div>
    </div>

    <div class="form-top">
        <div>
            <label>Προμηθευτής</label>
            <select id="supSelect"><option value="">-- Επιλέξτε --</option></select>
        </div>
        <div><label>Αρ. Τιμολογίου</label><input type="text" id="invDoc" placeholder="π.χ. ΤΔΑ-1024"></div>
        <div><label>Ημερομηνία</label><input type="date" id="invDate"></div>
    </div>

    <table class="items-table">
        <thead>
            <tr>
                <th style="width:45%">Προϊόν / Υλικό</th>
                <th style="width:15%; text-align:center">Ποσότητα</th>
                <th style="width:20%; text-align:center">Τιμή Αγοράς (€)</th>
                <th style="width:15%; text-align:right">Σύνολο (€)</th>
                <th style="width:5%"></th>
            </tr>
        </thead>
        <tbody id="cartBody"></tbody>
    </table>

    <button class="btn-add-row" onclick="addNewLine()">+ Προσθήκη Γραμμής (F2)</button>

    <div class="summary-area">
        <div>
            <div style="font-size:12px; text-transform:uppercase; font-weight:bold; opacity:0.9; letter-spacing: 1px;">Συνολική Αξία Τιμολογίου</div>
            <div class="total-amount"><span id="grandTotal">0.00</span> €</div>
        </div>
        <button class="btn-complete" onclick="finalizePurchase()">ΑΠΟΘΗΚΕΥΣΗ & ΕΝΗΜΕΡΩΣΗ</button>
    </div>
</div>

<script>
// Ανίχνευση Iframe
if (window.self !== window.top) {
    document.body.style.background = "transparent";
}

// Φόρτωση Δεδομένων κατά την εκκίνηση
window.onload = function() {
    initShoppingData();
};

function initShoppingData() {
    // 1. Φόρτωση Προμηθευτών
    const sups = JSON.parse(localStorage.getItem('triton_suppliers') || '[]');
    const sSelect = document.getElementById('supSelect');
    sSelect.innerHTML = '<option value="">-- Επιλέξτε --</option>';
    sups.forEach(s => {
        const name = s.name || s.company;
        sSelect.add(new Option(name, name));
    });

    // 2. Φόρτωση Προϊόντων για Datalist (για γρήγορη αναζήτηση στη γραμμή)
    const products = JSON.parse(localStorage.getItem('triton_products') || '[]');
    const dList = document.getElementById('productsData');
    dList.innerHTML = '';
    products.forEach(p => {
        let opt = document.createElement('option');
        opt.value = p.name || p.desc;
        dList.appendChild(opt);
    });

    document.getElementById('invDate').valueAsDate = new Date();
    addNewLine(); // Πρώτη γραμμή
}

function addNewLine() {
    const tbody = document.getElementById('cartBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td><input type="text" class="row-input-name" list="productsData" placeholder="Αναζήτηση υλικού..." onkeydown="handleEnter(event, 'name')"></td>
        <td><input type="number" class="row-input-num qty" value="1" step="0.01" oninput="updateRow(this)" onkeydown="handleEnter(event, 'qty')"></td>
        <td><input type="number" class="row-input-num price" step="0.01" placeholder="0.00" oninput="updateRow(this)" onkeydown="handleEnter(event, 'price')"></td>
        <td style="text-align:right; font-weight:bold; font-size:16px;"><span class="row-total">0.00</span>€</td>
        <td style="text-align:right"><button onclick="this.closest('tr').remove(); calcGrandTotal();" style="color:#ef4444; border:none; background:none; cursor:pointer; font-size:22px;">&times;</button></td>
    `;
    tbody.appendChild(row);
    row.querySelector('.row-input-name').focus();
}

function handleEnter(event, fieldType) {
    if (event.key === 'Enter') {
        event.preventDefault();
        const tr = event.target.closest('tr');
        const products = JSON.parse(localStorage.getItem('triton_products') || '[]');
        const pName = tr.querySelector('.row-input-name').value;

        if (fieldType === 'name') {
            const product = products.find(p => (p.name || p.desc) === pName);
            if(product) {
                const lastCost = product.cost || 0;
                const priceInp = tr.querySelector('.price');
                priceInp.value = lastCost;
                priceInp.dataset.oldPrice = lastCost;
            }
            tr.querySelector('.qty').focus();
        } 
        else if (fieldType === 'qty') {
            tr.querySelector('.price').focus();
        } 
        else if (fieldType === 'price') {
            checkPriceIncrease(tr, pName);
            addNewLine();
        }
    }
}

function checkPriceIncrease(tr, pName) {
    const newCost = parseFloat(tr.querySelector('.price').value);
    const oldCost = parseFloat(tr.querySelector('.price').dataset.oldPrice || 0);
    
    if (newCost > oldCost && oldCost > 0) {
        const suggestedSale = (newCost / 0.6).toFixed(2); // Πρόταση με 40% Margin
        alert(`⚠️ ΠΡΟΣΟΧΗ: Ανατίμηση στο ${pName}!\nΝέο Κόστος: ${newCost}€ (Παλιό: ${oldCost}€).\nΠρόταση νέας πώλησης: ${suggestedSale}€`);
    }
}

function updateRow(input) {
    const tr = input.closest('tr');
    const q = parseFloat(tr.querySelector('.qty').value) || 0;
    const p = parseFloat(tr.querySelector('.price').value) || 0;
    tr.querySelector('.row-total').innerText = (q * p).toFixed(2);
    calcGrandTotal();
}

function calcGrandTotal() {
    let total = 0;
    document.querySelectorAll('.row-total').forEach(span => total += parseFloat(span.innerText));
    document.getElementById('grandTotal').innerText = total.toFixed(2);
}

function finalizePurchase() {
    let products = JSON.parse(localStorage.getItem('triton_products') || '[]');
    let updateCount = 0;
    
    document.querySelectorAll('#cartBody tr').forEach(row => {
        const name = row.querySelector('.row-input-name').value;
        const newCost = parseFloat(row.querySelector('.price').value);
        const qty = parseFloat(row.querySelector('.qty').value);

        const pIndex = products.findIndex(p => (p.name || p.desc) === name);
        if(pIndex !== -1 && !isNaN(qty)) {
            products[pIndex].cost = newCost; // Ενημέρωση τελευταίου κόστους
            products[pIndex].stock = (parseFloat(products[pIndex].stock) || 0) + qty;
            updateCount++;
        }
    });

    if(updateCount > 0) {
        localStorage.setItem('triton_products', JSON.stringify(products));
        alert("🚀 Η Αποθήκη Triton ενημερώθηκε επιτυχώς!");
        // Εδώ καλούμε τη συνάρτηση κλεισίματος από την Index αν υπάρχει
        if(window.parent && window.parent.closeForm) window.parent.closeForm();
    } else {
        alert("⚠️ Παρακαλώ επιλέξτε προϊόντα που υπάρχουν στην αποθήκη.");
    }
}

// Shortcut F2
document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') {
        e.preventDefault();
        addNewLine();
    }
});
</script>
</body>
</html>
