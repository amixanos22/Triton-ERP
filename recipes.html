<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Recipes - Κοστολόγηση Παραγωγής</title>
    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; 
            visibility: hidden !important; 
            height: 0 !important; 
        }

        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark-blue: #000080;
            --triton-bg: #f8fafc; 
            --triton-border: #e2e8f0; 
        }
        
        body { 
            background: #e2e8f0; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #1e293b; 
        }

        /* Navigation Bar */
        .nav-header {
            background: var(--triton-dark-blue);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 5px 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        .container { 
            max-width: 1000px; 
            margin: 80px auto 40px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-top: 5px solid var(--triton-blue); 
        }

        h1 { color: var(--triton-blue); display: flex; align-items: center; gap: 10px; margin-top: 0; }
        .recipe-card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 20px; margin-bottom: 20px; background: #f8fafc; }
        
        .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 10px; margin-top: 10px; align-items: center; }
        .header-row { font-weight: 800; font-size: 11px; text-transform: uppercase; color: #64748b; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; background: white; }
        
        .btn-add { background: #1e293b; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-del { background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; height: 38px; font-weight: bold; }
        
        .total-cost { font-size: 24px; font-weight: 800; color: var(--triton-blue); text-align: right; margin-top: 15px; border-top: 2px solid #e2e8f0; padding-top: 10px; }
        
        .extra-inputs { display: flex; gap: 20px; margin-top: 15px; background: #f1f5f9; padding: 15px; border-radius: 8px; }
        .extra-inputs div { flex: 1; }
        .extra-inputs label { font-size: 12px; font-weight: bold; color: #64748b; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="back-btn">⬅ Επιστροφή στο Μενού</a>
    <span style="color: white; font-weight: bold;">TRITON RECIPES</span>
</div>

<div class="container">
    <h1><span>🧪</span> Triton Recipes</h1>
    <p>Σύνδεση υλικών αγοράς με τελικά προϊόντα πώλησης.</p> 
    
    <div class="recipe-card">
        <div style="display: flex; gap: 20px; align-items: flex-start;">
            <div style="flex: 2;">
                <label><strong>Επιλογή Τελικού Προϊόντος:</strong></label>
                <select id="finalProductSelect" onchange="loadRecipeData(this.value)">
                    <option value="">-- Επιλέξτε Προϊόν --</option>
                </select>
            </div>
            <div id="quickHistory" style="flex: 1; background: #f0f9ff; padding: 10px; border-radius: 8px; border: 1px dashed #0ea5e9; min-height: 60px;">
                <div style="font-size: 11px; font-weight: 800; color: #0ea5e9; text-transform: uppercase; margin-bottom: 5px;">🕒 Τελευταία Πώληση</div>
                <div id="historyContent" style="font-size: 12px; color: #1e293b;">-</div>
            </div>
        </div>
        
        <hr style="margin:20px 0; border:0; border-top:1px solid #cbd5e1;">
        
        <div class="header-row grid">
            <div>Υλικό / Συστατικό</div>
            <div>Ποσότητα</div>
            <div>Κόστος Μον.</div>
            <div>Σύνολο</div>
            <div></div>
        </div>
        
        <div id="ingredientsList"></div>
        
        <button class="btn-add" onclick="addIngredientRow()" style="margin-top:15px;">+ Προσθήκη Υλικού</button>

        <div class="extra-inputs">
            <div>
                <label>Φύρα Παραγωγής (%)</label>
                <input type="number" id="wastePercent" value="0" oninput="calculateRecipeTotal()">
            </div>
            <div>
                <label>Λειτουργικά Έξοδα (€)</label>
                <input type="number" id="overheadCost" value="0" oninput="calculateRecipeTotal()">
            </div>
        </div>
        
        <div class="total-cost">Κόστος Παραγωγής: <span id="recipeTotal">0.00</span>€</div>
    </div>
    
    <button class="btn-add" style="background:var(--triton-blue); width:100%; font-size:18px; padding:15px;" onclick="saveRecipe()">ΑΠΟΘΗΚΕΥΣΗ ΣΥΝΤΑΓΗΣ</button>
    <button class="btn-add" style="background:#64748b; width:100%; font-size:16px; padding:12px; margin-top:10px;" onclick="saveAsNewRecipe()">💾 ΑΠΟΘΗΚΕΥΣΗ ΩΣ ΝΕΑ (CLONE)</button>
    <button class="btn-add" style="background:var(--triton-blue); width:100%; font-size:16px; padding:12px; margin-top:10px;" onclick="printRecipeAnalysis()">🖨️ ΕΚΤΥΠΩΣΗ ΑΝΑΛΥΣΗΣ</button>
   
    <div class="recipe-card" style="margin-top: 30px; border-top: 5px solid #64748b;">
        <h3 style="color: #64748b; margin-top: 0;">📋 Αποθηκευμένες Συνταγές</h3>
        <div id="savedRecipesList"></div>
    </div>
</div>

<script>
    const productsDB = JSON.parse(localStorage.getItem('triton_products') || '{}');

    function init() {
        const select = document.getElementById('finalProductSelect');
        Object.values(productsDB).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.desc;
            opt.textContent = p.desc;
            select.appendChild(opt);
        });
    }

    function addIngredientRow() {
        const div = document.createElement('div');
        div.className = 'grid';
        let options = '<option value="">-- Επιλογή --</option>';
        Object.values(productsDB).forEach(p => {
            options += `<option value="${p.desc}" data-cost="${p.cost}">${p.desc}</option>`;
        });

        div.innerHTML = `
            <select class="ing-name" onchange="updateRowCost(this)">${options}</select>
            <input type="number" class="ing-qty" value="1" oninput="updateRowCost(this)">
            <input type="text" class="ing-unit-cost" readonly value="0.00">
            <input type="text" class="ing-total-cost" readonly value="0.00">
            <button class="btn-del" onclick="removeRow(this)">X</button>
        `;
        document.getElementById('ingredientsList').appendChild(div);
    }

    function removeRow(btn) {
        btn.closest('.grid').remove();
        calculateRecipeTotal();
    }

    function updateRowCost(input) {
        const row = input.closest('.grid');
        const select = row.querySelector('.ing-name');
        const qty = parseFloat(row.querySelector('.ing-qty').value) || 0;
        const unitCost = parseFloat(select.options[select.selectedIndex].getAttribute('data-cost')) || 0;
        row.querySelector('.ing-unit-cost').value = unitCost.toFixed(2);
        row.querySelector('.ing-total-cost').value = (unitCost * qty).toFixed(2);
        calculateRecipeTotal();
    }

    function calculateRecipeTotal() {
        let subtotal = 0;
        document.querySelectorAll('.ing-total-cost').forEach(el => {
            subtotal += parseFloat(el.value) || 0;
        });
        
        const waste = parseFloat(document.getElementById('wastePercent').value) || 0;
        const overhead = parseFloat(document.getElementById('overheadCost').value) || 0;
        
        let total = subtotal + (subtotal * waste / 100) + overhead;
        document.getElementById('recipeTotal').innerText = total.toFixed(2);
    }

    function saveRecipe() {
        const finalProductName = document.getElementById('finalProductSelect').value;
        if (!finalProductName) return alert("⚠️ Επιλέξτε προϊόν!");

        const ingredients = [];
        document.querySelectorAll('#ingredientsList .grid').forEach(row => {
            const name = row.querySelector('.ing-name').value;
            const qty = row.querySelector('.ing-qty').value;
            if (name && qty) ingredients.push({ name, qty });
        });

        const recipes = JSON.parse(localStorage.getItem('tritonRecipes') || '{}');
        recipes[finalProductName] = {
            totalCost: document.getElementById('recipeTotal').innerText,
            ingredients: ingredients,
            waste: document.getElementById('wastePercent').value,
            overhead: document.getElementById('overheadCost').value
        };

        localStorage.setItem('tritonRecipes', JSON.stringify(recipes));
        alert("✅ Αποθηκεύτηκε!");
        displaySavedRecipes(); 
    }

    function loadRecipeData(productName) {
        if (!productName) return;
        const recipes = JSON.parse(localStorage.getItem('tritonRecipes') || '{}');
        const recipe = recipes[productName];

        if (recipe) {
            document.getElementById('wastePercent').value = recipe.waste || 0;
            document.getElementById('overheadCost').value = recipe.overhead || 0;
            document.getElementById('ingredientsList').innerHTML = '';

            recipe.ingredients.forEach(ing => {
                addIngredientRow();
                const rows = document.querySelectorAll('#ingredientsList .grid');
                const lastRow = rows[rows.length - 1];
                const selectEl = lastRow.querySelector('.ing-name');
                selectEl.value = ing.name;
                lastRow.querySelector('.ing-qty').value = ing.qty;
                updateRowCost(selectEl);
            });
        }
        calculateRecipeTotal();
    }

    function displaySavedRecipes() {
        const recipes = JSON.parse(localStorage.getItem('tritonRecipes') || '{}');
        const container = document.getElementById('savedRecipesList');
        let html = '<table style="width:100%; border-collapse: collapse;">';
        Object.keys(recipes).forEach(name => {
            html += `<tr style="border-bottom: 1px solid #e2e8f0;">
                <td style="padding:10px; font-weight:bold;">${name}</td>
                <td style="padding:10px; color:var(--triton-blue);">${recipes[name].totalCost} €</td>
                <td style="padding:10px; text-align:right;">
                    <button class="btn-del" onclick="deleteFullRecipe('${name}')" style="height:auto; padding:5px 10px;">Διαγραφή</button>
                </td>
            </tr>`;
        });
        html += '</table>';
        container.innerHTML = html;
    }

    function deleteFullRecipe(name) {
        if (confirm(`Διαγραφή συνταγής ${name};`)) {
            const recipes = JSON.parse(localStorage.getItem('tritonRecipes') || '{}');
            delete recipes[name];
            localStorage.setItem('tritonRecipes', JSON.stringify(recipes));
            displaySavedRecipes();
        }
    }

    function printRecipeAnalysis() {
        // ... (Ο κώδικας εκτύπωσης που είχες, είναι σωστός)
    }

    window.onload = function() {
        init();
        displaySavedRecipes();
    };
</script>
</body>
</html>
