  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Απόδειξη Είσπραξης</title>
    <style>
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; visibility: hidden !important; height: 0 !important; 
        }

        :root { 
            --triton-dark: #0f172a; 
            --triton-blue: #0ea5e9; 
            --triton-light: #f8fafc;
            --triton-border: #e2e8f0;
        }

        body { 
            background: #e2e8f0; 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: #1e293b;
        }

        #triton-receipt-box { 
            max-width: 800px; 
            margin: 60px auto 50px auto; 
            background: #fff; 
            border-radius: 15px; 
            border: 1px solid var(--triton-border); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            overflow: hidden;
        }

        .company-info { padding: 25px; border-bottom: 2px solid var(--triton-blue); display: flex; justify-content: space-between; align-items: flex-start; background: white; }
        .company-details h1 { margin: 0; color: var(--triton-blue); font-size: 24px; text-transform: uppercase; font-weight: 900; }
        .company-details p { margin: 4px 0; color: #475569; font-size: 13px; font-weight: 500; }
        
        .logo-area { max-width: 130px; max-height: 100px; display: flex; align-items: center; justify-content: flex-end; }
        .logo-area img { max-width: 100%; max-height: 100px; object-fit: contain; border-radius: 5px; }
        
        .triton-header { background: var(--triton-dark); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .counter-badge { background: var(--triton-blue); color: #fff; padding: 6px 15px; border-radius: 8px; font-weight: 900; font-size: 14px; }
        
        .form-container { padding: 30px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .field-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .field-group label { font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        .field-group input, .field-group select, .field-group textarea { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .field-group input:focus { border-color: var(--triton-blue); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        
        #cheque-area { background: #f0f9ff; border: 1px solid #bae6fd; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: none; }
        
        .amount-panel { background: #f8fafc; border: 2px dashed var(--triton-blue); border-radius: 15px; padding: 20px; text-align: center; margin-top: 10px; }
        .big-amount-input { font-size: 36px; font-weight: 900; border: none; background: transparent; width: 180px; text-align: center; color: var(--triton-dark); outline: none; }
        
        .btn-main { background: var(--triton-dark); color: white; border: none; padding: 18px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 20px; transition: 0.3s; font-size: 16px; }
        .btn-main:hover { background: var(--triton-blue); }
        
        #balance-info { font-size: 13px; color: #ef4444; font-weight: bold; margin-top: 6px; display: block; }

        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; }
            #triton-receipt-box { margin: 0; border: none; box-shadow: none; width: 100%; } 
            .company-info { border-bottom: 2px solid black; }
        }
    </style>
</head>
<body>

<div id="triton-receipt-box">
    <div class="company-info">
        <div class="company-details">
            <h1 id="viewCompName">ΦΟΡΤΩΣΗ...</h1>
            <p id="viewCompActivity">-</p>
            <p id="viewCompAddress">-</p>
            <p>ΑΦΜ: <span id="viewCompTaxId">-</span> | ΔΟΥ: <span id="viewCompTaxOffice">-</span></p>
            <p id="viewCompPhone">-</p>
        </div>
        <div class="logo-area" id="logoContainer">
            <img id="viewCompLogo" src="" style="display:none;">
        </div>
    </div>

    <div class="triton-header">
        <h2 id="receiptTypeTitle" style="margin:0; font-size:18px; letter-spacing: 1px;">ΑΠΟΔΕΙΞΗ ΕΙΣΠΡΑΞΗΣ</h2>
        <div id="displayCounter" class="counter-badge">ΕΕ001</div>
    </div>

    <div class="form-container">
        <div class="field-row">
            <div class="field-group">
                <label>Ημερομηνία</label>
                <input type="date" id="inpDate" />
            </div>
            <div class="field-group">
                <label>Τρόπος Πληρωμής</label>
                <select id="inpMethod" onchange="toggleCheque()">
                    <option value="ΜΕΤΡΗΤΑ">ΜΕΤΡΗΤΑ</option>
                    <option value="ΕΠΙΤΑΓΗ">ΕΠΙΤΑΓΗ</option>
                    <option value="ΤΡΑΠΕΖΑ">ΤΡΑΠΕΖΑ (E-Banking)</option>
                </select>
            </div>
        </div>

        <div id="cheque-area">
            <div class="field-row">
                <div class="field-group"><label>Αρ. Επιταγής</label><input type="text" id="chequeNo" placeholder="00000000" /></div>
                <div class="field-group"><label>Ημ. Λήξης</label><input type="date" id="chequeDate" /></div>
            </div>
            <div class="field-group"><label>Εκδότρια Τράπεζα</label><select id="chequeBank"></select></div>
        </div>

        <div class="field-group">
            <label>Πελάτης / Επωνυμία</label>
            <input id="inpCustomer" list="custData" placeholder="Αναζήτηση πελάτη..." onchange="checkBalance()"/>
            <span id="balance-info"></span>
            <datalist id="custData"></datalist>
        </div>

        <div class="field-group">
            <label>Αιτιολογία</label>
            <textarea id="inpNote" rows="1" placeholder="π.χ. Έναντι τιμολογίου">ΕΝΑΝΤΙ ΛΟΓΑΡΙΑΣΜΟΥ</textarea>
        </div>
        
        <div class="amount-panel">
            <label style="font-size: 10px; color: var(--triton-blue); font-weight: 900; display: block; margin-bottom: 5px;">ΠΟΣΟ</label>
            <input type="number" id="inpAmount" class="big-amount-input" value="0.00" step="0.01" />
            <span style="font-size: 32px; font-weight: 900; color: var(--triton-dark);">€</span>
        </div>
        
        <button type="button" class="btn-main no-print" onclick="processAll()">ΚΑΤΑΧΩΡΗΣΗ & ΕΚΤΥΠΩΣΗ (F10)</button>
    </div>
</div>

<script>
    const TRITON_CONFIG = {
        banks: ["ΠΕΙΡΑΙΩΣ", "ΕΘΝΙΚΗ", "ALPHA BANK", "EUROBANK", "ATTICA BANK", "OPTIMA", "VIVA", "REVOLUT"]
    };

    function setupBanks() {
        const sel = document.getElementById('chequeBank');
        if(sel) {
            sel.innerHTML = '<option value="">--- Επιλέξτε Τράπεζα ---</option>';
            TRITON_CONFIG.banks.forEach(b => { sel.innerHTML += `<option value="${b}">${b}</option>`; });
        }
    }

    function toggleCheque() {
        document.getElementById('cheque-area').style.display = (document.getElementById('inpMethod').value === "ΕΠΙΤΑΓΗ") ? "block" : "none";
    }

    function checkBalance() {
        const name = document.getElementById('inpCustomer').value;
        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const info = document.getElementById('balance-info');
        if(db[name]) {
            const bal = db[name].balance || 0;
            info.innerText = "Τρέχον Υπόλοιπο: " + bal.toFixed(2) + "€";
        } else {
            info.innerText = "";
        }
    }

    // 🔱 ΦΟΡΤΩΣΗ ΑΠΟ ΤΟ ΚΑΛΟ "ΚΟΥΤΙ" (bizSettings)
    function loadFromSystem() {
        const s = JSON.parse(localStorage.getItem('bizSettings'));
        if (s) {
            document.getElementById('viewCompName').innerText = s.name || "ΕΠΩΝΥΜΙΑ";
            document.getElementById('viewCompActivity').innerText = s.job || "";
            document.getElementById('viewCompAddress').innerText = (s.address || "") + " " + (s.city || "");
            document.getElementById('viewCompTaxId').innerText = s.afm || "-";
            document.getElementById('viewCompTaxOffice').innerText = s.doy || "-";
            document.getElementById('viewCompPhone').innerText = "Τηλ: " + (s.phone || "-");
            
            const logoImg = document.getElementById('viewCompLogo');
            if (s.logo && s.logo.startsWith('data:image')) {
                logoImg.src = s.logo;
                logoImg.style.display = 'block';
            }
        }
        
        // Φόρτωση Πελατών
        const customers = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const dl = document.getElementById('custData');
        dl.innerHTML = "";
        Object.keys(customers).sort().forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            dl.appendChild(opt);
        });
    }

    let count = parseInt(localStorage.getItem('triton_count_ee')) || 1;

    function init() {
        setupBanks();
        loadFromSystem();
        document.getElementById('inpDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('displayCounter').innerText = "ΕΕ" + count.toString().padStart(3, '0');

        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        if (type) {
            document.getElementById('receiptTypeTitle').innerText = type.toUpperCase();
            document.title = "Triton ERP - " + type;
        }
    }

    function processAll() {
        const customerName = document.getElementById('inpCustomer').value;
        const amount = parseFloat(document.getElementById('inpAmount').value) || 0;
        
        if (!customerName || amount <= 0) { 
            alert("⚠️ Παρακαλώ επιλέξτε Πελάτη και εισάγετε ποσό!"); 
            return; 
        }

        let db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        
        if(db[customerName]) {
            if (db[customerName].balance === undefined) db[customerName].balance = 0;
            if (!db[customerName].history) db[customerName].history = [];

            // Ενημέρωση υπολοίπου
            db[customerName].balance -= amount; 
            db[customerName].history.push({
                date: new Date().toLocaleDateString('el-GR'),
                type: 'ΕΙΣΠΡΑΞΗ ' + document.getElementById('displayCounter').innerText,
                amount: -amount,
                newBalance: db[customerName].balance
            });
            localStorage.setItem('customersDB', JSON.stringify(db));
        }

        window.print();
        
        count++;
        localStorage.setItem('triton_count_ee', count);
        
        setTimeout(() => { 
            location.reload(); 
        }, 500);
    }

    document.addEventListener('keydown', e => { 
        if(e.key === "F10") { e.preventDefault(); processAll(); } 
    });
    
    window.addEventListener('load', init);
  document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const afm = urlParams.get('afm');

    if (afm) {
        const afmInput = document.getElementById('targetAfm'); // Το ID του input στο eispraxi.html
        if (afmInput) {
            afmInput.value = afm;
            // Προαιρετικά: Κάλεσε αυτόματα τη searchMyData() για να φέρει το όνομα
            if (typeof searchMyData === "function") searchMyData();
        }
    }
});
</script>

</body>
</html>
