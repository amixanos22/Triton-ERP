  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Πελατολόγιο & myDATA</title>
    <style>
        /* ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe { display: none !important; }
        body { top: 0 !important; }

        :root { 
            --triton-blue: #0ea5e9; 
            --triton-dark: #0f172a; 
            --triton-bg: #f8fafc; 
            --triton-border: #cbd5e1; 
        }
        
        body { background: #e2e8f0; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: #1e293b; }

        .container { 
            max-width: 1100px; 
            margin: 50px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .search-box { padding: 12px 18px; width: 320px; border: 1px solid var(--triton-border); border-radius: 10px; outline: none; background: #f1f5f9; }
        .btn-add { background: var(--triton-dark); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 800; text-transform: uppercase; }

        /* TABLE */
        .customers-table { width: 100%; border-collapse: collapse; }
        .customers-table th { background: #f1f5f9; color: #64748b; padding: 15px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid var(--triton-border); }
        .customers-table td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .cust-name-cell { font-weight: 700; color: var(--triton-dark); }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 850px; margin: 50px auto; padding: 35px; border-radius: 15px; max-height: 85vh; overflow-y: auto; }
        
        .section-title { font-size: 11px; color: var(--triton-blue); border-bottom: 1px solid #e0f2fe; padding-bottom: 6px; margin: 25px 0 15px 0; font-weight: 900; text-transform: uppercase; }
        
        label { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid var(--triton-border); border-radius: 8px; font-weight: 600; box-sizing: border-box; font-size: 14px; }
        
        /* MYDATA SEARCH BOX */
        .afm-search-group { display: flex; gap: 8px; }
        .btn-lookup { background: var(--triton-blue); color: white; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .btn-lookup:hover { background: var(--triton-dark); }

        .branch-row { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #e2e8f0; display: grid; grid-template-columns: 1fr 40px; gap: 10px; align-items: center; }
        .action-icon { border: none; background: none; cursor: pointer; font-size: 18px; padding: 5px; border-radius: 6px; }
        .action-icon:hover { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <div>
            <h1 style="margin:0; font-size: 32px; color: var(--triton-dark); letter-spacing: -1px;">Πελατολόγιο</h1>
            <p style="margin:5px 0 0; color: #64748b; font-weight: 500;">Διαχείριση στοιχείων myDATA & Υποκαταστημάτων</p>
        </div>
        <div style="display:flex; gap:15px;">
            <input type="text" id="custSearch" class="search-box" placeholder="Αναζήτηση..." onkeyup="filter()">
            <button class="btn-add" onclick="openModal()">+ Νέος Πελάτης</button>
        </div>
    </div>

    <table class="customers-table">
        <thead>
            <tr>
                <th style="width:40%">Επωνυμία</th>
                <th>ΑΦΜ</th>
                <th>Πόλη</th>
                <th>Τηλέφωνο</th>
                <th style="text-align:right">Ενέργειες</th>
            </tr>
        </thead>
        <tbody id="custBody"></tbody>
    </table>
</div>

<div id="custModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; color: var(--triton-dark);">Στοιχεία Συνεργάτη</h2>
        
        <div class="section-title">Αυτόματη Αναζήτηση myDATA</div>
        <div style="display: grid; grid-template-columns: 1.5fr 3fr 1fr; gap: 15px;">
            <div>
                <label>ΑΦΜ</label>
                <div class="afm-search-group">
                    <input type="text" id="mAfm" maxlength="9" placeholder="9 ψηφία">
                    <button class="btn-lookup" onclick="fetchAadeData()" title="Αναζήτηση στην ΑΑΔΕ">🔍</button>
                </div>
            </div>
            <div><label>Επωνυμία / Ονοματεπώνυμο</label><input type="text" id="mName"></div>
            <div><label>ΔΟΥ</label><input type="text" id="mDoy"></div>
        </div>

        <div class="section-title">Διεύθυνση Έδρας</div>
        <div style="display: grid; grid-template-columns: 2fr 1.2fr 0.8fr; gap: 15px;">
            <div><label>Οδός & Αριθμός</label><input type="text" id="mAddr"></div>
            <div><label>Πόλη</label><input type="text" id="mCity"></div>
            <div><label>Τ.Κ.</label><input type="text" id="mZip"></div>
        </div>

        <div class="section-title">Επικοινωνία & CRM</div>
        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px;">
            <div><label>Τηλέφωνο</label><input type="text" id="mPhone"></div>
            <div><label>Ονόματα για Γιορτές</label><input type="text" id="mContacts" placeholder="π.χ. Νίκος, Μαρία"></div>
        </div>

        <div class="section-title">Υποκαταστήματα / Σημεία Παράδοσης</div>
        <div id="branchContainer"></div>
        <button onclick="addBranch()" style="width:100%; padding:10px; border:1px dashed var(--triton-blue); background:#f0f9ff; color:var(--triton-blue); font-weight:800; cursor:pointer; margin-top:10px; border-radius:8px;">+ ΠΡΟΣΘΗΚΗ ΔΙΕΥΘΥΝΣΗΣ ΠΑΡΑΔΟΣΗΣ</button>

        <div style="margin-top:40px; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid #f1f5f9; padding-top:20px;">
            <button onclick="closeModal()" style="padding:14px 30px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; color:#64748b; background:#f1f5f9;">ΑΚΥΡΩΣΗ</button>
            <button onclick="saveCustomer()" style="padding:14px 50px; background:var(--triton-blue); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:800; text-transform:uppercase;">ΑΠΟΘΗΚΕΥΣΗ</button>
        </div>
    </div>
</div>

<script>
    let currentEditName = null;

    // --- ΑΥΤΟΜΑΤΗ ΑΝΑΖΗΤΗΣΗ ΜΕ ΚΩΔΙΚΟΥΣ ΕΝΟΙΚΙΑΣΤΗ ---
    async function fetchAadeData() {
        const afm = document.getElementById('mAfm').value.trim();
        const settings = JSON.parse(localStorage.getItem('triton_settings') || '{}');
        const user = settings.aadeUser; // Username από την αρχική φόρμα
        const token = settings.aadeToken; // Token από την αρχική φόρμα

        if (afm.length !== 9) return alert("⚠️ Πληκτρολογήστε 9 ψηφία ΑΦΜ.");
        if (!user || !token) return alert("⚠️ Λείπουν οι κωδικοί myDATA από τις Ρυθμίσεις!");

        const btn = event.currentTarget;
        btn.innerText = "⏳";

        try {
            // Κλήση API (Χρήση proxy για αποφυγή CORS σε browser περιβάλλον)
            const proxy = "https://api.allorigins.win/get?url=";
            const target = `https://api.aade.gr/public/registry/v1/info?afm=${afm}`;
            
            // Σημείωση: Στην πράξη οι browsers απαιτούν server-side κλήση για την ΑΑΔΕ. 
            // Αν το API δεν απαντά απευθείας, ανοίγουμε το helper window.
            window.open(`https://www.vrisko.gr/search-aade-afm/?afm=${afm}`, 'TritonHelper', 'width=800,height=600');
            
            /* Μόλις το API επιτρέψει την απευθείας σύνδεση, ξεμπλοκάρουμε αυτό:
            const resp = await fetch(proxy + encodeURIComponent(target), {
                headers: { 'x-api-key': token, 'x-user-id': user }
            });
            ... αυτόματη συμπλήρωση ...
            */
            
        } catch (e) {
            console.error(e);
        } finally {
            btn.innerText = "🔍";
        }
    }

    function render() {
        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        const body = document.getElementById('custBody');
        body.innerHTML = '';
        Object.keys(db).sort().forEach(name => {
            const c = db[name];
            body.innerHTML += `
                <tr>
                    <td class="cust-name-cell">${name}</td>
                    <td><code style="background:#f1f5f9; padding:2px 5px; border-radius:4px;">${c.afm || '-'}</code></td>
                    <td>${c.city || '-'}</td>
                    <td>${c.phone || '-'}</td>
                    <td style="text-align:right">
                        <button class="action-icon" onclick="edit('${name.replace(/'/g, "\\'")}')">✏️</button>
                        <button class="action-icon" onclick="remove('${name.replace(/'/g, "\\'")}')">🗑️</button>
                    </td>
                </tr>`;
        });
    }

    function addBranch(val = '') {
        const div = document.createElement('div');
        div.className = 'branch-row';
        div.innerHTML = `<input type="text" class="b-val" value="${val}" placeholder="Διεύθυνση Υποκαταστήματος">
                         <button onclick="this.parentElement.remove()" style="border:none; background:none; color:#ef4444; cursor:pointer; font-size:24px;">&times;</button>`;
        document.getElementById('branchContainer').appendChild(div);
    }

    function saveCustomer() {
        const name = document.getElementById('mName').value.trim();
        if(!name) return alert("Το όνομα είναι υποχρεωτικό!");

        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        if (currentEditName && currentEditName !== name) delete db[currentEditName];

        const branches = [];
        document.querySelectorAll('.b-val').forEach(i => { if(i.value.trim()) branches.push(i.value.trim()); });

        db[name] = {
            name: name,
            afm: document.getElementById('mAfm').value,
            doy: document.getElementById('mDoy').value,
            address: document.getElementById('mAddr').value,
            city: document.getElementById('mCity').value,
            zip: document.getElementById('mZip').value,
            phone: document.getElementById('mPhone').value,
            contacts: document.getElementById('mContacts').value,
            branches: branches
        };

        localStorage.setItem('customersDB', JSON.stringify(db));
        closeModal();
        render();
    }

    function edit(name) {
        const c = JSON.parse(localStorage.getItem('customersDB'))[name];
        currentEditName = name;
        openModal();
        document.getElementById('mName').value = c.name;
        document.getElementById('mAfm').value = c.afm || '';
        document.getElementById('mDoy').value = c.doy || '';
        document.getElementById('mAddr').value = c.address || '';
        document.getElementById('mCity').value = c.city || '';
        document.getElementById('mZip').value = c.zip || '';
        document.getElementById('mPhone').value = c.phone || '';
        document.getElementById('mContacts').value = c.contacts || '';
        document.getElementById('branchContainer').innerHTML = '';
        if(c.branches) c.branches.forEach(b => addBranch(b));
    }

    function remove(name) {
        if(confirm(`⚠️ Διαγραφή πελάτη "${name}";`)) {
            const db = JSON.parse(localStorage.getItem('customersDB'));
            delete db[name];
            localStorage.setItem('customersDB', JSON.stringify(db));
            render();
        }
    }

    function openModal() { document.getElementById('custModal').style.display = 'block'; }
    function closeModal() { 
        document.getElementById('custModal').style.display = 'none'; 
        document.querySelectorAll('.modal-content input').forEach(i => i.value = '');
        document.getElementById('branchContainer').innerHTML = '';
        currentEditName = null;
    }

    function filter() {
        const val = document.getElementById('custSearch').value.toLowerCase();
        document.querySelectorAll('#custBody tr').forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
