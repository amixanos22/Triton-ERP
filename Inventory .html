 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Inventory Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* KILL BLOGGER BAR */
        #navbar-iframe, .navbar, .navbar-themed { display: none !important; height: 0 !important; visibility: hidden !important; }
        body { top: 0 !important; margin: 0; padding: 15px; background: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        :root {
            --triton-blue: #0284c7;
            --triton-dark: #0f172a;
            --triton-light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        /* RESET & BASE */
        body { 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--triton-dark);
            min-height: 100vh;
        }

        /* CONTAINER */
        .app-card {
    max-width: 1100px;
    margin: 50px auto; /* Το 50px δίνει απόσταση από πάνω και κάτω, το auto την κεντράρει δεξιά-αριστερά */
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); /* Έκανα τη σκιά λίγο πιο έντονη για να "αιωρείται" */
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

        /* HEADER SECTION */
        .glass-header {
            background: var(--triton-dark);
            padding: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .stats-row { display: flex; gap: 20px; margin-top: 10px; }
        .stat-badge { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1); }

        /* SEARCH & ACTION BAR */
        .toolbar {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .search-wrapper { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .search-input:focus { border-color: var(--triton-blue); outline: none; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

        /* MODERN BUTTONS */
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--triton-blue); color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .btn-primary:hover { background: #0369a1; }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--triton-dark); }
        .btn-outline:hover { border-color: var(--triton-blue); color: var(--triton-blue); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* TABLE STYLING */
        .table-container { max-height: 550px; overflow-y: auto; padding: 0 10px 10px 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { padding: 15px; text-align: left; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 16px; background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
        
        tr.item-row:hover td { background: #f0f9ff; border-color: #bae6fd; cursor: pointer; }

        .price-tag { font-weight: 800; color: var(--triton-blue); font-size: 16px; }
        .stock-pill { padding: 4px 10px; border-radius: 8px; background: #f1f5f9; font-weight: 700; font-size: 14px; }
        .stock-low { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }

        /* MODAL ANIMATION */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(5px);
            z-index: 1000; 
            animation: fadeIn 0.3s ease;
        }
        .modal-content { 
            background: white; 
            width: 450px; 
            margin: 50px auto; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; box-sizing: border-box; font-size: 16px; 
        }
        .form-group input:focus { border-color: var(--triton-blue); outline: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-card" style="margin-top: 50px; margin-bottom: 50px;">
    <div class="glass-header">
        <div class="header-info">
            <h1>🔱 Triton Inventory Cloud</h1>
            <div class="stats-row">
                <div class="stat-badge" id="stat">0 ΕΙΔΗ</div>
                <div class="stat-badge" style="color: #4ade80;">ΑΞΙΑ: <span id="totalValue">0,00 €</span></div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-success" onclick="exportToExcel()">📊 EXCEL</button>
            <button class="btn btn-danger" onclick="exportToPDF()">📄 PDF</button>
        </div>
    </div>

    <div class="toolbar" style="display: grid; grid-template-columns: 1fr auto auto; gap: 15px;">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="pSearch" class="search-input" placeholder="Αναζήτηση..." onkeyup="render()">
        </div>
        
        <select id="filterType" class="btn btn-outline" onchange="render()" style="padding: 10px;">
            <option value="ALL">🔍 Όλα τα Είδη</option>
            <option value="SALE">🛍️ Προς Πώληση</option>
            <option value="BUY">📦 Μόνο Αγορές</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="showGlobalHistory()">🕒 ΙΣΤΟΡΙΚΟ</button>
            <button class="btn btn-primary" onclick="openModal()">+ ΝΕΟ ΕΙΔΟΣ</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 150px;">ΚΩΔΙΚΟΣ</th>
                    <th>ΠΕΡΙΓΡΑΦΗ</th>
                    <th style="width: 100px;">ΤΥΠΟΣ</th> <th style="width: 120px;">ΤΙΜΗ</th>
                    <th style="width: 100px;">STOCK</th>
                    <th style="width: 50px;"></th>
                </tr>
            </thead>
            <tbody id="pBody"></tbody>
        </table>
    </div>
</div>

<div id="prodModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; margin-bottom: 25px;">Στοιχεία Είδους</h2>
        
        <div class="form-group">
            <label>Τύπος Είδους (Για να μην μπερδεύονται)</label>
            <select id="pType" style="border: 2px solid #0284c7;">
                <option value="SALE">🛍️ Προς Πώληση (Εμπόρευμα)</option>
                <option value="BUY">📦 Μόνο Αγορά (Α' Ύλη / Αναλώσιμο)</option>
                <option value="SERVICE">🛠️ Υπηρεσία</option>
            </select>
        </div>

       <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
    <div class="form-group">
        <label>Εσωτερικός Κωδικός</label>
       <input type="text" id="pInternalCode" 
       style="background: #ffffff; color: #0284c7; font-weight: bold; border: 2px solid #e2e8f0;" 
       placeholder="0001">
    </div>
    <div class="form-group">
        <label>Barcode Κατασκευαστή</label>
        <input type="text" id="pBarcode" placeholder="Σκανάρετε εδώ...">
    </div>
</div>

<div class="form-group">
    <label>Περιγραφή</label>
    <input type="text" id="pDesc" placeholder="π.χ. Λάδια Μηχανής">
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
    <div class="form-group">
        <label>Τιμή Πώλησης (€)</label>
        <input type="number" id="pPrice" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
        <label>Απόθεμα (Stock)</label>
        <input type="number" id="pStock" value="0">
    </div>
</div>
        <div class="form-group">
            <label>ΦΠΑ %</label>
            <select id="pVat">
                <option value="24">24%</option>
                <option value="13">13%</option>
                <option value="0">0%</option>
            </select>
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 15px;" onclick="save()">
            ΑΠΟΘΗΚΕΥΣΗ ΣΤΟ CLOUD
        </button>
        <button class="btn" style="width: 100%; justify-content: center; margin-top: 10px; color: #64748b;" onclick="closeModal()">
            ΑΚΥΡΩΣΗ
        </button>
    </div>
</div>
<script>
// 1. ΡΥΘΜΙΣΕΙΣ ΣΥΝΔΕΣΗΣ
  // 1. ΡΥΘΜΙΣΕΙΣ ΣΥΝΔΕΣΗΣ
const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpenptY3pueXRzZnFseG50dGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0ODE0NzksImV4cCI6MjA4ODA1NzQ3OX0.Dl9PiyYJJ0mYarO11PyXBlH0GN014FfPVh8g_luhKwI';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'products';

// 2. ΕΜΦΑΝΙΣΗ ΛΙΣΤΑΣ (RENDER)
async function render() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) {
        console.warn("Δεν βρέθηκε συνδεδεμένος χρήστης.");
        document.getElementById('pBody').innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Παρακαλώ συνδεθείτε...</td></tr>';
        return;
    }

    const search = document.getElementById('pSearch').value.toLowerCase();
    const filterType = document.getElementById('filterType').value;
    const tbody = document.getElementById('pBody');
    
    let { data: products, error } = await _supabase
        .from(TABLE)
        .select('*')
        .eq('user_id', user.id) 
        .order('name', { ascending: true });

    if (error) {
        console.error("Σφάλμα Render:", error);
        return;
    }
    
    window.allProducts = products;
    tbody.innerHTML = '';
    let count = 0;
    let totalValue = 0;

    products.forEach(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || 
                             (p.code && p.code.includes(search)) || 
                             (p.barcode && p.barcode.includes(search));
        const matchesFilter = filterType === 'ALL' || p.type === filterType;

        if (matchesSearch && matchesFilter) {
            count++;
            const stock = parseFloat(p.stock || 0);
            const price = parseFloat(p.price || 0);
            totalValue += stock * price;
            
            const isLow = stock <= 5;
            const typeEmoji = p.type === 'SALE' ? '🛍️' : (p.type === 'BUY' ? '📦' : '🛠️');

            tbody.innerHTML += `
                <tr class="item-row" onclick="edit('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.code || ''}', '${p.barcode || ''}', ${price}, ${stock}, ${p.vat || 24}, '${p.type}')">
                    <td style="color:#64748b; font-size:13px; font-weight:600;">${p.code || '---'}</td>
                    <td style="font-weight:700;">${p.name}</td>
                    <td style="font-size:12px; color:#64748b;">${typeEmoji}</td>
                    <td class="price-tag">${price.toFixed(2)}€</td>
                    <td><span class="stock-pill ${isLow ? 'stock-low' : ''}">${stock}</span></td>
                    <td><button onclick="event.stopPropagation(); del('${p.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button></td>
                </tr>`;
        }
    });

    document.getElementById('stat').innerText = count + " ΕΙΔΗ";
    document.getElementById('totalValue').innerText = totalValue.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + " €";
}

// 3. ΑΠΟΘΗΚΕΥΣΗ (SAVE) - ΜΙΑ ΦΟΡΑ ΚΑΙ ΣΩΣΤΑ
async function save() {
    const btn = document.querySelector('button[onclick="save()"]');
    try {
        if (btn) { btn.disabled = true; btn.innerText = "⏳ ΑΠΟΘΗΚΕΥΣΗ..."; }

        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) {
            alert("⚠️ Πρέπει να είστε συνδεδεμένος!");
            return;
        }

        const internalCode = document.getElementById('pInternalCode').value;
        const barcode = document.getElementById('pBarcode').value.trim();
        const desc = document.getElementById('pDesc').value.trim().toUpperCase();
        const type = document.getElementById('pType').value;
        const price = parseFloat(document.getElementById('pPrice').value) || 0;
        const stock = parseFloat(document.getElementById('pStock').value) || 0;
        const vat = parseInt(document.getElementById('pVat').value) || 24;
        const currentId = document.getElementById('prodModal').dataset.editId;

        if (!desc) { 
            alert("⚠️ Η περιγραφή είναι υποχρεωτική!"); 
            return; 
        }

        const payload = {
            user_id: user.id,
            name: desc,
            description: desc,
            code: internalCode,
            barcode: barcode,
            type: type,
            price: price,
            stock: stock,
            vat: vat
        };

        if (currentId) payload.id = currentId;

        const { error } = await _supabase.from(TABLE).upsert(payload);
        if (error) throw error;

        closeModal();
        render(); 
    } catch (err) {
        alert("❌ Σφάλμα: " + err.message);
    } finally {
        if (btn) { btn.disabled = false; btn.innerText = "ΑΠΟΘΗΚΕΥΣΗ ΣΤΟ CLOUD"; }
    }
}

// 4. ΔΙΑΧΕΙΡΙΣΗ MODAL
async function openModal() {
    // Καθαρισμός ID επεξεργασίας
    delete document.getElementById('prodModal').dataset.editId;
    
    // Καθαρισμός πεδίων
    document.getElementById('pInternalCode').value = '';
    document.getElementById('pBarcode').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pStock').value = '0';
    document.getElementById('pType').value = 'SALE';
    document.getElementById('pVat').value = '24';

    document.getElementById('prodModal').style.display = 'block';

    try {
        const { data: { user } } = await _supabase.auth.getUser();
        const { count } = await _supabase.from(TABLE).select('*', { count: 'exact', head: true }).eq('user_id', user.id);
        const nextNum = (count || 0) + 1;
        document.getElementById('pInternalCode').value = nextNum.toString().padStart(4, '0');
    } catch (err) { console.error(err); }
}

function edit(id, name, code, barcode, price, stock, vat, type) {
    document.getElementById('prodModal').dataset.editId = id;
    document.getElementById('pInternalCode').value = code || '';
    document.getElementById('pBarcode').value = barcode || '';
    document.getElementById('pDesc').value = name;
    document.getElementById('pPrice').value = price;
    document.getElementById('pStock').value = stock;
    document.getElementById('pVat').value = vat || 24;
    document.getElementById('pType').value = type || 'SALE';
    document.getElementById('prodModal').style.display = 'block';
}

function closeModal() {
    document.getElementById('prodModal').style.display = 'none';
}

async function del(id) {
    if (confirm("Σίγουρα διαγραφή;")) {
        const { error } = await _supabase.from(TABLE).delete().eq('id', id);
        if (error) alert(error.message);
        render();
    }
}

// 5. EXPORTS & INIT
function exportToExcel() {
    let csv = "Κωδικός;Barcode;Περιγραφή;Τύπος;Τιμή;Απόθεμα\n";
    const data = window.allProducts || [];
    data.forEach(p => { csv += `${p.code};${p.barcode || ''};${p.name};${p.type};${p.price}€;${p.stock}\n`; });
    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "inventory_triton.csv";
    link.click();
}

function exportToPDF() { window.print(); }

window.onload = render;
_supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, render).subscribe();
</script>
</body>
</html>
