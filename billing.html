  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Πλήρες Παραστατικό</title>
    <style>
        #navbar-iframe, .navbar, .navbar-spaced, .sidebar, .top-bar { display: none !important; }
        body { top: 0 !important; background: #f1f5f9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        #invoice-container { width: 95%; max-width: 1000px; margin: auto; background: white; padding: 40px; box-shadow: 0 0 20px rgba(0,0,0,0.1); min-height: 1000px; }
        :root { --triton-blue: #0ea5e9; --triton-dark: #1e293b; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 20px; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #f8fafc; padding: 15px; border-left: 5px solid var(--triton-blue); border-radius: 4px; }
        input, select { width: 100%; border: none; border-bottom: 1px solid #cbd5e1; background: transparent; padding: 5px; margin-bottom: 8px; outline: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; padding: 10px; text-align: left; border-bottom: 2px solid #000; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .total-section { margin-top: 30px; text-align: right; }
        .grand-total { font-size: 24px; font-weight: bold; color: var(--triton-blue); }
        .profit-badge { background: #f0fdf4; border: 1px solid #22c55e; padding: 10px; border-radius: 8px; display: inline-block; margin-bottom: 10px; }
        @media print { .no-print { display: none !important; } #invoice-container { box-shadow: none; width: 100%; padding: 0; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="invoice-container">
    <div class="header">
        <div class="logo"><h1 style="color:var(--triton-blue); margin:0;">🔱 TRITON</h1></div>
        <div id="compInfo" style="text-align: right;">
            <h2 id="dispCompName" style="margin:0; color:var(--triton-dark);">ΦΟΡΤΩΣΗ...</h2>
            <p id="dispAddress" style="margin:0; font-size:13px; color:#64748b;"></p>
            <h3 id="docTitle" style="color:var(--triton-blue); margin:10px 0 0 0;">ΤΙΜΟΛΟΓΙΟ ΠΩΛΗΣΗΣ</h3>
            <p id="currentDate" style="margin:0; font-weight:bold;">--/--/----</p>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <label style="font-size:10px; font-weight:bold;">ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ</label>
                <button onclick="alert('Σύνδεση με myDATA...')" class="no-print" style="cursor:pointer; background:var(--triton-blue); color:white; border:none; border-radius:3px; padding:2px 5px; font-size:10px;">🔍 myDATA</button>
            </div>
            <input id="cName" list="custList" placeholder="Επωνυμία" onchange="autoFillCustomer(this.value)"> 
            <input id="cAfm" placeholder="ΑΦΜ"> 
            <input id="cAddr" placeholder="Διεύθυνση"> 
            <input id="cCity" placeholder="Πόλη"> 
        </div> 
        <div class="card" style="border-left-color: #64748b;"> 
            <label style="font-size:10px; font-weight:bold;">ΔΙΑΚΙΝΗΣΗ / ΠΑΡΑΔΟΣΗ</label> 
            <input id="purpose" value="ΠΩΛΗΣΗ"> 
            <input id="car" placeholder="Αρ. Αυτοκινήτου"> 
            <input id="delivery" placeholder="Τόπος Παράδοσης"> 
        </div> 
    </div>

    <table id="itemsTable">
        <thead>
            <tr>
                <th style="width:45%">ΠΕΡΙΓΡΑΦΗ</th>
                <th style="width:10%">ΠΟΣ.</th>
                <th style="width:15%">ΤΙΜΗ</th>
                <th style="width:10%">ΦΠΑ %</th>
                <th style="width:20%; text-align:right;">ΣΥΝΟΛΟ</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <div class="total-section">
        <div class="no-print profit-badge">
            <div style="color: #166534; font-size: 10px; font-weight: bold;">ΕΚΤΙΜΩΜΕΝΟ ΚΕΡΔΟΣ</div>
            <div id="profitVal" style="font-size: 18px; font-weight: bold; color: #15803d;">0.00 €</div>
        </div>
        <p>ΚΑΘΑΡΗ ΑΞΙΑ: <span id="pNetVal">0.00 €</span></p>
        <p>ΦΠΑ: <span id="pTaxVal">0.00 €</span></p>
        <p class="grand-total">ΣΥΝΟΛΟ: <span id="pGrandVal">0.00 €</span></p>
        
        <div class="no-print" style="margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; text-align: left;">
            <label style="font-size: 11px; font-weight: bold;">ΑΠΟΣΤΟΛΗ ΣΕ EMAIL:</label>
            <select id="emailSelect"><option value="">Επιλέξτε email...</option></select>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="addRow()" style="flex:1; padding:10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">+ ΓΡΑΜΜΗ</button>
                <button onclick="window.print()" style="flex:1; padding:10px; background:var(--triton-blue); color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">ΕΚΤΥΠΩΣΗ</button>
            </div>
        </div>
    </div>
</div>

<datalist id="custList"></datalist>
<datalist id="prodList"></datalist>

<script>
const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_8lbtn4itPf_AD8UYz_rPMg_VvBBqY4G';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allProducts = [];

async function loadProfile(userId) {
    const { data: profile } = await _supabase.from('profiles').select('*').eq('id', userId).maybeSingle();
    if (profile) {
        document.getElementById('dispCompName').innerText = profile.company_name || profile.name || "ΕΠΩΝΥΜΙΑ";
        const afm = profile.tax_id || profile.afm || '';
        document.getElementById('dispAddress').innerHTML = `${profile.address || ''}, ${profile.city || ''}<br>ΑΦΜ: ${afm} | Τηλ: ${profile.phone || ''}`;
    }
}

function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" list="prodList" onchange="autoFillProduct(this)"></td>
        <td><input type="number" class="qty" value="1" oninput="recalc()"></td>
        <td><input type="number" class="price" value="0" oninput="recalc()"></td>
        <td><input type="number" class="tax" value="24" oninput="recalc()"></td>
        <td class="row-total" style="text-align:right; font-weight:bold;">0.00 €</td>
        <input type="hidden" class="cost-price" value="0">
    `;
    document.getElementById('rows').appendChild(tr);
}

function recalc() {
    let net = 0, tax = 0, profit = 0;
    document.querySelectorAll('#rows tr').forEach(row => {
        const q = parseFloat(row.querySelector('.qty').value) || 0;
        const p = parseFloat(row.querySelector('.price').value) || 0;
        const t = parseFloat(row.querySelector('.tax').value) || 0;
        const cost = parseFloat(row.querySelector('.cost-price').value) || 0;

        const lineNet = q * p;
        const lineTax = lineNet * (t/100);
        row.querySelector('.row-total').innerText = (lineNet + lineTax).toFixed(2) + " €";
        
        net += lineNet; tax += lineTax;
        profit += (q * p) - (q * cost);
    });
    document.getElementById('pNetVal').innerText = net.toFixed(2) + " €";
    document.getElementById('pTaxVal').innerText = tax.toFixed(2) + " €";
    document.getElementById('pGrandVal').innerText = (net + tax).toFixed(2) + " €";
    document.getElementById('profitVal').innerText = profit.toFixed(2) + " €";
}

async function autoFillProduct(input) {
    const p = allProducts.find(item => item.name === input.value);
    if (p) {
        const row = input.closest('tr');
        row.querySelector('.price').value = p.unit_price || 0;
        row.querySelector('.cost-price').value = p.cost_price || 0;
        recalc();
    }
}

async function autoFillCustomer(name) {
    const { data: c } = await _supabase.from('customers').select('*').eq('user_id', currentUser.id).eq('name', name).maybeSingle();
    if (c) {
        document.getElementById('cAfm').value = c.afm || '';
        document.getElementById('cAddr').value = c.address || '';
        document.getElementById('cCity').value = c.city || '';
        if(c.email) {
            const opt = document.createElement('option');
            opt.value = c.email; opt.innerText = c.email;
            document.getElementById('emailSelect').appendChild(opt);
            document.getElementById('emailSelect').value = c.email;
        }
    }
}

window.onload = async () => {
    let { data: { user } } = await _supabase.auth.getUser();
    if (!user) user = { id: new URLSearchParams(window.location.search).get('uid') };

    if (user) {
        currentUser = user;
        await loadProfile(user.id);
        const { data: ps } = await _supabase.from('products').select('*').eq('user_id', user.id);
        allProducts = ps || [];
        allProducts.forEach(p => { let o = document.createElement('option'); o.value = p.name; document.getElementById('prodList').appendChild(o); });
        
        const { data: cs } = await _supabase.from('customers').select('name').eq('user_id', user.id);
        if(cs) cs.forEach(c => { let o = document.createElement('option'); o.value = c.name; document.getElementById('custList').appendChild(o); });
        addRow();
    }
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('el-GR');
};
</script>
</body>
</html>
