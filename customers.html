  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Πελατολόγιο & myDATA</title>
    <style>
        #navbar-iframe { display: none !important; }
        body { top: 0 !important; }
        :root { --triton-blue: #0ea5e9; --triton-dark: #0f172a; --triton-bg: #f8fafc; --triton-border: #cbd5e1; }
        body { background: #e2e8f0; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: #1e293b; }
        .container { max-width: 1100px; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .search-box { padding: 12px 18px; width: 320px; border: 1px solid var(--triton-border); border-radius: 10px; outline: none; background: #f1f5f9; }
        .btn-add { background: var(--triton-dark); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 800; text-transform: uppercase; }
        .btn-settings { background: #64748b; color: white; border: none; padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        
        .customers-table { width: 100%; border-collapse: collapse; }
        .customers-table th { background: #f1f5f9; color: #64748b; padding: 15px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid var(--triton-border); }
        .customers-table td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 900px; margin: 30px auto; padding: 35px; border-radius: 15px; max-height: 90vh; overflow-y: auto; position: relative; }
        .section-title { font-size: 11px; color: var(--triton-blue); border-bottom: 1px solid #e0f2fe; padding-bottom: 6px; margin: 25px 0 15px 0; font-weight: 900; text-transform: uppercase; }
        label { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        input { width: 100%; padding: 10px; border: 1px solid var(--triton-border); border-radius: 8px; font-weight: 600; box-sizing: border-box; font-size: 13px; }
        
        /* Branch UI */
        .branch-card { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; position: relative; }
        .branch-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 10px; }
        .branch-footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .btn-delete-branch { background:#ef4444; color:white; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight: bold; }
        
        .status-pill { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: #f1f5f9; color: #64748b; }
        .status-sent { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <div>
            <h1 style="margin:0; font-size: 32px; color: var(--triton-dark); letter-spacing: -1px;">Triton ERP</h1>
            <p style="margin:5px 0 0; color: #64748b; font-weight: 500;">myDATA Ready | Διαχείριση ELATI PRODUCTS</p>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-settings" onclick="openSettings()" title="Ρυθμίσεις myDATA">⚙️</button>
            <input type="text" id="custSearch" class="search-box" placeholder="Αναζήτηση..." onkeyup="filter()">
            <button class="btn-add" onclick="openModal()">+ Νέος Πελάτης</button>
        </div>
    </div>

    <table class="customers-table">
        <thead>
            <tr>
                <th style="width:30%">Επωνυμία</th>
                <th>ΑΦΜ</th>
                <th>myDATA MARK</th>
                <th style="text-align:right">Ενέργειες</th>
            </tr>
        </thead>
        <tbody id="custBody"></tbody>
    </table>
</div>

<div id="custModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Στοιχεία Συνεργάτη</h2>
        
        <div class="section-title">Κεντρικό Κατάστημα (ΑΑΔΕ)</div>
        <div style="display: grid; grid-template-columns: 1.5fr 3fr 1fr; gap: 15px;">
            <div>
                <label>ΑΦΜ</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="mAfm" maxlength="9">
                    <button onclick="searchAade(this)" style="background:var(--triton-blue); color:white; border:none; border-radius:8px; padding:0 15px; cursor:pointer;">🔍</button>
                </div>
            </div>
            <div><label>Επωνυμία</label><input type="text" id="mName"></div>
            <div><label>ΔΟΥ</label><input type="text" id="mDoy"></div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-top: 15px;">
            <div><label>Διεύθυνση</label><input type="text" id="mAddr"></div>
            <div><label>Πόλη</label><input type="text" id="mCity"></div>
            <div><label>Τ.Κ.</label><input type="text" id="mTk"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; margin-top: 15px;">
            <div><label>Email</label><input type="email" id="mEmail"></div>
            <div><label>Τηλέφωνο</label><input type="text" id="mPhone"></div>
        </div>

        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>🏢 Υποκαταστήματα</span>
            <button onclick="addBranch()" style="background: var(--triton-dark); color:white; border:none; border-radius:4px; padding:4px 12px; cursor:pointer; font-size:11px; font-weight:bold;">+ ΠΡΟΣΘΗΚΗ ΥΠΟΚΑΤΑΣΤΗΜΑΤΟΣ</button>
        </div>
        
        <div id="branchesWrapper"></div>

        <div style="margin-top:30px; display:flex; justify-content:flex-end; gap:12px;">
            <button onclick="closeModal()" style="padding:12px 20px; border:none; background:#f1f5f9; cursor:pointer; border-radius:10px; font-weight:bold;">ΑΚΥΡΩΣΗ</button>
            <button onclick="saveCustomer()" style="padding:12px 40px; background:var(--triton-blue); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold;">ΑΠΟΘΗΚΕΥΣΗ</button>
        </div>
    </div>
</div>

 
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // --- ΡΥΘΜΙΣΕΙΣ SUPABASE ---
   const SUPABASE_URL = 'https://pizzmcznytsfqlxnttbv.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpenptY3pueXRzZnFseG50dGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0ODE0NzksImV4cCI6MjA4ODA1NzQ3OX0.Dl9PiyYJJ0mYarO11PyXBlH0GN014FfPVh8g_luhKwI';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'products';

    let currentEditId = null; 

    // --- BRANCHES LOGIC ---
    function addBranch(data = {}) {
        const wrapper = document.getElementById('branchesWrapper');
        const div = document.createElement('div');
        div.className = 'branch-card';
        div.innerHTML = `
            <div class="branch-grid">
                <div><label>Διεύθυνση</label><input type="text" class="b-addr" value="${data.addr || ''}"></div>
                <div><label>Πόλη</label><input type="text" class="b-city" value="${data.city || ''}"></div>
                <div><label>Τηλέφωνο</label><input type="text" class="b-phone" value="${data.phone || ''}"></div>
            </div>
            <div class="branch-footer">
                <div><label>Email</label><input type="email" class="b-email" value="${data.email || ''}"></div>
                <div><label>Διευθυντής</label><input type="text" class="b-manager" value="${data.manager || ''}"></div>
                <div style="display:flex; align-items:flex-end; justify-content:flex-end;">
                    <button class="btn-delete-branch" onclick="this.closest('.branch-card').remove()">Διαγραφή</button>
                </div>
            </div>
        `;
        wrapper.appendChild(div);
    }

    // --- MODAL CONTROLS ---
    function openModal() {
        currentEditId = null; // Μηδενισμός του ID για νέο πελάτη
        document.querySelectorAll('#custModal input').forEach(i => i.value = '');
        document.getElementById('branchesWrapper').innerHTML = '';
        document.getElementById('modalTitle').innerText = "Νέος Συνεργάτης";
        document.getElementById('custModal').style.display = 'block';
    }

    function closeModal() { 
        document.getElementById('custModal').style.display = 'none'; 
    }

    // --- DATABASE & RENDER ---
    async function render() {
        try {
            const { data: customers, error } = await _supabase
                .from(TABLE_CUSTOMERS)
                .select('*')
                .order('name', { ascending: true });

            if (error) throw error;

            const body = document.getElementById('custBody');
            body.innerHTML = '';
            
            customers.forEach(c => {
                body.innerHTML += `
                    <tr>
                        <td style="font-weight:bold">${c.name}</td>
                        <td><code>${c.afm || '-'}</code></td>
                        <td>${c.mark ? `<span class="status-pill status-sent">MARK: ${c.mark}</span>` : '<span class="status-pill">Εκκρεμεί</span>'}</td>
                        <td style="text-align:right">
                            <button class="btn-settings" style="background:#8b5cf6; padding:8px 12px;" onclick="window.location.href='invoice.html?customer_id=${c.id}'">📑</button>
                            <button class="btn-settings" style="background:#0ea5e9; padding:8px 12px;" onclick="edit('${c.id}')">✏️</button>
                            <button class="btn-settings" style="background:#ef4444; padding:8px 12px;" onclick="remove('${c.id}')">🗑️</button>
                        </td>
                    </tr>`;
            });
        } catch (err) {
            console.error("Render Error:", err.message);
        }
    }

    async function saveCustomer() {
        const name = document.getElementById('mName').value.trim();
        const afm = document.getElementById('mAfm').value.trim();
        
        if(!name) return alert("⚠️ Το όνομα είναι υποχρεωτικό!");

        const branches = [];
        document.querySelectorAll('.branch-card').forEach(card => {
            branches.push({
                addr: card.querySelector('.b-addr').value,
                city: card.querySelector('.b-city').value,
                phone: card.querySelector('.b-phone').value,
                email: card.querySelector('.b-email').value,
                manager: card.querySelector('.b-manager').value
            });
        });

        const payload = {
            name,
            afm,
            doy: document.getElementById('mDoy').value,
            address: document.getElementById('mAddr').value,
            city: document.getElementById('mCity').value,
            zip: document.getElementById('mTk').value,
            email: document.getElementById('mEmail').value,
            phone: document.getElementById('mPhone').value,
            branches: branches
        };

        if (currentEditId) payload.id = currentEditId;

        const { error } = await _supabase.from(TABLE_CUSTOMERS).upsert(payload);
        
        if (error) {
            alert("❌ Σφάλμα: " + error.message);
        } else {
            closeModal();
            render();
        }
    }

    async function edit(id) {
        const { data: c, error } = await _supabase.from(TABLE_CUSTOMERS).select('*').eq('id', id).single();
        if (error) return alert("Σφάλμα φόρτωσης");

        currentEditId = id;
        document.getElementById('mName').value = c.name || '';
        document.getElementById('mAfm').value = c.afm || '';
        document.getElementById('mDoy').value = c.doy || '';
        document.getElementById('mAddr').value = c.address || '';
        document.getElementById('mCity').value = c.city || '';
        document.getElementById('mTk').value = c.zip || '';
        document.getElementById('mEmail').value = c.email || '';
        document.getElementById('mPhone').value = c.phone || '';
        
        document.getElementById('branchesWrapper').innerHTML = '';
        if(c.branches) c.branches.forEach(b => addBranch(b));
        
        document.getElementById('modalTitle').innerText = "Επεξεργασία: " + c.name;
        document.getElementById('custModal').style.display = 'block';
    }

    async function remove(id) {
        if(confirm("Διαγραφή πελάτη;")) {
            await _supabase.from(TABLE_CUSTOMERS).delete().eq('id', id);
            render();
        }
    }

    function filter() {
        const val = document.getElementById('custSearch').value.toLowerCase();
        document.querySelectorAll('#custBody tr').forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    document.addEventListener('DOMContentLoaded', render);
</script>
 
</body>
</html>
