 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Οικονομικό Πλάνο</title>
    <style>
        /* 1. ΕΞΑΦΑΝΙΣΗ ΜΠΑΡΑΣ BLOGGER */
        #navbar-iframe, .navbar, .header-outer, .footer-outer, .base-cms-navbar { 
            display: none !important; visibility: hidden !important; height: 0 !important; 
        }
        :root { --triton-cyan: #06b6d4; --triton-dark: #0f172a; --triton-bg: #f1f5f9; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--triton-bg); margin: 0; padding: 20px; top: 0 !important; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--triton-cyan); padding-bottom: 15px; margin-bottom: 20px; }
        
        /* Φίλτρα */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 10px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 8px 15px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .filter-btn.active { background: var(--triton-cyan); color: white; border-color: var(--triton-cyan); }

        /* Stats Boxes */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { padding: 15px; border-radius: 12px; color: white; text-align: center; }
        .income-card { background: #10b981; } 
        .expense-card { background: #ef4444; } 
        .balance-card { background: var(--triton-dark); border-bottom: 5px solid var(--triton-cyan); }
        .card label { font-size: 11px; text-transform: uppercase; opacity: 0.9; display: block; }
        .card .value { font-size: 22px; font-weight: 800; margin-top: 5px; }

        /* Φόρμα */
        .expense-form { background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
        .btn-add { background: var(--triton-dark); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 12px; text-align: left; color: #64748b; font-size: 12px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .type-expense { color: #ef4444; font-weight: bold; }
        .type-income { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size:22px;">📈 Οικονομικό Πλάνο <span style="color:var(--triton-cyan)">Triton</span></h1>
        <div style="font-size: 12px; color: #64748b;" id="currentPeriodLabel">Περίοδος: Όλα</div>
    </div>

   <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all', this)">Όλα</button>
        <button class="filter-btn" onclick="setFilter('today', this)">Σήμερα</button>
        <button class="filter-btn" onclick="setFilter('week', this)">Εβδομάδα</button>
        <button class="filter-btn" onclick="setFilter('month', this)">Μήνας</button>
        <button class="filter-btn" onclick="setFilter('year', this)">Έτος</button>
        
        <div style="margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <label style="font-size: 12px; font-weight: bold;">Από:</label>
            <input type="date" id="customFrom" onchange="loadFinance()" style="padding: 5px; border-radius: 4px; border: 1px solid #cbd5e1;">
            
            <label style="font-size: 12px; font-weight: bold;">Έως:</label>
            <input type="date" id="customTo" onchange="loadFinance()" style="padding: 5px; border-radius: 4px; border: 1px solid #cbd5e1;">

            <label style="font-size: 12px; font-weight: bold; margin-left: 10px;">📊 Κατηγορία:</label>
            <select id="filterCat" onchange="loadFinance()" style="padding: 6px; border-radius: 4px; border: 1px solid #06b6d4; background: white; cursor: pointer;">
                <option value="all">-- Όλες --</option>
                <option value="Λειτουργικά">Λειτουργικά (Ενοίκιο, Λογιστής κλπ)</option>
                <option value="Μισθοδοσία">Μισθοδοσία</option>
                <option value="Αγορές">Αγορές (Προμηθευτές)</option>
                <option value="Έσοδο">Μόνο Έσοδα (Πωλήσεις)</option>
                <option value="Άλλο">Άλλα Έξοδα</option>
            </select>

            <button onclick="window.print()" style="background: #0f172a; color: #06b6d4; border: 1px solid #06b6d4; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;">
                🖨️ Εκτύπωση
            </button>
        </div>
    </div>
    <div class="summary-grid">
        <div class="card income-card"><label>Έσοδα</label><div id="totalIn" class="value">0.00 €</div></div>
        <div class="card expense-card"><label>Έξοδα</label><div id="totalOut" class="value">0.00 €</div></div>
        <div class="card balance-card"><label>Υπόλοιπο</label><div id="netBalance" class="value">0.00 €</div></div>
    </div>

    <h3 style="font-size:15px; margin-bottom:10px;">➕ Καταχώρηση Εξόδου</h3>
    <div class="expense-form">
        <div class="input-group"><label>Ημερομηνία</label><input type="date" id="expDate"></div>
        <div class="input-group"><label>Περιγραφή</label><input type="text" id="expDesc" placeholder="π.χ. ΔΕΗ"></div>
        <div class="input-group"><label>Ποσό (€)</label><input type="number" id="expAmount" step="0.01"></div>
        <div class="input-group"><label>Κατηγορία</label>
            <select id="expCat">
                <option value="Λειτουργικά">Λειτουργικά</option>
                <option value="Μισθοδοσία">Μισθοδοσία</option>
                <option value="Αγορές">Αγορές</option>
                <option value="Άλλο">Άλλο</option>
            </select>
        </div>
        <button class="btn-add" onclick="addManualExpense()">Καταχώρηση</button>
    </div>

    <table>
        <thead>
            <tr><th>Ημ/νία</th><th>Περιγραφή</th><th>Κατηγορία</th><th>Ποσό</th></tr>
        </thead>
        <tbody id="financeTableBody"></tbody>
    </table>
</div>

<script>
   let currentFilter = 'all';

function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('currentPeriodLabel').innerText = "Περίοδος: " + btn.innerText;
    loadFinance();
}

function loadFinance() {
    const sales = JSON.parse(localStorage.getItem('triton_sales_history') || '[]');
    const manualExpenses = JSON.parse(localStorage.getItem('triton_manual_expenses') || '[]');
    const fromDate = document.getElementById('customFrom').value;
    const toDate = document.getElementById('customTo').value;
    
    let income = 0, expenses = 0;
    let categoryTotals = {}; // Εδώ γίνεται η μαγεία για τον "Λογιστή/Ενοίκιο"
    let allTransactions = [];
    const now = new Date();

    sales.forEach(s => allTransactions.push({ date: new Date(s.date), desc: `Πώληση: ${s.customer || 'Λιανική'}`, cat: 'Έσοδο', amt: s.totalNet, type: 'in' }));
    manualExpenses.forEach(e => allTransactions.push({ date: new Date(e.date), desc: e.desc, cat: e.cat, amt: e.amt, type: 'out' }));

    const filtered = allTransactions.filter(t => {
        const tDate = t.date;
        if (fromDate && toDate) {
            const dTo = new Date(toDate); dTo.setHours(23,59,59);
            return tDate >= new Date(fromDate) && tDate <= dTo;
        }
        if (currentFilter === 'today') return tDate.toDateString() === now.toDateString();
        if (currentFilter === 'week') {
            const oneWeekAgo = new Date(); oneWeekAgo.setDate(now.getDate() - 7);
            return tDate >= oneWeekAgo;
        }
        if (currentFilter === 'month') return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
        if (currentFilter === 'year') return tDate.getFullYear() === now.getFullYear();
        return true;
    });

    filtered.sort((a, b) => b.date - a.date);
    const tableBody = document.getElementById('financeTableBody');
    tableBody.innerHTML = '';
    
    filtered.forEach(t => {
        if(t.type === 'in') {
            income += t.amt;
        } else {
            expenses += t.amt;
            // Πρόσθεση στο σύνολο της κατηγορίας (π.χ. Λειτουργικά)
            categoryTotals[t.cat] = (categoryTotals[t.cat] || 0) + t.amt;
        }

        tableBody.innerHTML += `
            <tr>
                <td>${t.date.toLocaleDateString('el-GR')}</td>
                <td>${t.desc}</td>
                <td>${t.cat}</td>
                <td class="${t.type === 'in' ? 'type-income' : 'type-expense'}">
                    ${t.type === 'in' ? '+' : '-'}${t.amt.toLocaleString('el-GR', {minimumFractionDigits:2})} €
                </td>
            </tr>`;
    });

    document.getElementById('totalIn').innerText = income.toLocaleString('el-GR', {minimumFractionDigits:2}) + " €";
    document.getElementById('totalOut').innerText = expenses.toLocaleString('el-GR', {minimumFractionDigits:2}) + " €";
    document.getElementById('netBalance').innerText = (income - expenses).toLocaleString('el-GR', {minimumFractionDigits:2}) + " €";

    // Εμφάνιση της Ανάλυσης ανά Κατηγορία
    showCategorySummary(categoryTotals);
}

function showCategorySummary(totals) {
    let summaryHTML = `
        <div style="margin-top:20px; padding:15px; background:#f8fafc; border-radius:12px; border:1px solid #06b6d4;">
            <h4 style="margin:0 0 10px 0; font-size:14px; color:#0f172a;">📊 Σύνολα ανά Κατηγορία</h4>`;
    
    let hasExpenses = false;
    for (let cat in totals) {
        hasExpenses = true;
        summaryHTML += `
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; border-bottom:1px dashed #cbd5e1; padding-bottom:3px;">
                <span>${cat}:</span>
                <span style="font-weight:bold; color:#ef4444;">${totals[cat].toLocaleString('el-GR', {minimumFractionDigits:2})} €</span>
            </div>`;
    }

    if(!hasExpenses) summaryHTML += '<div style="font-size:12px; color:gray;">Δεν υπάρχουν έξοδα για αυτή την περίοδο.</div>';
    summaryHTML += '</div>';

    let summaryDiv = document.getElementById('categorySummary');
    if(!summaryDiv) {
        summaryDiv = document.createElement('div');
        summaryDiv.id = 'categorySummary';
        document.querySelector('.summary-grid').after(summaryDiv);
    }
    summaryDiv.innerHTML = summaryHTML;
}

function addManualExpense() {
    const date = document.getElementById('expDate').value;
    const desc = document.getElementById('expDesc').value;
    const amt = parseFloat(document.getElementById('expAmount').value);
    const cat = document.getElementById('expCat').value;

    if(!date || !desc || !amt) return alert("⚠️ Συμπληρώστε Ημερομηνία, Περιγραφή και Ποσό!");

    const expenses = JSON.parse(localStorage.getItem('triton_manual_expenses') || '[]');
    expenses.push({ date, desc, amt, cat });
    localStorage.setItem('triton_manual_expenses', JSON.stringify(expenses));
    
    document.getElementById('expDesc').value = '';
    document.getElementById('expAmount').value = '';
    loadFinance();
}

window.onload = () => {
    document.getElementById('expDate').valueAsDate = new Date();
    loadFinance();
};
</script>
</body>
</html>
