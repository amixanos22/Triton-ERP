 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Δελτίο Αποστολής (Auto-Sync)</title>
    <style>
        #navbar-iframe, .navbar, .header-outer, .footer-outer { display: none !important; }

        :root { 
            --triton-blue: #0ea5e9; 
            --triton-bg: #f8fafc; 
            --triton-border: #cbd5e1; 
            --triton-dark: #0f172a; 
        }

        body { background: #e2e8f0; margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif; }

        #triton-app { 
            width: 900px; 
            margin: 60px auto 40px auto; 
            background: white; 
            padding: 50px; 
            border-radius: 4px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            min-height: 1100px;
            position: relative;
            box-sizing: border-box;
        }

        input, select, textarea { border: none; outline: none; background: transparent; font-family: inherit; width: 100%; }
        
        .header-top-grid { display: grid; grid-template-columns: 180px 1fr 140px; gap: 30px; align-items: flex-start; border-bottom: 2px solid var(--triton-dark); padding-bottom: 25px; margin-bottom: 30px; }
        .company-info-area h1 { margin: 0; color: var(--triton-blue); font-size: 26px; text-transform: uppercase; font-weight: 900; letter-spacing: -0.5px; }
        .company-info-area p { margin: 3px 0; font-size: 13px; font-weight: 600; color: #475569; }
        
        .logo-area { max-width: 150px; max-height: 100px; }
        .logo-area img { max-width: 100%; max-height: 100px; object-fit: contain; }
        
        /* QR Code Styling */
        .qr-placeholder { width: 110px; height: 110px; border: 2px solid var(--triton-dark); margin: 0 auto; display: flex; align-items: center; justify-content: center; position: relative; background: #fff; text-align: center; }
        .qr-placeholder span { font-size: 8px; color: var(--triton-dark); font-weight: 800; line-height: 1.2; }

        .triton-info-bar { display: flex; background: var(--triton-bg); border: 1px solid var(--triton-border); margin-bottom: 30px; border-radius: 6px; overflow: hidden; }
        .bar-cell { flex: 1; padding: 12px 18px; border-right: 1px solid var(--triton-border); }
        .bar-cell:last-child { border-right: none; }
        .bar-cell label { display: block; font-size: 10px; color: var(--triton-blue); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .bar-cell span, .bar-cell input { font-size: 15px; font-weight: 700; color: var(--triton-dark); }

        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 35px; }
        .info-card { background: #fdfdfd; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; border-top: 4px solid var(--triton-blue); }
        .info-card label { display: block; font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .info-card input { padding: 6px 0; font-size: 14px; margin-bottom: 8px; font-weight: 700; color: var(--triton-dark); }

        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        th { background: #f1f5f9; padding: 12px 10px; font-size: 11px; border-top: 2px solid black; border-bottom: 2px solid black; text-transform: uppercase; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        
        .btn-print { float: right; padding: 18px 45px; background: var(--triton-dark); color: white; border-radius: 10px; font-weight: 800; cursor: pointer; border: none; margin-top: 30px; font-size: 15px; }

        @media print { 
            .no-print, .btn-print { display: none !important; } 
            body { background: white; padding: 0; }
            #triton-app { margin: 0; box-shadow: none; width: 100%; padding: 0; } 
        }
    </style>
</head>
<body>

<div id="triton-app">
    <div class="header-top-grid">
        <div id="idxLogo" class="logo-area">
            <img id="viewCompLogo" src="" style="display:none;">
        </div>
        <div class="company-info-area">
            <h1 id="idxCompName">ΦΟΡΤΩΣΗ ΣΤΟΙΧΕΙΩΝ...</h1>
            <p id="idxActivity">-</p>
            <p id="idxAddress">-</p>
            <p>ΑΦΜ: <span id="idxTaxId" style="margin-right:25px;">-</span> ΔΟΥ: <span id="idxTaxOffice">-</span></p>
        </div>
        
        <div id="qrArea">
            <div class="qr-placeholder">
                <span>myDATA<br>QR CODE<br>PENDING</span>
            </div>
            <div style="font-size: 9px; font-weight: 900; text-align: center; margin-top: 5px;">MARK: 123456789</div>
        </div>
    </div>

    <div class="triton-info-bar">
        <div class="bar-cell"><label>Ημερομηνία</label><span id="dtDisplay">--/--/----</span></div>
        <div class="bar-cell"><label>Αρ. Παραστατικού</label><input type="text" id="docNum" value="ΔΔ001"/></div>
        <div class="bar-cell"><label>Σκοπός</label><input value="ΠΩΛΗΣΗ"/></div>
        <div class="bar-cell"><label>Ώρα</label><input type="text" id="timeDisplay"/></div>
    </div>

    <div class="grid-info">
        <div class="info-card">
            <label>Παραλήπτης</label>
            <input id="cName" list="custData" placeholder="Αναζήτηση..." onchange="autoFillCustomer()"/>
            <input id="cTax" placeholder="ΑΦΜ" readonly/>
            <input id="cAddr" placeholder="Διεύθυνση" readonly/>
            <datalist id="custData"></datalist>
        </div>
        <div class="info-card">
            <label>Μεταφορά</label>
            <input id="deliveryPlace" placeholder="Τόπος Παράδοσης"/>
            <input placeholder="Μέσο: Ι.Χ. ΦΟΡΤΗΓΟ" value="Ι.Χ. ΦΟΡΤΗΓΟ"/>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:70%">ΠΕΡΙΓΡΑΦΗ ΕΙΔΟΥΣ</th>
                <th style="width:10%; text-align:center;">Μ.Μ.</th>
                <th style="width:20%; text-align:center;">ΠΟΣΟΤΗΤΑ</th>
            </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
    </table>

    <button class="btn-print no-print" onclick="processDelivery()">ΚΑΤΑΧΩΡΗΣΗ & ΕΚΤΥΠΩΣΗ (F10)</button>
</div>

<script>
    let count = parseInt(localStorage.getItem('triton_dd_count')) || 1;

    function loadSystemSettings() {
        const s = JSON.parse(localStorage.getItem('bizSettings'));
        if (s) {
            document.getElementById('idxCompName').innerText = s.name || "ΕΠΩΝΥΜΙΑ";
            document.getElementById('idxActivity').innerText = s.job || "";
            document.getElementById('idxAddress').innerText = (s.address || "") + " " + (s.city || "");
            document.getElementById('idxTaxId').innerText = s.afm || "-";
            document.getElementById('idxTaxOffice').innerText = s.doy || "-";
            
            const logoImg = document.getElementById('viewCompLogo');
            if (s.logo) {
                logoImg.src = s.logo;
                logoImg.style.display = 'block';
            }
        }
    }

    function autoFillCustomer() {
        const name = document.getElementById('cName').value;
        const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
        if (db[name]) {
            document.getElementById('cTax').value = db[name].taxId || "";
            document.getElementById('cAddr').value = db[name].address || "";
            document.getElementById('deliveryPlace').value = db[name].address || "";
        }
    }

    function addRow() {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="p-name" placeholder="Είδος..." onkeydown="nav(event)"></td>
            <td><input type="text" value="ΤΕΜ" style="text-align:center;"></td>
            <td><input type="number" class="qty" style="text-align:center; font-weight:bold;"></td>
        `;
        document.getElementById('rowsBody').appendChild(tr);
    }

    function nav(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addRow();
            const lastRow = document.querySelector('#rowsBody tr:last-child .p-name');
            lastRow.focus();
        }
    }

    function processDelivery() {
        window.print();
        count++;
        localStorage.setItem('triton_dd_count', count);
        location.reload();
    }

    window.onload = () => {
        loadSystemSettings();
        document.getElementById('dtDisplay').innerText = new Date().toLocaleDateString('el-GR');
        document.getElementById('timeDisplay').value = new Date().toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('docNum').value = "ΔΔ" + count.toString().padStart(3, '0');
        addRow();
    };
</script>
</body>
</html>
