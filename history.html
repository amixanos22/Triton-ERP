 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton ERP - Ιστορικό Πωλήσεων</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* ΕΞΑΦΑΝΙΣΗ BLOGGER NAVBAR */
#navbar-iframe, 
.navbar, 
.navbar-themed, 
.Header, 
#header { 
    display: none !important; 
    height: 0 !important; 
    visibility: hidden !important; 
}

/* ΕΠΑΝΑΦΟΡΑ ΤΟΥ ΠΕΡΙΘΩΡΙΟΥ ΣΤΗΝ ΚΟΡΥΦΗ */
body { 
    top: 0 !important; 
    margin: 100 !important; 
    padding-top: 0 !important; 
}
      :root { --triton-blue: #0ea5e9; --triton-dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #334155; }
        
       .container {
    max-width: 1100px;
    margin: 100px auto; /* Το 40px δίνει κενό πάνω και κάτω */
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    margin-bottom: 100px; /* Δίνει έξτρα κενό στο τέλος για να μην τερματίζει απότομα */
}
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--triton-blue); padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--triton-dark); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--triton-dark); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card span { display: block; font-size: 32px; font-weight: 900; color: var(--triton-blue); }

        /* ΦΙΛΤΡΑ */
        .filters-area { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px; margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; }
        .filters-area select, .filters-area input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; outline: none; }
        .filters-area select:focus, .filters-area input:focus { border-color: var(--triton-blue); }

        /* ΠΙΝΑΚΑΣ */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8fafc; text-align: left; padding: 12px; font-size: 12px; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        tr:hover { background: #f0f9ff; }

        .badge-branch { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .btn-refresh { background: var(--triton-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📜 Αρχείο Παραστατικών Triton</h1>
        <button class="btn-refresh" onclick="loadHistory()">🔄 Ανανέωση Δεδομένων</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">ΣΥΝΟΛΟ ΠΑΡΑΣΤΑΤΙΚΩΝ<span id="count-inv">0</span></div>
        <div class="stat-card">ΣΥΝΟΛΙΚΟΣ ΤΖΙΡΟΣ (ΜΕ ΦΠΑ)<span id="grand-total">0.00€</span></div>
    </div>

    <div class="filters-area">
        <div class="filter-group">
            <label>Περίοδος</label>
            <select id="filterTime" onchange="applyFilters()">
                <option value="all">Όλο το ιστορικό</option>
                <option value="today">Σήμερα</option>
                <option value="month">Αυτός ο Μήνας</option>
                <option value="year">Τρέχον Έτος (2026)</option>
            </select>
        </div>
        <div class="filter-group" style="flex:1;">
            <label>Αναζήτηση Πελάτη</label>
            <input type="text" id="filterCustomer" placeholder="Όνομα ή ΑΦΜ..." onkeyup="applyFilters()">
        </div>
        <div class="filter-group" style="flex:1;">
            <label>Υποκατάστημα</label>
            <input type="text" id="filterBranch" placeholder="Περιοχή/Έδρα..." onkeyup="applyFilters()">
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ΗΜΕΡΟΜΗΝΙΑ</th>
                    <th>ΠΕΛΑΤΗΣ / ΥΠΟΚΑΤΑΣΤΗΜΑ</th>
                    <th>ΑΦΜ</th>
                    <th style="text-align:right;">ΚΑΘΑΡΗ ΑΞΙΑ</th>
                    <th style="text-align:right;">ΦΠΑ</th>
                    <th style="text-align:right;">ΤΕΛΙΚΟ ΣΥΝΟΛΟ</th>
                </tr>
            </thead>
            <tbody id="invoice-list">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ΣΗΜΑΝΤΙΚΟ: Βάλε τα δικά σου στοιχεία εδώ
    const _supabase = supabase.createClient('https://pizzmcznytsfqlxnttbv.supabase.co', 'sb_publishable_8lbtn4itPf_AD8UYz_rPMg_VvBBqY4G');
    
    let allInvoices = [];

    async function loadHistory() {
        console.log("Φόρτωση ιστορικού...");
        const { data, error } = await _supabase
            .from('invoices')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            alert("Σφάλμα σύνδεσης: " + error.message);
            return;
        }

        allInvoices = data;
        applyFilters();
    }

    function applyFilters() {
        const timeVal = document.getElementById('filterTime').value;
        const custVal = document.getElementById('filterCustomer').value.toLowerCase();
        const branchVal = document.getElementById('filterBranch').value.toLowerCase();
        
        const now = new Date();
        
        const filtered = allInvoices.filter(inv => {
            const invDate = new Date(inv.created_at);
            
            // 1. Φίλτρο Χρόνου
            let timeMatch = true;
            if (timeVal === 'today') timeMatch = invDate.toDateString() === now.toDateString();
            if (timeVal === 'month') timeMatch = invDate.getMonth() === now.getMonth() && invDate.getFullYear() === now.getFullYear();
            if (timeVal === 'year') timeMatch = invDate.getFullYear() === now.getFullYear();

            // 2. Φίλτρο Πελάτη (Όνομα ή ΑΦΜ)
            const custMatch = inv.customer_name.toLowerCase().includes(custVal) || 
                              (inv.customer_afm && inv.customer_afm.includes(custVal));

            // 3. Φίλτρο Υποκαταστήματος
            const branchMatch = (inv.branch_name || "ΕΔΡΑ").toLowerCase().includes(branchVal);

            return timeMatch && custMatch && branchMatch;
        });

        renderTable(filtered);
    }

    function renderTable(data) {
        const list = document.getElementById('invoice-list');
        let grandTotal = 0;
        list.innerHTML = '';

        data.forEach(inv => {
            grandTotal += parseFloat(inv.total_final || 0);
            
            list.innerHTML += `
                <tr>
                    <td>${new Date(inv.created_at).toLocaleDateString('el-GR')}</td>
                    <td>
                        <div style="font-weight:bold;">${inv.customer_name}</div>
                        <span class="badge-branch">${inv.branch_name || 'ΕΔΡΑ'}</span>
                    </td>
                    <td>${inv.customer_afm || '---'}</td>
                    <td style="text-align:right;">${inv.total_net}€</td>
                    <td style="text-align:right;">${inv.total_vat}€</td>
                    <td style="text-align:right; color:var(--triton-blue); font-weight:900;">${inv.total_final}€</td>
                </tr>
            `;
        });

        document.getElementById('grand-total').innerText = grandTotal.toFixed(2) + "€";
        document.getElementById('count-inv').innerText = data.length;
    }

    // Αρχική φόρτωση
    window.onload = loadHistory;
</script>
</body>
</html>
