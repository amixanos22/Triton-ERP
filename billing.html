  <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Triton ERP - Έκδοση Τιμολογίου</title>
    <style>
        :root { --triton-blue: #0ea5e9; --triton-dark: #1e293b; }
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        #invoice-container { 
            width: 1000px; margin: auto; background: white; padding: 40px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1); min-height: 1100px;
        }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 20px; }
        .logo img { max-height: 100px; max-width: 250px; object-fit: contain; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #f8fafc; padding: 15px; border-left: 5px solid var(--triton-blue); border-radius: 4px; }
        input { width: 100%; border: none; border-bottom: 1px solid #cbd5e1; background: transparent; padding: 5px; margin-bottom: 8px; outline: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; padding: 10px; text-align: left; border-bottom: 2px solid #000; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .total-section { margin-top: 30px; text-align: right; }
        .grand-total { font-size: 24px; font-weight: bold; color: var(--triton-blue); }
        @media print { .no-print { display: none; } #invoice-container { box-shadow: none; width: 100%; padding: 0; } }
    </style>
</head>
<body>

<div id="invoice-container">
    <div class="header">
        <div id="logoArea" class="logo"></div>
        <div id="compInfo">
            <h2 id="dispCompName" style="margin:0;">ΦΟΡΤΩΣΗ...</h2>
            <p id="dispAddress" style="margin:0; font-size:13px;"></p>
        </div>
        <div style="text-align:right;">
            <h3 style="color:var(--triton-blue); margin:0;">ΤΙΜΟΛΟΓΙΟ</h3>
            <p id="currentDate">--/--/----</p>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <label style="font-size:10px; font-weight:bold;">ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ</label>
                <button onclick="lookupMyData()" class="no-print" style="cursor:pointer; background:var(--triton-blue); color:white; border:none; border-radius:3px; padding:2px 5px; font-size:10px;">🔍 myDATA</button>
            </div>
            <input id="cName" list="custList" placeholder="Επωνυμία (ή αναζήτηση...)" onchange="autoFillCust()">
            <input id="cAfm" placeholder="ΑΦΜ">
            <input id="cDoy" placeholder="ΔΟΥ">
            <input id="cAddr" placeholder="Διεύθυνση">
            <input id="cCity" placeholder="Πόλη">
        </div>
       <div class="card" style="border-left-color: #64748b;">
    <label style="font-size:10px; font-weight:bold;">ΣΤΟΙΧΕΙΑ ΔΙΑΚΙΝΗΣΗΣ & ΥΠΟΚΑΤΑΣΤΗΜΑΤΑ</label>
    <input id="purpose" value="ΠΩΛΗΣΗ" placeholder="Σκοπός">
    <input id="car" placeholder="Αρ. Αυτοκινήτου">
    
    <input id="delivery" list="branchList" placeholder="Τόπος Παράδοσης (Αναζήτηση...)">
    <datalist id="branchList"></datalist>
    
    <input id="payment" placeholder="Τρόπος Πληρωμής">
</div>
    </div>

    <table id="itemsTable">
        <thead>
            <tr>
                <th style="width:50%">ΠΕΡΙΓΡΑΦΗ</th>
                <th style="width:10%">ΠΟΣ.</th>
                <th style="width:15%">ΤΙΜΗ</th>
                <th style="width:10%">ΦΠΑ %</th>
                <th style="width:15%; text-align:right;">ΣΥΝΟΛΟ</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <button onclick="addRow()" class="no-print" style="margin-top:10px; cursor:pointer;">+ Προσθήκη</button>

    <div class="total-section">
        <p>ΚΑΘΑΡΗ ΑΞΙΑ: <span id="netVal">0.00 €</span></p>
        <p>ΦΠΑ: <span id="taxVal">0.00 €</span></p>
        <p class="grand-total">ΣΥΝΟΛΟ: <span id="grandVal">0.00 €</span></p>
        <button onclick="window.print()" class="no-print" style="padding:15px 30px; background:black; color:white; border:none; font-weight:bold; cursor:pointer; margin-top:20px;">ΕΚΤΥΠΩΣΗ</button>
    </div>
</div>

<datalist id="custList"></datalist>
<datalist id="prodList"></datalist>

<script>
window.onload = () => {
    loadProfile();
    updateLists();
    addRow();
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('el-GR');
};

function loadProfile() {
    const s = JSON.parse(localStorage.getItem('triton_settings') || '{}');
    document.getElementById('dispCompName').innerText = s.companyName || "TRITON ERP";
    document.getElementById('dispAddress').innerText = `${s.address || ''}, ${s.city || ''} | ΑΦΜ: ${s.taxId || ''}`;
    if(s.logoBase64) document.getElementById('logoArea').innerHTML = `<img src="${s.logoBase64}">`;
}

// Η ΣΥΝΔΕΣΗ ΜΕ ΤΟ API ΤΗΣ VERCEL
async function lookupMyData() {
    const afm = document.getElementById('cAfm').value.trim();
    const s = JSON.parse(localStorage.getItem('triton_settings') || '{}');

    if (!afm || !s.mydataUser || !s.mydataKey) {
        alert("⚠️ Ελέγξτε το ΑΦΜ και τους κωδικούς myDATA στις Ρυθμίσεις.");
        return;
    }

    try {
        const res = await fetch(`/api/lookup?afm=${afm}&user=${s.mydataUser}&key=${s.mydataKey}`);
        if (!res.ok) throw new Error("Αποτυχία σύνδεσης με το API");
        
        const xmlText = await res.text();
        const xml = new DOMParser().parseFromString(xmlText, "text/xml");

        const info = {
            name: xml.getElementsByTagName("onomasia")[0]?.textContent || "",
            addr: xml.getElementsByTagName("dieythinsi")[0]?.textContent || "",
            doy: xml.getElementsByTagName("doy_descr")[0]?.textContent || "",
            city: xml.getElementsByTagName("poli")[0]?.textContent || ""
        };

        if (!info.name) {
            alert("❌ Το ΑΦΜ δεν βρέθηκε στο myDATA.");
            return;
        }

        document.getElementById('cName').value = info.name;
        document.getElementById('cAddr').value = info.addr;
        document.getElementById('cDoy').value = info.doy;
        document.getElementById('cCity').value = info.city;

        saveToCustDB(info, afm);
        autoFillCust(); // Για να τραβήξει και τα υποκαταστήματα αν υπάρχουν ήδη

    } catch (error) {
        alert("❌ Σφάλμα: " + error.message);
    }
}

function saveToCustDB(data, afm) {
    let db = JSON.parse(localStorage.getItem('customersDB') || '{}');
    if (!db[data.name]) {
        db[data.name] = {
            afm: afm,
            doy: data.doy,
            address: data.addr,
            city: data.city
        };
        localStorage.setItem('customersDB', JSON.stringify(db));
        updateLists(); 
        console.log("✅ Ο πελάτης αποθηκεύτηκε αυτόματα!");
    }
}

function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" list="prodList" class="p-name" placeholder="Προϊόν..." onchange="fillProd(this)"></td>
        <td><input type="number" class="qty" value="1" oninput="recalc()"></td>
        <td><input type="number" class="prc" value="0" oninput="recalc()"></td>
        <td><input type="number" class="tax" value="" placeholder="0" oninput="recalc()"></td>
        <td class="row-total" style="text-align:right; font-weight:bold;">0.00 €</td>
    `;
    document.getElementById('rows').appendChild(tr);
}

function fillProd(el) {
    const db = JSON.parse(localStorage.getItem('productsDB') || '{}');
    const p = db[el.value];
    if (p) {
        const r = el.closest('tr');
        r.querySelector('.prc').value = p.price || 0;
        r.querySelector('.tax').value = p.vat || 24;
        recalc();
    }
}

function recalc() {
    let net = 0, tax = 0;
    document.querySelectorAll('#rows tr').forEach(r => {
        const q = parseFloat(r.querySelector('.qty').value) || 0;
        const p = parseFloat(r.querySelector('.prc').value) || 0;
        const tx = parseFloat(r.querySelector('.tax').value) || 0;
        const lineNet = q * p;
        const lineTax = lineNet * (tx / 100);
        r.querySelector('.row-total').innerText = (lineNet + lineTax).toFixed(2) + " €";
        net += lineNet; tax += lineTax;
    });
    document.getElementById('netVal').innerText = net.toFixed(2) + " €";
    document.getElementById('taxVal').innerText = tax.toFixed(2) + " €";
    document.getElementById('grandVal').innerText = (net + tax).toFixed(2) + " €";
}

function updateLists() {
    const custs = JSON.parse(localStorage.getItem('customersDB') || '{}');
    const prods = JSON.parse(localStorage.getItem('productsDB') || '{}');
    const cList = document.getElementById('custList');
    const pList = document.getElementById('prodList');
    cList.innerHTML = ''; pList.innerHTML = '';
    Object.keys(custs).forEach(c => { let o = document.createElement('option'); o.value = c; cList.appendChild(o); });
    Object.keys(prods).forEach(p => { let o = document.createElement('option'); o.value = p; pList.appendChild(o); });
}

function autoFillCust() {
    const db = JSON.parse(localStorage.getItem('customersDB') || '{}');
    const customerName = document.getElementById('cName').value;
    const c = db[customerName];
    
    // Καθαρίζουμε τη λίστα υποκαταστημάτων πριν γεμίσει με τα νέα
    const branchList = document.getElementById('branchList');
    if (branchList) branchList.innerHTML = ''; 

    if (c) {
        // Τα βασικά στοιχεία που ήδη είχες
        document.getElementById('cAfm').value = c.afm || "";
        document.getElementById('cDoy').value = c.doy || "";
        document.getElementById('cAddr').value = (c.address || "") + " " + (c.city || "");
        
        // --- ΕΔΩ ΓΙΝΕΤΑΙ Η ΜΑΓΕΙΑ ΓΙΑ ΤΑ ΥΠΟΚΑΤΑΣΤΗΜΑΤΑ ---
        // Αν ο πελάτης έχει αποθηκευμένα υποκαταστήματα (π.χ. Σ/Μ Σκλαβενίτης -> Περιστέρι, Μενίδι)
        if (c.branches && Array.isArray(c.branches)) {
            c.branches.forEach(branch => {
                let opt = document.createElement('option');
                opt.value = branch; // Το όνομα του υποκαταστήματος
                branchList.appendChild(opt);
            });
        }
    }
}
</script>
</body>
</html>
